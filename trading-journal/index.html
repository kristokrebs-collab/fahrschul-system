<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="BTC Trade Journal – Journal, Live-Markt und Entscheidungsgrundlagen für BTC-Perpetuals." />
    <title>BTC Trade Journal</title>
    <!-- ink background before the stylesheet arrives: no white flash on the first frame -->
    <style>
      html,
      body {
        background: #0a0a0a;
      }
    </style>
    <!-- the market bootstraps over REST and then streams over WebSocket: open both connections while the bundle loads -->
    <link rel="preconnect" href="https://fapi.binance.com" crossorigin />
    <link rel="dns-prefetch" href="https://fstream.binance.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Doto:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
