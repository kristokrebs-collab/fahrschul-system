<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mega-Test Prüfstand</title>
<style>
/* Design-These: ein Beobachtungsfenster. Tausende Pfade laufen hinter Glas, EIN Tor entscheidet. Signatur: der Fächer aus
   10.000 simulierten Pfaden (grün = Gewinn, rot = Verlust) mit leuchtendem Median. Farbe nur für Ergebnis (grün/rot), Rest Glas und Grau.
   Bewegung: Eintritt ease-out, Zahlen rollen, Fächer zeichnet sich in 1,4 s; nichts linear. Reduced-Motion: sofort Endzustand. */
:root { --bg:#07080c; --ink:#eef1f6; --muted:#8e95a6; --ok:#3be0a8; --no:#ff5a6e; --warn:#f5b84a; --blue:#7aa2ff; --edge:rgba(255,255,255,.14); --tint:rgba(255,255,255,.07); --tint2:rgba(255,255,255,.02); --shadow:rgba(0,0,0,.45);
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace; --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in:cubic-bezier(.55,.08,.4,.95); --spring:cubic-bezier(.34,1.56,.64,1); --a:#16c79a; --b:#6a5cff; --c:#ff9a62; }
:root[data-theme="light"] { --bg:#eef0f7; --ink:#14171f; --muted:#5d6475; --ok:#0f9d6c; --no:#d6364a; --warn:#a96a00; --blue:#2e5be0; --edge:rgba(255,255,255,.9); --tint:rgba(255,255,255,.62); --tint2:rgba(255,255,255,.3); --shadow:rgba(60,50,90,.2); --a:#8be6da; --b:#a9a0ff; --c:#ffb98a; }
* { box-sizing:border-box; }
html { background:var(--bg); }
body { margin:0; color:var(--ink); font:14px/1.5 var(--sans); background:transparent; }
body::before { content:""; position:fixed; inset:-20%; z-index:-1; pointer-events:none; opacity:.5; will-change:transform;
  background:radial-gradient(40% 38% at 20% 22%,var(--a),transparent 70%),radial-gradient(38% 40% at 82% 18%,var(--b),transparent 70%),radial-gradient(44% 40% at 60% 85%,var(--c),transparent 72%);
  animation:drift 40s var(--ease-out) infinite alternate; }
@keyframes drift { from { transform:translate3d(-2%,1%,0) scale(1); } to { transform:translate3d(3%,-2%,0) scale(1.08); } }
.wrap { max-width:1180px; margin:0 auto; padding:22px 16px 60px; display:grid; gap:16px; }
.glass { background:linear-gradient(145deg,var(--tint),var(--tint2) 55%,var(--tint)); border:1px solid var(--edge); border-radius:22px; -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);
  box-shadow:inset 0 1px 0 var(--edge),0 16px 44px var(--shadow); padding:18px; }
header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end; justify-content:space-between; }
h1 { margin:0; font-size:clamp(22px,4vw,34px); letter-spacing:-.02em; line-height:1.1; }
h1 em { font-style:normal; color:var(--ok); }
.sub { color:var(--muted); font-size:13px; margin-top:4px; }
.badges { display:flex; flex-wrap:wrap; gap:8px; }
.badge,.tbtn { font:11px var(--mono); letter-spacing:.04em; text-transform:uppercase; color:var(--muted); border:1px solid var(--edge); border-radius:999px; padding:6px 12px; background:var(--tint2); }
.badge.sim { color:var(--warn); } .tbtn { cursor:pointer; color:var(--ink); font:500 12px var(--sans); text-transform:none; transition:transform .2s var(--spring); } .tbtn:active { transform:scale(.94); }
.tbtn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
h2 { margin:0 0 10px; font:600 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.hero { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:16px; }
@media (max-width:860px) { .hero { grid-template-columns:1fr; } }
canvas { display:block; width:100%; }
#fan { height:430px; touch-action:pan-y; }
.stats { display:grid; gap:10px; align-content:start; }
.stat { border:1px solid var(--edge); border-radius:16px; padding:12px 14px; background:var(--tint2); }
.stat small { display:block; color:var(--muted); font:11px var(--mono); text-transform:uppercase; letter-spacing:.06em; }
.stat b { font:700 26px/1.2 var(--mono); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.stat b.g { color:var(--ok); } .stat b.r { color:var(--no); }
.legend { display:flex; gap:16px; flex-wrap:wrap; font:11px var(--mono); color:var(--muted); margin-top:6px; }
.legend i { display:inline-block; width:18px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px; }
.gate { display:grid; grid-template-columns:minmax(0,1fr) 250px; gap:16px; }
@media (max-width:860px) { .gate { grid-template-columns:1fr; } }
.check { display:flex; align-items:center; gap:12px; border:1px solid var(--edge); border-radius:14px; padding:10px 12px; margin-bottom:8px; background:var(--tint2); opacity:0; transform:translate3d(0,10px,0); animation:in .5s var(--ease-out) forwards; animation-delay:calc(var(--n)*90ms + 600ms); }
@keyframes in { to { opacity:1; transform:none; } }
.check .dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; color:#06130f; flex:none; }
.check.ok .dot { background:var(--ok); } .check.no .dot { background:var(--no); color:#fff; } .check.no { border-color:rgba(255,90,110,.45); }
.check span { flex:1; } .check code { font:12px var(--mono); color:var(--muted); }
.stamp { border:2px solid var(--no); border-radius:18px; display:grid; place-content:center; text-align:center; padding:20px; min-height:200px; }
.stamp.ok { border-color:var(--ok); }
.stamp b { font:800 26px var(--mono); letter-spacing:.04em; color:var(--no); transform:rotate(-4deg) scale(1.6); opacity:0; animation:stamp .5s var(--spring) 1.6s forwards; }
.stamp.ok b { color:var(--ok); }
@keyframes stamp { to { transform:rotate(-4deg) scale(1); opacity:1; } }
.stamp p { margin:10px 0 0; color:var(--muted); font-size:12px; }
.g2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; } @media (max-width:860px) { .g2 { grid-template-columns:1fr; } }
table { width:100%; border-collapse:collapse; font:12.5px var(--mono); } th { text-align:left; color:var(--muted); font-weight:500; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--edge); } td { padding:7px 8px; border-bottom:1px dashed var(--edge); }
.note { font-size:12px; color:var(--muted); margin-top:8px; }
.dots { overflow-x:auto; }
.pill { display:inline-block; font:11px var(--mono); padding:3px 8px; border-radius:999px; border:1px solid var(--edge); }
.pill.w { color:var(--warn); } .ob { display:flex; justify-content:space-between; gap:10px; border:1px dashed var(--edge); border-radius:12px; padding:8px 12px; margin-bottom:6px; font:12px var(--mono); }
.ob button { font:12px var(--sans); border:1px solid var(--edge); border-radius:999px; background:var(--tint2); color:var(--muted); padding:4px 12px; cursor:not-allowed; }
footer { color:var(--muted); font-size:12px; }
@media (prefers-reduced-motion:reduce) { body::before { animation:none; } .check { animation:none; opacity:1; transform:none; } .stamp b { animation:none; opacity:1; transform:rotate(-4deg); } }
@media (prefers-reduced-transparency:reduce) { .glass { -webkit-backdrop-filter:none; backdrop-filter:none; background:var(--tint); } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="results" type="application/json">null</script>
<script>
(function () {
  var d = JSON.parse(document.getElementById('results').textContent);
  var app = document.getElementById('app');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var pct = function (v, n) { return (v * 100).toFixed(n == null ? 1 : n) + ' %'; }, f2 = function (v) { return v.toFixed(2); };
  var easeOut = function (t) { return 1 - Math.pow(1 - t, 4); };
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var dt = function (x) { x = String(x); return x.slice(6, 8) + '.' + x.slice(4, 6) + '.' + x.slice(0, 4); };
  function pstr(p) { return p.up + '/' + p.down + ' · Keltner ' + p.kelt + ' · Vola ' + (p.ziel_vola * 100).toFixed(1) + ' % · Hebel ' + p.max_hebel; }
  if (!d) { app.innerHTML = '<div class="glass">Keine Daten eingebettet. Erzeugen mit <code>make_dashboard.py --template megatest</code>.</div>'; return; }
  var mc = d.monte_carlo, ok = d.entscheidung === 'UEBERNOMMEN';

  // ----- Kopf
  var hd = el('header', '', '<div><h1>Mega-Test: <em>' + d.n_varianten.toLocaleString('de-DE') + '</em> Varianten, ein Tor</h1><div class="sub">Nur Rückblick-Simulation. Auswahl auf den ersten 80 % der Daten, die letzten 20 % bleiben Prüfdaten.</div></div>');
  hd.appendChild(el('div', 'badges', '<span class="badge sim">Simulation / Papier</span><span class="badge">Daten ' + d.daten_von.slice(0, 4) + ' bis ' + d.daten_bis.slice(0, 4) + '</span><span class="badge">' + d.branchen + ' Branchen</span><span class="badge">Kosten ' + d.kosten_bp + ' bp</span><button class="tbtn" id="theme" type="button">Hell / Dunkel</button>'));
  app.appendChild(hd);

  // ----- Fächer
  var hero = el('section', 'hero');
  var fanBox = el('div', 'glass', '<h2>' + mc.pfade.toLocaleString('de-DE') + ' simulierte Pfade, 5 Jahre (Block-Bootstrap der Kandidatin)</h2><canvas id="fan" role="img" aria-label="Fächerdiagramm simulierter Vermögenspfade"></canvas><div class="legend"><span><i style="background:var(--ok)"></i>Pfade mit Gewinn (' + pct(mc.anteil_gruen, 0) + ')</span><span><i style="background:var(--no)"></i>Pfade mit Verlust (' + pct(mc.p_verlust, 0) + ')</span><span><i style="background:var(--ink)"></i>Median</span><span>Bänder: 25–75 % und 5–95 %</span></div>');
  var st = el('div', 'stats');
  [['Median nach 5 J.', mc.median, 'x', ''], ['Schlechte 5 % (P05)', mc.p05, 'x', mc.p05 < 1 ? 'r' : ''], ['Gute 5 % (P95)', mc.p95, 'x', 'g'], ['Verlustchance', mc.p_verlust * 100, '%', mc.p_verlust > .2 ? 'r' : 'g']].forEach(function (s) {
    st.appendChild(el('div', 'stat', '<small>' + s[0] + '</small><b class="' + s[3] + '" data-v="' + s[1] + '" data-u="' + s[2] + '">–</b>'));
  });
  st.appendChild(el('div', 'stat', '<small>Typ. größter Rückgang</small><b>' + pct(mc.dd_median, 0) + '</b><div class="note">in 5 % der Fälle über ' + pct(mc.dd_p95, 0) + '</div>'));
  hero.appendChild(fanBox); hero.appendChild(st); app.appendChild(hero);

  // ----- Tor
  var gate = el('section', 'gate');
  var left = el('div', 'glass', '<h2>Das Tor: Kandidatin ' + esc(pstr(d.kandidatin.parameter)) + '</h2>');
  d.checks.forEach(function (c, i) { left.appendChild(el('div', 'check ' + (c.ok ? 'ok' : 'no'), '<span class="dot" aria-hidden="true">' + (c.ok ? '✓' : '×') + '</span><span>' + esc(c.name) + '</span><code>' + esc(c.wert) + '</code>')).style.setProperty('--n', i); });
  var rk = el('div', 'note', 'Rang-Korrelation Entwicklung+Validierung gegen Endtest über alle ' + d.n_varianten.toLocaleString('de-DE') + ' Varianten: <b>' + f2(d.rang_korrelation) + '</b>. Nahe 0 heißt: wer vorn lag, blieb nicht vorn.');
  left.appendChild(rk);
  var stamp = el('div', 'stamp' + (ok ? ' ok' : ''), '<div><b>' + (ok ? 'IM VAULT' : 'VERWORFEN') + '</b><p>' + (ok ? 'Alle Prüfungen bestanden, Strategie liegt im Vault.' : 'Mindestens eine Prüfung nicht bestanden: Basis ' + d.basis.parameter.up + '/' + d.basis.parameter.down + ' bleibt, nichts wird gespeichert.') + '</p></div>');
  gate.appendChild(left); gate.appendChild(stamp); app.appendChild(gate);

  // ----- Streudiagramm + Top
  var g2 = el('section', 'g2');
  g2.appendChild(el('div', 'glass', '<h2>Vorn in der Auswahl, vorn im Endtest? (Sharpe je Variante)</h2><canvas id="sc" style="height:330px" role="img" aria-label="Streudiagramm Auswahl gegen Endtest"></canvas><div class="note">Jeder Punkt eine Variante. Punkte unter der Linie sind im Endtest schlechter als in der Auswahl. Weiß = Basis, farbig = Kandidatin.</div>'));
  var tt = '<table><tr><th>Parameter</th><th>Auswahl</th><th>Endtest</th></tr>';
  d.top.slice(0, 10).forEach(function (r) { tt += '<tr><td>' + esc(r.parameter.up + '/' + r.parameter.down + ' · K' + r.parameter.kelt + ' · V' + (r.parameter.ziel_vola * 100).toFixed(1) + ' · H' + r.parameter.max_hebel) + '</td><td>' + f2(r.devval) + '</td><td style="color:' + (r.endtest < d.basis.kennzahlen.endtest.sharpe ? 'var(--no)' : 'var(--ok)') + '">' + f2(r.endtest) + '</td></tr>'; });
  tt += '</table><div class="note">Basis (Paper-Werte) im Endtest: Sharpe ' + f2(d.basis.kennzahlen.endtest.sharpe) + '. Anteil aller Varianten, die im Endtest besser als die Basis sind: ' + pct(d.anteil_endtest_besser_als_basis, 0) + '.</div>';
  g2.appendChild(el('div', 'glass', '<h2>Die 10 besten der Auswahl und ihr Endtest</h2>' + tt));
  app.appendChild(g2);

  // ----- Kurve
  app.appendChild(el('section', 'glass', '<h2>Vermögenskurve nach Kosten (logarithmisch, Start = 1)</h2><div id="eq"></div><div class="legend"><span><i style="background:var(--blue)"></i>Kandidatin</span><span><i style="background:var(--warn)"></i>Basis</span><span><i style="background:var(--muted)"></i>Markt</span><span>Hintergrund: Entwicklung | Validierung | Endtest</span></div>'));

  // ----- Signale, Protokoll, Freigabe
  var sg = d.signale, g3 = el('section', 'g2');
  var rows = {}; sg.ereignisse.forEach(function (e) { (rows[e.branche] = rows[e.branche] || []).push(e); });
  var dates = Array.from(new Set(sg.ereignisse.map(function (e) { return e.datum; }))).sort();
  var rn = Object.keys(rows).slice(0, 14), W = 520, H = 22 + rn.length * 22, svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Demo-Signale: grüner Punkt Kauf, roter Punkt Verkauf">';
  rn.forEach(function (n, i) { var y = 20 + i * 22; svg += '<text x="0" y="' + (y + 4) + '" fill="' + css('--muted') + '" font-size="10" font-family="monospace">' + esc(n.trim()) + '</text><line x1="90" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="' + css('--edge') + '"/>'; rows[n].forEach(function (e) { var x = 96 + (dates.indexOf(e.datum) / Math.max(1, dates.length - 1)) * (W - 110); svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y + '" r="5" fill="' + (e.punkt === 'gruen' ? css('--ok') : css('--no')) + '"><title>' + esc(e.signal + ' ' + e.branche + ' ' + dt(e.datum)) + '</title></circle>'; }); });
  svg += '</svg>';
  g3.appendChild(el('div', 'glass dots', '<h2>Demo-Signale, letzte 60 Handelstage</h2>' + svg + '<div class="legend"><span><i style="background:var(--ok);height:10px;width:10px;border-radius:50%"></i>Demo-Kauf</span><span><i style="background:var(--no);height:10px;width:10px;border-radius:50%"></i>Demo-Verkauf</span></div><div class="note">Stand der Daten: ' + dt(sg.stand) + ' (nicht live). Jedes Signal steht im Protokoll <code>vault/protokoll.jsonl</code>, gesendet wird nichts.</div>'));
  var ob = '<h2>Freigabe-Warteschlange <span class="pill w">Papier</span></h2>';
  var pending = (window.__outbox || []);
  ob += '<div class="note">Nichts wird ausgeführt, bevor du im Chat ausdrücklich „Ja“ sagst. Dieser Knopf ist absichtlich gesperrt.</div>';
  sg.positionen.slice(0, 6).forEach(function (p) { ob += '<div class="ob"><span>' + esc(p.branche.trim()) + ' · Gewicht ' + pct(p.gewicht, 1) + '</span><button type="button" disabled title="Nur manuell im Chat">Freigabe im Chat</button></div>'; });
  if (!sg.positionen.length) ob += '<div class="ob"><span>Keine offenen Demo-Positionen.</span></div>';
  ob += '<div class="note">Vault: ' + d.vault.eintraege + ' Eintrag/Einträge' + (d.vault.gespeichert_diesmal ? ' (neu gespeichert)' : ', diesmal nichts gespeichert') + '.</div>';
  g3.appendChild(el('div', 'glass', ob)); app.appendChild(g3);
  app.appendChild(el('footer', '', esc(d.hinweis) + ' Erzeugt am ' + esc(d.erstellt.slice(0, 10)) + ', Laufzeit ' + d.laufzeit_s + ' s.'));

  // ----- Zahlenrollen
  function roll() {
    var els = [].slice.call(document.querySelectorAll('.stat b[data-v]')), t0 = null;
    function fmt(b, v) { return b.dataset.u === '%' ? v.toFixed(1) + ' %' : v.toFixed(2) + '×'; }
    if (reduce) { els.forEach(function (b) { b.textContent = fmt(b, +b.dataset.v); }); return; }
    function step(t) { if (!t0) t0 = t; var p = Math.min(1, (t - t0 - 500) / 1100); p = p < 0 ? 0 : easeOut(p);
      els.forEach(function (b) { b.textContent = fmt(b, +b.dataset.v * p); }); if (p < 1) requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }

  // ----- Fächer zeichnen
  var fan = document.getElementById('fan'), fc = fan.getContext('2d'), prog = reduce ? 1 : 0, hov = -1, queued = false;
  function sizeCanvas(c) { var r = c.getBoundingClientRect(), k = Math.min(window.devicePixelRatio || 1, 2); c.width = Math.round(r.width * k); c.height = Math.round(r.height * k); var x = c.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0); return { w: r.width, h: r.height, x: x }; }
  function drawFan() {
    var s = sizeCanvas(fan), x = s.x, W = s.w, H = s.h, L = 50, R = W < 520 ? 14 : 70, T = 14, B = 28, pw = W - L - R, ph = H - T - B, n = mc.baender['50'].length;
    var lo = Math.min.apply(null, mc.baender['5']) * 0.8, hi = Math.max.apply(null, mc.baender['95']) * 1.15; lo = Math.max(lo, 0.2); var ll = Math.log(lo), lh = Math.log(hi);
    var X = function (i) { return L + i / (n - 1) * pw; }, Y = function (v) { return T + ph - (Math.log(Math.max(v, lo)) - ll) / (lh - ll) * ph; };
    x.clearRect(0, 0, W, H);
    x.font = '10px ' + css('--mono'); x.fillStyle = css('--muted'); x.strokeStyle = 'rgba(128,140,160,.18)'; x.lineWidth = 1;
    [0.5, 1, 2, 4, 8, 16].forEach(function (v) { if (v < lo || v > hi) return; var y = Y(v); x.beginPath(); x.moveTo(L, y); x.lineTo(L + pw, y); x.stroke(); x.fillText(v + '×', 8, y + 3); });
    for (var yr = 0; yr <= 5; yr++) { var xx = L + yr / 5 * pw; x.fillText(yr + ' J', xx - 6, H - 8); }
    // Startachse
    var gl = x.createLinearGradient(0, T, 0, T + ph); gl.addColorStop(0, 'rgba(255,255,255,0)'); gl.addColorStop(.5, 'rgba(255,255,255,.7)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
    x.strokeStyle = gl; x.lineWidth = 2; x.beginPath(); x.moveTo(L, T); x.lineTo(L, T + ph); x.stroke();
    x.save(); x.beginPath(); x.rect(L - 4, 0, pw * prog + 8, H); x.clip();
    x.globalCompositeOperation = css('--bg') === '#eef0f7' ? 'source-over' : 'lighter'; x.lineWidth = 1.1; x.lineJoin = 'round';
    function paths(list, col) { x.strokeStyle = col; list.forEach(function (p) { x.beginPath(); p.forEach(function (v, i) { i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)); }); x.stroke(); }); }
    var light = document.documentElement.dataset.theme === 'light';
    paths(mc.zeige_rot, light ? 'rgba(214,54,74,.16)' : 'rgba(255,90,110,.16)'); paths(mc.zeige_gruen, light ? 'rgba(15,157,108,.16)' : 'rgba(59,224,168,.16)');
    x.globalCompositeOperation = 'source-over';
    function band(a, b, col) { x.beginPath(); a.forEach(function (v, i) { i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)); }); for (var i = b.length - 1; i >= 0; i--) x.lineTo(X(i), Y(b[i])); x.closePath(); x.fillStyle = col; x.fill(); }
    band(mc.baender['95'], mc.baender['5'], light ? 'rgba(46,91,224,.07)' : 'rgba(122,162,255,.07)'); band(mc.baender['75'], mc.baender['25'], light ? 'rgba(46,91,224,.13)' : 'rgba(122,162,255,.14)');
    x.shadowColor = light ? 'rgba(46,91,224,.5)' : 'rgba(255,255,255,.7)'; x.shadowBlur = 12; x.strokeStyle = css('--ink'); x.lineWidth = 2.4; x.beginPath();
    mc.baender['50'].forEach(function (v, i) { i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v)); }); x.stroke(); x.shadowBlur = 0;
    x.restore();
    // Einsatz-Linie 1x
    x.setLineDash([4, 4]); x.strokeStyle = 'rgba(128,140,160,.5)'; x.beginPath(); x.moveTo(L, Y(1)); x.lineTo(L + pw, Y(1)); x.stroke(); x.setLineDash([]);
    if (prog >= 1) {
      [['95', 'ok'], ['50', 'ink'], ['5', 'no']].forEach(function (q) { var v = mc.baender[q[0]][n - 1], y = Y(v); x.fillStyle = css('--' + q[1]); x.beginPath(); x.arc(X(n - 1), y, 4, 0, 6.3); x.fill(); if (R > 40) x.fillText(v.toFixed(2) + '×', X(n - 1) + 8, y + 3); });
      if (hov >= 0) { var hx = X(hov); x.strokeStyle = 'rgba(128,140,160,.6)'; x.beginPath(); x.moveTo(hx, T); x.lineTo(hx, T + ph); x.stroke();
        var txt = (hov / (n - 1) * 5).toFixed(1) + ' J: P05 ' + mc.baender['5'][hov].toFixed(2) + '× · Median ' + mc.baender['50'][hov].toFixed(2) + '× · P95 ' + mc.baender['95'][hov].toFixed(2) + '×';
        x.font = '11px ' + css('--mono'); var tw = x.measureText(txt).width + 16, bx = Math.min(Math.max(hx - tw / 2, L), L + pw - tw); x.fillStyle = light ? 'rgba(255,255,255,.92)' : 'rgba(10,12,18,.88)'; x.fillRect(bx, T + 2, tw, 22); x.fillStyle = css('--ink'); x.fillText(txt, bx + 8, T + 17); }
    }
  }
  function schedule() { if (queued) return; queued = true; requestAnimationFrame(function () { queued = false; drawFan(); }); }
  function animateFan() {
    if (reduce) { drawFan(); return; }
    var t0 = null; (function step(t) { if (!t0) t0 = t; prog = easeOut(Math.min(1, (t - t0 - 300) / 1500)); if (prog < 0) prog = 0; drawFan(); if (prog < 1) requestAnimationFrame(step); })(performance.now());
  }
  fan.addEventListener('pointermove', function (e) { if (prog < 1) return; var r = fan.getBoundingClientRect(), n = mc.baender['50'].length, L = 50, R = r.width < 520 ? 14 : 70, i = Math.round((e.clientX - r.left - L) / (r.width - L - R) * (n - 1)); hov = i >= 0 && i < n ? i : -1; schedule(); });
  fan.addEventListener('pointerleave', function () { hov = -1; schedule(); });

  // ----- Streudiagramm
  function drawScatter() {
    var c = document.getElementById('sc'), s = sizeCanvas(c), x = s.x, W = s.w, H = s.h, L = 36, B = 26, T = 10, R = 10, pts = d.streu, xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var mn = Math.min(Math.min.apply(null, xs), Math.min.apply(null, ys)) - .05, mx = Math.max(Math.max.apply(null, xs), Math.max.apply(null, ys)) + .05;
    var X = function (v) { return L + (v - mn) / (mx - mn) * (W - L - R); }, Y = function (v) { return H - B - (v - mn) / (mx - mn) * (H - B - T); };
    x.clearRect(0, 0, W, H); x.strokeStyle = 'rgba(128,140,160,.25)'; x.fillStyle = css('--muted'); x.font = '10px ' + css('--mono');
    x.beginPath(); x.moveTo(L, H - B); x.lineTo(W - R, H - B); x.moveTo(L, T); x.lineTo(L, H - B); x.stroke();
    x.setLineDash([4, 4]); x.beginPath(); x.moveTo(X(mn), Y(mn)); x.lineTo(X(mx), Y(mx)); x.stroke(); x.setLineDash([]);
    x.fillText('Auswahl-Sharpe', W - 96, H - 8); x.save(); x.translate(10, 90); x.rotate(-Math.PI / 2); x.fillText('Endtest-Sharpe', 0, 0); x.restore();
    var light = document.documentElement.dataset.theme === 'light'; x.fillStyle = light ? 'rgba(46,91,224,.32)' : 'rgba(122,162,255,.38)';
    pts.forEach(function (p) { x.beginPath(); x.arc(X(p[0]), Y(p[1]), 2.6, 0, 6.3); x.fill(); });
    function ring(dv, et, col, lab) { x.strokeStyle = col; x.lineWidth = 2; x.beginPath(); x.arc(X(dv), Y(et), 6, 0, 6.3); x.stroke(); x.fillStyle = col; var tw = x.measureText(lab).width; x.fillText(lab, X(dv) + 9 + tw > W - 4 ? X(dv) - 9 - tw : X(dv) + 9, Y(et) + 3); }
    ring(d.basis.kennzahlen.devval.sharpe, d.basis.kennzahlen.endtest.sharpe, css('--ink'), 'Basis');
    ring(d.kandidatin.kennzahlen.devval.sharpe, d.kandidatin.kennzahlen.endtest.sharpe, ok ? css('--ok') : css('--no'), 'Kandidatin');
  }

  // ----- Kurve
  var eqFirst = true;
  function drawEq() {
    var k = d.kurve, W = 1100, H = 300, L = 44, B = 22, T = 8, series = [['markt', css('--muted')], ['basis', css('--warn')], ['kandidatin', css('--blue')]], all = [];
    series.forEach(function (s) { all = all.concat(k[s[0]]); });
    var lo = Math.log(Math.min.apply(null, all)), hi = Math.log(Math.max.apply(null, all)), n = k.kandidatin.length;
    var X = function (i) { return L + i / (n - 1) * (W - L - 6); }, Y = function (v) { return T + (H - T - B) * (1 - (Math.log(v) - lo) / (hi - lo)); };
    var g = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Vermögenskurven">';
    g += '<rect x="' + X(0) + '" y="' + T + '" width="' + (X(k.i1) - X(0)) + '" height="' + (H - T - B) + '" fill="rgba(122,162,255,.06)"/><rect x="' + X(k.i1) + '" y="' + T + '" width="' + (X(k.i2) - X(k.i1)) + '" height="' + (H - T - B) + '" fill="rgba(245,184,74,.07)"/><rect x="' + X(k.i2) + '" y="' + T + '" width="' + (X(n - 1) - X(k.i2)) + '" height="' + (H - T - B) + '" fill="rgba(59,224,168,.07)"/>';
    for (var e = Math.ceil(lo / Math.LN10); e <= hi / Math.LN10; e++) { var y = Y(Math.pow(10, e)); g += '<line x1="' + L + '" x2="' + (W - 6) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(128,140,160,.2)"/><text x="4" y="' + (y + 3) + '" fill="' + css('--muted') + '" font-size="10" font-family="monospace">10^' + e + '</text>'; }
    series.forEach(function (s) { var p = ''; k[s[0]].forEach(function (v, i) { p += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }); g += '<path d="' + p + '" fill="none" stroke="' + s[1] + '" stroke-width="' + (s[0] === 'kandidatin' ? 2.2 : 1.5) + '" stroke-linejoin="round" pathLength="1" style="' + (s[0] === 'kandidatin' && !reduce && eqFirst ? 'stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s cubic-bezier(.16,1,.3,1) .4s forwards' : '') + '"/>'; });
    g += '<text x="' + (X(0) + 4) + '" y="' + (H - 6) + '" fill="' + css('--muted') + '" font-size="10" font-family="monospace">Entwicklung ' + k.datum[0].slice(0, 4) + '</text><text x="' + (X(k.i1) + 4) + '" y="' + (H - 6) + '" fill="' + css('--muted') + '" font-size="10" font-family="monospace">Validierung ' + k.datum[k.i1].slice(0, 4) + '</text><text x="' + (X(k.i2) + 4) + '" y="' + (H - 6) + '" fill="' + css('--muted') + '" font-size="10" font-family="monospace">Endtest ' + k.datum[k.i2].slice(0, 4) + '</text></svg>';
    document.getElementById('eq').innerHTML = g; eqFirst = false;
  }
  var sty = document.createElement('style'); sty.textContent = '@keyframes draw { to { stroke-dashoffset:0; } }'; document.head.appendChild(sty);
  function redrawAll() { drawFan(); drawScatter(); drawEq(); }
  document.getElementById('theme').onclick = function () { var r = document.documentElement; r.dataset.theme = (r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'dark' ? 'light' : 'dark'; redrawAll(); };
  var rt = 0; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(redrawAll, 120); });
  drawScatter(); drawEq(); animateFan(); roll();
})();
