<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motion Footer</title>
<style>
/* ==========================================================================
   CONFIG - alle Look-/Motion-Werte (zum "Hochdrehen" nur hier aendern)
   Referenz-Viewport 1234x673, Aufnahme 120 Hz
   ========================================================================== */
:root{
  /* --- Farben (gemessen) --- */
  --mf-bg:#1f1f1f;                 /* Buehne + Vorhang + Footer (flach) */
  --mf-hero-ink:#8d8d8d;           /* "SCROLL DOWN TO REVEAL" */
  --mf-hero-line:#2f2f2f;          /* Scroll-Hinweis-Strich */
  --mf-headline-ink:#0d0d0d;       /* "Ready to begin?" dunkler als der Grund */
  --mf-text:#f6f6f6;               /* Button-Text */
  --mf-text-dim:#a9a9a9;           /* kleine Pills / Copyright */
  --mf-icon:#8f8f8f;               /* Apple/Android-Icon */
  --mf-accent:#ff6b81;             /* Herz */
  --mf-edge:rgba(255,255,255,.07); /* Rahmen der Pills */
  --mf-glow:rgba(255,255,255,.06); /* heller Schein unter Buttons */
  --mf-ghost:rgba(255,255,255,.015);/* Riesenwort + Raster im Hintergrund */

  /* --- Masse --- */
  --mf-curtain-radius:22px;        /* untere Ecken des Vorhangs */
  --mf-curtain-extra:117px;        /* Vorhang ist so viel hoeher als die Buehne */
  --mf-headline-size:100px;        /* "Ready to begin?" */
  --mf-ghost-size:300px;           /* Riesenwort unten (angeschnitten) */

  /* --- Motion (Dauern in ms, Verzoegerungen nach dem Aufdecken) --- */
  --mf-ease-out:cubic-bezier(.16,1,.3,1);   /* ease-out, sanftes Auslaufen */
  --mf-dur-headline:450ms;  --mf-delay-headline:0ms;     /* Headline: Fade + 27px Hub */
  --mf-dur-buttons:1100ms;  --mf-delay-buttons:380ms;    /* Download-Buttons */
  --mf-dur-pills:1100ms;    --mf-delay-pills:460ms;      /* Privacy/Terms/Support */
  --mf-dur-marquee:700ms;   --mf-delay-marquee:800ms;    /* Ticker-Band gleitet ein */
  --mf-rise:27px;                  /* Hub der Headline */
  --mf-rise-ui:14px;               /* Hub Buttons/Pills */
  --mf-band-tilt:-1.8deg;          /* Endneigung des Tickers */
  --mf-band-tilt-from:-3.6deg;     /* Startneigung beim Einblenden */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--mf-bg);color:var(--mf-text);font-family:Inter,Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0}

/* COMPONENT CSS */
.mf{position:relative;width:100%;height:100%;overflow:hidden;background:var(--mf-bg);contain:layout paint}
.mf-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#6b6b6b transparent;outline:none}
.mf-scroll::-webkit-scrollbar{width:5px}
.mf-scroll::-webkit-scrollbar-thumb{background:#6b6b6b;border-radius:3px}
.mf-curtain{position:relative;z-index:2;height:calc(100% + var(--mf-curtain-extra));background:var(--mf-bg);border-radius:0 0 var(--mf-curtain-radius) var(--mf-curtain-radius);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.mf-hero{position:absolute;left:0;right:0;top:0;height:calc(100% - 0px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:32px}
.mf-hero h2{margin:0;font-weight:300;font-size:clamp(22px,4.5vw,56px);letter-spacing:.3em;margin-right:-.3em;color:var(--mf-hero-ink);text-transform:uppercase;white-space:nowrap}
.mf-hero i{display:block;width:1px;height:90px;margin-top:40px;background:linear-gradient(var(--mf-hero-line),transparent)}
.mf-foot{position:sticky;bottom:0;z-index:1;height:100%;background:var(--mf-bg);overflow:hidden}
.mf-ghost{position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(90deg,transparent 0 127px,var(--mf-ghost) 127px 128px),
  repeating-linear-gradient(0deg,transparent 0 127px,var(--mf-ghost) 127px 128px)}
.mf-ghost b{position:absolute;left:-1%;right:-1%;bottom:-12%;text-align:center;font-weight:800;font-size:min(var(--mf-ghost-size),24vw);line-height:.8;letter-spacing:-.02em;color:var(--mf-ghost);white-space:nowrap;-webkit-mask-image:linear-gradient(#000 20%,rgba(0,0,0,.25));mask-image:linear-gradient(#000 20%,rgba(0,0,0,.25))}
.mf-main{position:absolute;left:0;right:0;top:0;bottom:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:84px;text-align:center}
.mf-h{margin:0;font-weight:800;font-size:min(var(--mf-headline-size),11vw);letter-spacing:-.055em;line-height:1;color:var(--mf-headline-ink);text-shadow:0 2px 0 rgba(255,255,255,.045)}
.mf-cta{display:flex;gap:18px;margin-top:56px;flex-wrap:wrap;justify-content:center}
.mf-links{display:flex;gap:26px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.mf-btn,.mf-pill{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:999px;border:1px solid var(--mf-edge);background:var(--mf-bg);box-shadow:0 10px 26px rgba(0,0,0,.45),0 9px 22px -4px var(--mf-glow);transition:transform .25s var(--mf-ease-out);outline:none}
.mf-btn{height:64px;padding:0 44px 0 32px;gap:14px;font-size:17px;font-weight:600;color:var(--mf-text)}
.mf-btn svg{width:22px;height:22px;fill:var(--mf-icon);flex:none}
.mf-pill{height:43px;padding:0 24px;font-size:15px;font-weight:400;color:var(--mf-text-dim)}
.mf-btn:hover,.mf-pill:hover,.mf-btn:focus-visible,.mf-pill:focus-visible,.mf-top:hover,.mf-top:focus-visible{transform:translate3d(0,-2px,0);border-color:rgba(255,255,255,.16)}
.mf-bar{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;color:#cfcfcf}
.mf-craft{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--mf-edge);box-shadow:0 9px 22px rgba(0,0,0,.4),0 8px 18px -4px var(--mf-glow);font-size:12.5px;letter-spacing:.1em;white-space:nowrap}
.mf-craft svg{width:16px;height:16px;fill:var(--mf-accent)}
.mf-craft strong{font-weight:600;letter-spacing:0;text-transform:none;font-size:14px;color:#fff;margin-left:6px}
.mf-top{width:48px;height:48px;border-radius:50%;border:1px solid var(--mf-edge);background:var(--mf-bg);display:grid;place-items:center;cursor:pointer;color:#ddd;padding:0;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .25s var(--mf-ease-out);outline:none}
.mf-top svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mf-band{position:absolute;left:-6%;right:-6%;top:44px;height:72px;transform:rotate(var(--mf-band-tilt-from)) translate3d(0,50px,0);opacity:0;border-top:1px solid rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.05);background:rgba(0,0,0,.14);overflow:hidden}
.mf-track{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:15px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#bdbdbd;will-change:transform}
.mf-track span{padding:0 36px}
.mf-track em{font-style:normal;color:#d0d0d0}
/* Zustaende: vor dem Aufdecken versteckt, danach gestaffelt eingeblendet (nur transform + opacity) */
.mf-h,.mf-cta,.mf-links{opacity:0;transform:translate3d(0,var(--mf-rise-ui),0)}
.mf-h{transform:translate3d(0,var(--mf-rise),0)}
.mf.is-in .mf-h{opacity:1;transform:none;transition:opacity var(--mf-dur-headline) var(--mf-ease-out) var(--mf-delay-headline),transform var(--mf-dur-headline) var(--mf-ease-out) var(--mf-delay-headline)}
.mf.is-in .mf-cta{opacity:1;transform:none;transition:opacity var(--mf-dur-buttons) var(--mf-ease-out) var(--mf-delay-buttons),transform var(--mf-dur-buttons) var(--mf-ease-out) var(--mf-delay-buttons)}
.mf.is-in .mf-links{opacity:1;transform:none;transition:opacity var(--mf-dur-pills) var(--mf-ease-out) var(--mf-delay-pills),transform var(--mf-dur-pills) var(--mf-ease-out) var(--mf-delay-pills)}
.mf.is-in .mf-band{opacity:1;transform:rotate(var(--mf-band-tilt)) translate3d(0,0,0);transition:opacity var(--mf-dur-marquee) var(--mf-ease-out) var(--mf-delay-marquee),transform var(--mf-dur-marquee) var(--mf-ease-out) var(--mf-delay-marquee)}
.mf.is-in.is-quick *{transition-duration:.01ms!important;transition-delay:0s!important}
@media (prefers-reduced-motion:reduce){
  .mf *{transition:none!important}
  .mf-h,.mf-cta,.mf-links,.mf-band{opacity:1;transform:none}
  .mf-band{transform:rotate(var(--mf-band-tilt))}
}
@media (max-width:640px){
  .mf-bar{padding:0 16px;flex-wrap:wrap;gap:6px;font-size:10px}
  .mf-craft{font-size:10px;padding:0 12px}
  .mf-btn{height:54px;font-size:15px;padding:0 24px 0 20px}
  .mf-cta{margin-top:36px}
}
/* /COMPONENT CSS */
</style>
</head>
<body>
<div class="stage" id="stage">
<!-- COMPONENT:START -->
<section class="mf" id="mf" aria-label="Motion Footer">
  <div class="mf-scroll" tabindex="0" role="region" aria-label="Scrollbereich: nach unten scrollen, um den Footer aufzudecken">
    <div class="mf-curtain">
      <div class="mf-hero"><h2>Scroll down to reveal</h2><i aria-hidden="true"></i></div>
    </div>
    <footer class="mf-foot">
      <div class="mf-ghost" aria-hidden="true"><b>SOBERS</b></div>
      <div class="mf-band" aria-hidden="true"><div class="mf-track"></div></div>
      <div class="mf-main">
        <h2 class="mf-h">Ready to begin?</h2>
        <div class="mf-cta">
          <a class="mf-btn" href="#ios"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.700 2.400 2.900 2.300 1.200 0 1.600-.7 3-.7s1.800.7 3 .7 2-1.100 2.800-2.200c.9-1.300 1.200-2.500 1.300-2.600-.1 0-2.500-1-2.500-3.900zM14.200 5.700c.6-.8 1.100-1.900.9-3-.9 0-2.100.6-2.700 1.400-.6.700-1.100 1.800-.9 2.900 1 .1 2.100-.5 2.700-1.300z"/></svg>Download iOS</a>
          <a class="mf-btn" href="#android"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18c0 .6.4 1 1 1h1v3.200c0 .7.5 1.300 1.200 1.300s1.200-.6 1.200-1.300V19h3.200v3.200c0 .7.5 1.300 1.200 1.300s1.200-.6 1.200-1.300V19h1c.6 0 1-.4 1-1V8H6v10zM3.500 8C2.700 8 2 8.700 2 9.500v6c0 .8.7 1.500 1.500 1.500S5 16.300 5 15.500v-6C5 8.700 4.300 8 3.500 8zm17 0c-.8 0-1.500.7-1.500 1.500v6c0 .8.7 1.500 1.500 1.500s1.500-.7 1.500-1.500v-6c0-.8-.7-1.500-1.500-1.500zM15.500 2.200l1.300-1.300c.2-.2.200-.5 0-.7s-.5-.2-.7 0l-1.500 1.500C13.900 1.300 13 1 12 1s-1.900.3-2.600.7L7.900.2c-.2-.2-.5-.2-.7 0s-.2.500 0 .7l1.300 1.300C7.100 3.200 6.100 4.800 6 7h12c-.1-2.200-1.100-3.800-2.500-4.800zM10 5H9V4h1v1zm5 0h-1V4h1v1z" transform="translate(0 1) scale(.95)"/></svg>Download Android</a>
        </div>
        <nav class="mf-links" aria-label="Rechtliches">
          <a class="mf-pill" href="#privacy">Privacy Policy</a>
          <a class="mf-pill" href="#terms">Terms of Service</a>
          <a class="mf-pill" href="#support">Support</a>
        </nav>
      </div>
      <div class="mf-bar">
        <span>&copy; 2026 Volvox. All rights reserved.</span>
        <span class="mf-craft">Crafted with <svg viewBox="0 0 24 24" aria-label="Liebe"><path d="M12 21s-7.500-4.600-9.600-9.200C.9 8.400 2.800 4.500 6.500 4.500c2 0 3.500 1 4.300 2.300l1.200 1.600 1.200-1.600c.8-1.300 2.300-2.300 4.300-2.300 3.700 0 5.600 3.900 4.100 7.300C19.500 16.400 12 21 12 21z"/></svg> by <strong>Volvox</strong></span>
        <button class="mf-top" type="button" aria-label="Nach oben"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </footer>
  </div>
</section>
<!-- COMPONENT:END -->
</div>

<script>
/* ===== COMPONENT JS ===== */
/* opts: revealAt (0..1 Scrollanteil, ab dem aufgedeckt wird), hideAt (Hysterese), marqueeSpeed (px/s),
         items (Ticker-Texte), onReveal(bool) */
function initMotionFooter(root, opts){
  opts = Object.assign({
    revealAt: 0.72, hideAt: 0.5, marqueeSpeed: 52,
    items: ['12-Step Progress','Sponsor Connection','Absolute Privacy','Accountability Partners','Daily Check-ins','Milestone Tracking']
  }, opts || {});
  var scroller = root.querySelector('.mf-scroll'), track = root.querySelector('.mf-track'),
      band = root.querySelector('.mf-band'), top = root.querySelector('.mf-top');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Ticker einmal bauen (DOM danach unveraendert), Satz so oft wiederholen, dass er das Band 2x fuellt */
  function build(){
    var html = '', i, set = '';
    for(i=0;i<opts.items.length;i++) set += '<span>'+opts.items[i]+'</span><span><em>✦</em></span>';
    track.innerHTML = set; var w1 = track.scrollWidth || 1;
    var reps = Math.max(2, Math.ceil((root.clientWidth*1.2)/w1)+1);
    for(i=0;i<reps*2;i++) html += set;
    track.innerHTML = html;
    return w1 * reps;       /* Schleifenbreite = ein halber Track (einmal messen, cachen) */
  }
  var loopW = build(), maxScroll = 1, shown = false, running = false, last = 0, x = 0;

  function measure(){ maxScroll = Math.max(1, scroller.scrollHeight - scroller.clientHeight); }
  measure();
  if('ResizeObserver' in window) new ResizeObserver(function(){ measure(); loopW = build(); }).observe(root);

  function setShown(v){
    if(v === shown) return; shown = v;
    root.classList.toggle('is-in', v);
    if(typeof opts.onReveal === 'function') opts.onReveal(v);
    if(v && !reduce) start(); else if(!v) running = false;
  }
  function onScroll(){ var p = scroller.scrollTop / maxScroll; if(p >= opts.revealAt) setShown(true); else if(p <= opts.hideAt) setShown(false); }
  scroller.addEventListener('scroll', onScroll, {passive:true});
  top.addEventListener('click', function(){ scroller.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); });

  /* Ticker: rein zeitbasiert (Position = Zeit * Geschwindigkeit), nur transform */
  function frame(t){
    if(!running) return;
    var dt = Math.min(t - last, 50); last = t;
    x = (x + opts.marqueeSpeed * dt / 1000) % loopW;
    track.style.transform = 'translate3d(' + (-x).toFixed(2) + 'px,0,0)';
    requestAnimationFrame(frame);
  }
  function start(){ if(running) return; running = true; last = performance.now(); requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) running = false; else if(shown && !reduce) start(); });
  onScroll();
  return { scrollEl: scroller, destroy: function(){ running = false; scroller.removeEventListener('scroll', onScroll); } };
}
/* ===== /COMPONENT JS ===== */

/* ===== DEMO (zeigt exakt den Video-Inhalt) ===== */
window.mfInstance = initMotionFooter(document.getElementById('mf'));
</script>
</body>
</html>
