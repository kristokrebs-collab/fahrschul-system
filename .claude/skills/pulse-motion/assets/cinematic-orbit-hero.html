<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cinematic Orbit Hero</title>
<style>
/* ==========================================================================
   CONFIG (CSS) - alle Look-Werte zum "Hochdrehen". Referenz-Viewport 1234x673.
   Motion-Werte (Fortschrittskurve, Fan/Ring-Geometrie, Federn) stehen im CONFIG (JS) weiter unten.
   ========================================================================== */
:root {
  /* Buehne + Text (aus dem Video gemessen) */
  --coh-stage:    #1b1c1f;   /* Buehnenhintergrund (kuehles Fast-Schwarz) */
  --coh-title:    #eeeeee;   /* Titel (nicht reines Weiss) */
  --coh-sub:      #c4c4c9;   /* Untertitel (im Video gedaempft, duenne Striche) */
  --coh-sub-weight: 300;     /* light; Fonts ohne Light-Schnitt faellen auf 400 zurueck */
  --coh-title-size: 72px;    /* Titelhoehe bei u=1 (Versalhoehe ~53px); skaliert mit --u */
  --coh-title-weight: 600;   /* semibold */
  --coh-title-track: -0.075em; /* sehr enge Laufweite (Arial/Roboto-artig kalibriert: Wortbreite ~505px bei 72px) */
  --coh-sub-size:   14.5px;
  --coh-sub-line:   1.46;
  --coh-sub-width:  410px;   /* Zeilenumbruch nach "Watch" */
  --coh-font: Inter, Geist, Roboto, "Helvetica Neue", Arial, "Liberation Sans", ui-sans-serif, system-ui, sans-serif;

  /* Glow: rotstichiger Radialverlauf in der Buehnenmitte (Radius ~520px bei u=1), ruhend (kein Atmen) */
  --coh-glow-r:   520px;
  --coh-glow:     radial-gradient(circle at 50% 50%, #2a191d 0%, #251a1d 23%, #231b1d 34%, #211c1e 45%, #1e1d20 57%, #1c1d20 80%, #1b1c1f 96%, #1b1c1f 100%);

  /* Karten (Basisgroesse 260x208 = 5:4 bei Skala 1; tatsaechliche Groesse = Basis x Skala x u) */
  --coh-card-w:      260px;
  --coh-card-h:      208px;
  --coh-card-radius: 20px;   /* Basis-Radius, skaliert mit der Karte (bei 193px breiter Vorderkarte ~15px) */
  --coh-card-shadow: 0 24px 48px -18px rgba(0,0,0,.55);
  --coh-focus:       rgba(255,255,255,.55);
}
html, body { margin: 0; height: 100%; }
body {
  background: var(--coh-stage);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#demo { height: 100vh; height: 100dvh; min-height: 360px; }

/* ===== COMPONENT CSS ===== */
.coh {
  --u: 1;                              /* Skalierung relativ zum Referenz-Viewport 1234x673 (JS setzt sie bei Resize) */
  position: relative; width: 100%; height: 100%;
  overflow: hidden; isolation: isolate;
  contain: layout paint;               /* Layout/Paint bleibt in der Komponente */
  background: var(--coh-stage);
  font-family: var(--coh-font); color: var(--coh-title);
  touch-action: pan-y;                 /* vertikales Scrollen bleibt, horizontale Gesten gehoeren der Komponente */
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  user-select: none; -webkit-user-select: none;
}
.coh:focus-visible { outline: 2px solid var(--coh-focus); outline-offset: -4px; }
.coh__glow {
  position: absolute; left: 50%; top: 50%; z-index: 0;
  width: calc(var(--coh-glow-r) * 2 * var(--u)); height: calc(var(--coh-glow-r) * 2 * var(--u));
  margin: calc(var(--coh-glow-r) * -1 * var(--u)) 0 0 calc(var(--coh-glow-r) * -1 * var(--u));
  background: var(--coh-glow); pointer-events: none;
}
/* Textblock: liegt UNTER allen Karten (Karten laufen ueber den Titel) */
.coh__copy {
  position: absolute; left: 50%; top: calc(var(--coh-cy, 389px) - var(--u) * 154px); z-index: 1;   /* Titel sitzt 154px*u ueber der Ringmitte */
  width: calc(var(--u) * 680px); margin-left: calc(var(--u) * -340px);
  text-align: center; pointer-events: none; opacity: 0;
}
.coh__title {
  margin: 0; font: var(--coh-title-weight) calc(var(--coh-title-size) * var(--u))/1.08 var(--coh-font);
  letter-spacing: var(--coh-title-track); color: var(--coh-title); white-space: nowrap;
  padding-right: calc(var(--coh-title-track) * -1); /* gleicht das negative Nach-Letter-Spacing aus => Tinte exakt mittig */
}
.coh__sub {
  margin: calc(var(--u) * 16px) auto 0; max-width: calc(var(--coh-sub-width) * var(--u));
  font: var(--coh-sub-weight) calc(var(--coh-sub-size) * var(--u))/var(--coh-sub-line) var(--coh-font); color: var(--coh-sub);
}
/* Ring: 8 Karten, jede per transform (translate3d/rotate/scale) positioniert - nie left/top animieren */
.coh__ring { position: absolute; inset: 0; margin: 0; padding: 0; list-style: none; z-index: 2; pointer-events: none; }
.coh__card {
  position: absolute; left: 0; top: 0; z-index: 10;
  width: var(--coh-card-w); height: var(--coh-card-h);
  border-radius: var(--coh-card-radius); overflow: hidden;
  background: #26272b; box-shadow: var(--coh-card-shadow);
  transform-origin: 0 0;                   /* matrix3d (Viereck-Abbildung) bezieht sich auf die linke obere Ecke */
  transform: translate3d(-9999px, 0, 0);   /* bis zum ersten Render ausserhalb */
  backface-visibility: hidden;
}
.coh__card img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; }
/* will-change nur waehrend sich etwas bewegt (JS setzt .is-live) */
.coh.is-live .coh__card, .coh.is-live .coh__copy { will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) { .coh__copy { transition: none; } }
/* ===== /COMPONENT CSS ===== */
</style>
</head>
<body>

<!-- COMPONENT:START -->
<section class="coh" id="demo" role="region" aria-label="Cinematic Orbit Hero" tabindex="0">
  <div class="coh__glow" aria-hidden="true"></div>
  <div class="coh__copy">
    <h1 class="coh__title">Cinematic Depth.</h1>
    <p class="coh__sub">Trigonometric scaling creates the illusion of 3D space. Watch the cards cycle foreground to background.</p>
  </div>
  <ul class="coh__ring" aria-hidden="true">
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
    <li class="coh__card"><img alt="" draggable="false"></li>
  </ul>
</section>
<!-- COMPONENT:END -->

<script>
/* ==========================================================================
   CONFIG (JS) - Motion-Werte zum "Hochdrehen". Zeiten in ms, Winkel in Grad.
   Geometrie in Anteilen von Buehnenbreite W / -hoehe H bzw. in px bei u=1 (Referenz 1234x673).
   ========================================================================== */
const CINEMATIC_ORBIT_HERO_CONFIG = {
  trigger: 'auto',           // 'auto' = Oeffnung startet selbst; 'click' = Tippen/Klick/Enter oeffnet+schliesst; 'manual' = nur per API
  startDelay: 2500,          // ms Ruhe im Faecher, bevor sich der Ring oeffnet (Video: ~2.5 s)
  startWhenVisible: true,    // Uhr (startDelay) erst ab Sichtbarkeit laufen lassen (IntersectionObserver)
  speed: 1,                  // Zeitraffer der Oeffnung (2 = doppelt so schnell)

  // Oeffnungs-Fortschritt p(t) = 0 (Faecher) -> 1 (Ring); t in ms NACH startDelay. Aus dem Video gemessen
  // (Kartenpositionen), monotone Kubik-Interpolation: langsamer Anlauf, Spitze ~1.4 s, langer Auslauf (~2.8 s).
  curve: [[0,0],[300,.004],[500,.015],[700,.04],[900,.075],[1050,.15],[1200,.28],[1300,.39],[1400,.52],[1500,.625],
          [1600,.70],[1700,.76],[1850,.82],[2000,.88],[2150,.93],[2300,.962],[2500,.988],[2800,1]],
  // Textblock (Titel + Untertitel): Opacity linear 0->1 (delay/duration), Skala scaleFrom -> 1 per Sinus-Ease (ab scaleDelay), Drehpunkt = Blockmitte
  text:  { delay: 700, duration: 1650, scaleFrom: .9, scaleDelay: 650, scaleDuration: 2000 },

  // Faecher (Ruhezustand): 8 Karten in gerader Diagonale (Schritt dx/dy px bei u=1, Mitte cx/cy als Anteil von W/H)
  fan:  { cx: .4846, cy: .4875, dx: 49.8, dy: 20.6 },
  // Ring (Endzustand): Ellipse um (cx,cy) (Anteile von W/H), 8 Slots im Uhrzeigersinn ab 12 Uhr (45 Grad).
  // side/k = perspektivische Tiefe nur fuer die Parallax-Staerke: depth = (side/(1-k*sin)-.33)/.41 (hinten ~.15, Mitte ~.45, vorn 1)
  ring: { cx: .5, cy: .578, rx: .419, ry: .149, side: .513, k: .309 },
  // Kartenform als Viereck: Eckpunkte TL,TR,BR,BL relativ zur Quadmitte (px bei u=1, Referenz 1234x673), aus dem Video gemessen.
  // fanQuad = alle Faecher-Karten (um ~-12 Grad gedreht, 113x82); ringQuads[slot] = Form der Karte an diesem Ring-Slot
  // (hinten klein, vorn gross, an den Seiten leichte Trapez-Verzerrung = 3D-Kippung). Zwischen den Slots periodisch Catmull-Rom.
  fanQuad:   [-63.9, -28.6, 46.8, -51.6, 63.9, 28.6, -46.8, 51.6],
  ringQuads: [
      [-51, -40.5, 51, -40.5, 51, 40.5, -51, 40.5],
      [-49.6, -52.6, 63.4, -31.6, 49.4, 55.9, -63.1, 28.4],
      [-49.9, -68.2, 83.6, -33.2, 48.6, 78.2, -82.4, 23.2],
      [-74, -81.2, 101, -49.2, 69, 88.8, -96, 41.8],
      [-96.5, -78, 96.5, -78, 96.5, 78, -96.5, 78],
      [-97.2, -42.8, 73.8, -84.8, 99.2, 43.8, -75.8, 83.8],
      [-66.4, -36.8, 58.6, -64.2, 65.6, 27.8, -57.9, 73.2],
      [-64, -33.5, 50, -51, 62.5, 29, -48.5, 55.5]
  ],

  // Tiefen-Parallax: Karten wandern zum Zeiger, vordere staerker (px bei Zeigerposition am Buehnenrand, Karte ganz vorn)
  parallax: { x: 105, y: 50, spring: { stiffness: 20, damping: 9 } },   // kritisch gedaempft (zeta=1), ~0.5 s Nachlauf
  // Ring drehen ("cycle"): Pfeiltasten / cycle(n) = +-1 Slot; auto = dauerhafte Eigendrehung in Grad/s (0 = Stillstand wie im Video)
  spin: { auto: 0, spring: { stiffness: 70, damping: 15 } },

  maxDt: 50,                 // ms: laengster Zeitschritt pro Frame (Tab-Wechsel/Ruckler)
};

/* ===== COMPONENT JS ===== */
/* WICHTIG beim Kopieren: CONFIG (JS) + COMPONENT CSS + Markup + diese Funktion zusammen uebernehmen.
   initCinematicOrbitHero(root, opts) -> { open(), close(), toggle(), cycle(n), seek(ms), setProgress(p|null), getProgress(), destroy() }
   root: .coh Element mit .coh__copy (Titel/Untertitel), .coh__ring > .coh__card (img). opts ueberschreibt CINEMATIC_ORBIT_HERO_CONFIG (tief gemerged).
   120 Hz: alles zeitbasiert (rAF-Zeitstempel, dt <= maxDt); Fortschritt p kommt aus einer ZEITkurve (monotone Kubik),
   Federn (Parallax, Drehung) = exakte analytische Loesung (bildratenunabhaengig); pro Frame nur transform/opacity
   (8 Karten + Textblock), keine Layout-Lesezugriffe (Rect/Skalierung per ResizeObserver gecacht),
   pointermove wird nur gespeichert und im naechsten rAF einmal angewendet; Loop stoppt in Ruhe, will-change nur waehrend der Bewegung. */
function initCinematicOrbitHero(root, opts) {
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const r = Object.assign({}, a); for (const k in (b || {})) r[k] = (isObj(a[k]) && isObj(b[k])) ? merge(a[k], b[k]) : b[k]; return r; };
  const base = (typeof CINEMATIC_ORBIT_HERO_CONFIG !== 'undefined') ? CINEMATIC_ORBIT_HERO_CONFIG : {};
  const o = merge(base, opts);

  const cards = Array.from(root.querySelectorAll('.coh__card'));
  const copy = root.querySelector('.coh__copy');
  const N = cards.length;
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  // --- Zeitkurve p(t): monotone kubische Hermite-Interpolation (Fritsch-Carlson) durch die gemessenen Stuetzpunkte ---
  const pts = o.curve, n = pts.length, hh = [], dd = [], mm = new Array(n);
  for (let i = 0; i < n - 1; i++) { hh[i] = pts[i + 1][0] - pts[i][0]; dd[i] = (pts[i + 1][1] - pts[i][1]) / hh[i]; }
  mm[0] = dd[0]; mm[n - 1] = dd[n - 2];
  for (let i = 1; i < n - 1; i++) mm[i] = dd[i - 1] * dd[i] <= 0 ? 0 : (dd[i - 1] + dd[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (dd[i] === 0) { mm[i] = mm[i + 1] = 0; continue; }
    const a = mm[i] / dd[i], b = mm[i + 1] / dd[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); mm[i] = t * a * dd[i]; mm[i + 1] = t * b * dd[i]; }
  }
  const T_END = Math.max(pts[n - 1][0], o.text.delay + o.text.duration, o.text.scaleDelay + o.text.scaleDuration);
  function curveP(t) {
    if (t <= pts[0][0]) return pts[0][1];
    if (t >= pts[n - 1][0]) return pts[n - 1][1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (pts[mid][0] <= t) lo = mid; else hi = mid; }
    const h = hh[lo], x = (t - pts[lo][0]) / h, x2 = x * x, x3 = x2 * x;
    return (2 * x3 - 3 * x2 + 1) * pts[lo][1] + (x3 - 2 * x2 + x) * h * mm[lo] + (-2 * x3 + 3 * x2) * pts[lo + 1][1] + (x3 - x2) * h * mm[lo + 1];
  }

  // --- Feder: exakte analytische Loesung der gedaempften Feder fuer beliebiges dt (bildratenunabhaengig) ---
  function springStep(S, target, dt, k, c) {
    const w0 = Math.sqrt(k), z = c / (2 * w0), d0 = S.x - target, v = S.v;
    let d, vv;
    if (z < 1 - 1e-4) {
      const wd = w0 * Math.sqrt(1 - z * z), e = Math.exp(-z * w0 * dt), cs = Math.cos(wd * dt), sn = Math.sin(wd * dt), B = (v + z * w0 * d0) / wd;
      d = e * (d0 * cs + B * sn); vv = e * ((B * wd - z * w0 * d0) * cs - (z * w0 * B + d0 * wd) * sn);
    } else if (z <= 1 + 1e-4) {
      const e = Math.exp(-w0 * dt), q = v + w0 * d0; d = e * (d0 + q * dt); vv = e * (v - w0 * dt * q);
    } else {
      const s = w0 * Math.sqrt(z * z - 1), r1 = -z * w0 + s, r2 = -z * w0 - s, c2 = (v - r1 * d0) / (r2 - r1), c1 = d0 - c2, e1 = Math.exp(r1 * dt), e2 = Math.exp(r2 * dt);
      d = c1 * e1 + c2 * e2; vv = c1 * r1 * e1 + c2 * r2 * e2;
    }
    S.x = target + d; S.v = vv;
  }

  // --- Metriken (nur bei Init / Resize / Eintritt - nie pro Frame) ---
  let W = 1234, H = 673, u = 1, uc = 1, cw = 260, ch = 208, rect = null, rectDirty = true;
  function measure() {
    const r = root.getBoundingClientRect(); W = r.width || 1234; H = r.height || 673;
    cw = cards[0].offsetWidth || 260; ch = cards[0].offsetHeight || 208;   // Basisgroesse der Karte (CSS --coh-card-w/-h), einmal gelesen
    u = clamp(Math.min(W / 1234, H / 560), .42, 1.5); uc = u;
    root.style.setProperty('--u', u.toFixed(4));
    root.style.setProperty('--coh-cy', (o.ring.cy * H).toFixed(1) + 'px');
    rect = r; rectDirty = false; dirty = true; kick();
  }

  // --- Zustand ---
  let tl = -(o.startDelay || 0);      // Zeitleiste in ms (negativ = wartet noch auf den Start)
  let tlTarget = o.trigger === 'auto' ? T_END : 0;   // wohin die Zeitleiste laeuft (T_END = offen, 0 = Faecher)
  let waiting = o.trigger === 'auto' && o.startWhenVisible && typeof IntersectionObserver !== 'undefined';
  let manualP = null;                 // setProgress(p) uebersteuert die Zeitkurve
  const PX = { x: 0, v: 0 }, PY = { x: 0, v: 0 }, SP = { x: 0, v: 0 };   // Parallax x/y (px), Drehung (Grad)
  let px = 0, py = 0, spinTarget = 0, hasPtr = false, pendX = null, pendY = null;
  let raf = 0, last = 0, dirty = true, destroyed = false, lastP = -1, lastA = -1, ro = null, io = null;
  const ac = new AbortController();
  const zLast = new Array(N).fill(-1);

  // Catmull-Rom (uniform) ueber die Ring-Slots, periodisch - Karte darf zwischen den Slots wandern (cycle/spin)
  const ringQ = o.ringQuads, SL = ringQ.length, off = new Array(8);
  function ringShape(slot) {
    slot = ((slot % SL) + SL) % SL;
    const i1 = Math.floor(slot), t = slot - i1, t2 = t * t, t3 = t2 * t;
    const A = ringQ[(i1 + SL - 1) % SL], B = ringQ[i1 % SL], C = ringQ[(i1 + 1) % SL], D = ringQ[(i1 + 2) % SL];
    for (let k = 0; k < 8; k++)
      off[k] = .5 * (2 * B[k] + (-A[k] + C[k]) * t + (2 * A[k] - 5 * B[k] + 4 * C[k] - D[k]) * t2 + (-A[k] + 3 * B[k] - 3 * C[k] + D[k]) * t3);
  }
  const calcP = () => manualP !== null ? manualP : curveP(tl);
  const calcA = () => clamp((tl - o.text.delay) / o.text.duration, 0, 1) + clamp((tl - o.text.scaleDelay) / o.text.scaleDuration, 0, 1);   // Summe: aendert sich, solange Opacity ODER Skala laeuft
  const num = v => (Math.round(v * 1e6) / 1e6);
  // Einheitsquadrat -> Viereck (Heckbert) als CSS matrix3d: die Karte (cw x ch) wird exakt auf das Viereck Q (TL,TR,BR,BL) abgebildet
  function quadMatrix(q, cw, ch) {
    const x0 = q[0], y0 = q[1], x1 = q[2], y1 = q[3], x2 = q[4], y2 = q[5], x3 = q[6], y3 = q[7];
    const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
    let g = 0, h = 0;
    if (sx !== 0 || sy !== 0) {
      const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2, det = dx1 * dy2 - dx2 * dy1;
      g = (sx * dy2 - dx2 * sy) / det; h = (dx1 * sy - sx * dy1) / det;
    }
    const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, d = y1 - y0 + g * y1, e = y3 - y0 + h * y3;
    return 'matrix3d(' + num(a / cw) + ',' + num(d / cw) + ',0,' + num(g / cw) + ',' + num(b / ch) + ',' + num(e / ch) + ',0,' + num(h / ch) + ',0,0,1,0,' + num(x0) + ',' + num(y0) + ',0,1)';
  }
  const Q = new Array(8);
  function render() {
    const p = calcP(), a = clamp((tl - o.text.delay) / o.text.duration, 0, 1), f = o.fan, rg = o.ring, D2R = Math.PI / 180;
    const ringCx = rg.cx * W, ringCy = rg.cy * H, ringRx = rg.rx * W, ringRy = rg.ry * H;
    const fanCx = f.cx * W, fanCy = f.cy * H, mid = (N - 1) / 2, fq = o.fanQuad;
    for (let i = 0; i < N; i++) {
      const deg = 360 * i / N + SP.x, th = (-90 + deg) * D2R, c = Math.cos(th), s = Math.sin(th);
      ringShape(SL * deg / 360);
      const rs = rg.side / (1 - rg.k * s);                         // perspektivische Tiefe: hinten (s=-1) klein, vorn (s=+1) gross
      const rX = ringCx + ringRx * c, rY = ringCy + ringRy * s;
      const fX = fanCx + (i - mid) * f.dx * u, fY = fanCy + (i - mid) * f.dy * u;
      const depth = clamp((rs - .33) / .41, 0, 1.2) * p;           // 0 hinten ... 1 vorn (Parallax-Staerke)
      const x = fX + (rX - fX) * p + depth * PX.x, y = fY + (rY - fY) * p + depth * PY.x;
      for (let k = 0; k < 8; k += 2) {                              // Eckpunkte: Faecher -> Ring-Form (linear in p), um die Mitte (x,y)
        Q[k] = x + (fq[k] + (off[k] - fq[k]) * p) * uc;
        Q[k + 1] = y + (fq[k + 1] + (off[k + 1] - fq[k + 1]) * p) * uc;
      }
      cards[i].style.transform = quadMatrix(Q, cw, ch);
      const z = 10 + Math.round((s + 1) * 50);                      // hinten unten, vorn oben (sortiert nach sin theta)
      if (z !== zLast[i]) { zLast[i] = z; cards[i].style.zIndex = z; }
    }
    // Textblock: Opacity linear ueber die Zeit, Skala scaleFrom -> 1 (Sinus-Ease) um die Blockmitte
    const q = clamp((tl - o.text.scaleDelay) / o.text.scaleDuration, 0, 1), sc0 = o.text.scaleFrom + (1 - o.text.scaleFrom) * (1 - Math.cos(Math.PI * q)) / 2;
    copy.style.opacity = a.toFixed(4);
    copy.style.transform = 'translate3d(0,0,0) scale(' + sc0.toFixed(4) + ')';
    lastP = p; lastA = calcA(); dirty = false;
  }

  function springsSettled() {
    return Math.abs(PX.x - px) < .02 && Math.abs(PX.v) < .3 && Math.abs(PY.x - py) < .02 && Math.abs(PY.v) < .3 &&
           Math.abs(SP.x - spinTarget) < .01 && Math.abs(SP.v) < .1;
  }
  function tick(now) {
    raf = 0; if (destroyed) return;
    const dt = Math.min(o.maxDt, Math.max(0, now - last)) / 1000; last = now;
    const reduce = mq.matches;
    if (pendX !== null) {              // Zeigerposition aus pointermove genau einmal pro Frame uebernehmen
      if (rectDirty || !rect) { rect = root.getBoundingClientRect(); rectDirty = false; }
      const nx = clamp((pendX - rect.left) / (rect.width || W) * 2 - 1, -1, 1), ny = clamp((pendY - rect.top) / (rect.height || H) * 2 - 1, -1, 1);
      px = reduce ? 0 : nx * o.parallax.x; py = reduce ? 0 : ny * o.parallax.y; pendX = pendY = null;
    }
