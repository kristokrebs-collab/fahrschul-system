<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slanted Spread Hero</title>
<style>
/* ==========================================================================
   CONFIG (CSS) - alle Look-Werte zum "Hochdrehen". Referenz-Buehne 1234x673.
   Groessen in --u (1u = 1px bei 1234 Buehnenbreite) => skaliert mit der Buehne.
   Motion-Werte (Feder, Delay, Layout der Faecher) stehen im CONFIG (JS) weiter unten.
   ========================================================================== */
:root {
  --sp-stage:   #1b1c21;                 /* Buehnenhintergrund (gemessen #1B1C21) */
  --sp-glow:    rgba(58,40,110,.20);     /* violetter Lichtfleck hinter dem Faecher (Mitte ~#1C1827) */
  --sp-ring:    rgba(255,255,255,.012);  /* feine konzentrische Ringe um die Mitte */
  --sp-ink:     #f4f4f5;                 /* Headline (voll sichtbar = weiss) */
  --sp-ink-2:   rgba(255,255,255,.52);   /* Untertext (gemessen ~#807F85 auf dunkel) */
  --sp-font: Inter, Geist, Roboto, "Helvetica Neue", Arial, "Liberation Sans", ui-sans-serif, system-ui, sans-serif;
  --sp-title-size: 62;                   /* Headline-Hoehe in u (px bei 1234 Breite) */
  --sp-title-weight: 700;
  --sp-sub-size: 16;                     /* Untertext in u */
  --sp-card-w: 172;                      /* Kartenbreite in u (aufgefaechert) */
  --sp-card-h: 128;                      /* Kartenhoehe in u */
  --sp-card-radius: 12px;                /* Eckenradius */
  --sp-card-shadow: 0 14px 34px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35);
}
html { background: var(--sp-stage); color-scheme: dark; }
html, body { margin: 0; height: 100%; }
body { background: var(--sp-stage); display: grid; place-items: center; overflow: hidden; -webkit-tap-highlight-color: transparent; }

/* ===== COMPONENT CSS ===== */
.sp {
  --u: min(calc(100vw / 1234), calc(100vh / 673));
  position: relative; width: 100vw; height: 100vh; height: 100svh;
  overflow: hidden; contain: layout paint; background: var(--sp-stage);
  font-family: var(--sp-font); color: var(--sp-ink);
  touch-action: manipulation; cursor: pointer; outline: none; user-select: none; -webkit-user-select: none;
}
.sp:focus-visible { box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
.sp__glow {
  position: absolute; left: 50%; top: 50%; width: calc(640 * var(--u)); height: calc(640 * var(--u));
  margin: calc(-320 * var(--u)) 0 0 calc(-320 * var(--u)); border-radius: 50%; pointer-events: none;
  background:
    repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(34 * var(--u)), var(--sp-ring) calc(34 * var(--u)) calc(36 * var(--u))),
    radial-gradient(circle at 50% 50%, var(--sp-glow) 0%, rgba(58,40,110,.07) 52%, transparent 70%);
}
.sp__copy { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
.sp__title {
  position: absolute; left: 50%; top: 0; margin: 0; white-space: nowrap; text-align: center;
  font-size: calc(var(--sp-title-size) * var(--u)); font-weight: var(--sp-title-weight); letter-spacing: -.035em; line-height: 1;
  transform: translate3d(-50%, calc(-50% - 31 * var(--u)), 0); opacity: 0;
}
.sp__sub {
  position: absolute; left: calc(50% - 17 * var(--u)); top: calc(38 * var(--u)); margin: 0; width: calc(218 * var(--u));
  font-size: calc(var(--sp-sub-size) * var(--u)); line-height: 1.5; color: var(--sp-ink-2); opacity: 0;
}
.sp__cards { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.sp__card {
  position: absolute; left: 0; top: 0; width: calc(var(--sp-card-w) * var(--u)); height: calc(var(--sp-card-h) * var(--u));
  margin: calc(var(--sp-card-h) * var(--u) / -2) 0 0 calc(var(--sp-card-w) * var(--u) / -2);
  border-radius: var(--sp-card-radius); overflow: hidden; box-shadow: var(--sp-card-shadow);
  backface-visibility: hidden; transform: translate3d(0,0,0);
}
.sp__card svg { display: block; width: 100%; height: 100%; }
.sp.is-animating .sp__card, .sp.is-animating .sp__title, .sp.is-animating .sp__sub { will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) { .sp.is-animating .sp__card { will-change: auto; } }

/* ===== Demo-Seite ===== */
</style>
</head>
<body>

<!-- COMPONENT:START -->
<div class="sp" id="hero" tabindex="0" role="button" aria-expanded="false"
     aria-label="Slanted Spread Hero - Karten auffaechern / zusammenschieben (Tippen oder Enter)">
  <div class="sp__glow"></div>
  <div class="sp__copy">
    <h1 class="sp__title">Dynamic Spread Style.</h1>
    <p class="sp__sub">Effortless motion across the viewport.</p>
  </div>
  <div class="sp__cards" aria-hidden="true"></div>
</div>
<!-- COMPONENT:END -->

<script>
/* ==========================================================================
   CONFIG (JS) - Motion-Tokens zum "Hochdrehen"
   ========================================================================== */
const SPREAD_CONFIG = {
  autoplay: true,
  delay: 1500,          // ms nach Init bis zum Auffaechern (Video: Stapel ~1.5 s sichtbar, dann Spread)
  spring: { stiffness: 14, damping: 7.5 }, // leicht ueberkritisch gedaempft: weiches ease-out, ~1.8 s, kein Overshoot (kritisch = 2*sqrt(k) = 7.48)
  textFrom: 0.10,       // ab welchem Fortschritt Headline/Untertext einblenden
  textTo: 0.80,         // ab hier voll sichtbar (Headline faded grau -> weiss)
  subLag: 0.12,         // Untertext kommt etwas spaeter als Headline
  rotate: -13,          // Grad, Neigung des ganzen Faechers
  collapsed: { scale: 0.68, stepX: 20, stepY: -8, rot: -13 },   // Stapel (u)
  spread:    { scale: 1.00, stepX: 112, stepY: -54.4, rot: -13, offX: -32, offY: 9 }, // Faecher (u)
  tiltJitter: [ -1.5, 1.5, -2, 2.5, -2, 1.5, -1, 2 ], // kleine Eigenrotation pro Karte im Faecher (Grad)
  tiltAmount: 1,        // Multiplikator fuer tiltJitter
  collapsedRotJitter: 0 // Streuung im Stapel
};

/* COMPONENT JS - braucht kein Demo: initSlantedSpreadHero(root, opts) */
const SP_ART = [
 /* 0 Himmel */ '<defs><linearGradient id="a0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa6d6"/><stop offset="1" stop-color="#dfe6ee"/></linearGradient></defs><rect width="172" height="128" fill="url(#a0)"/><ellipse cx="60" cy="50" rx="46" ry="22" fill="#f4f6f8" opacity=".9"/><ellipse cx="110" cy="60" rx="40" ry="18" fill="#fff" opacity=".8"/><path d="M0 108 L172 90 V128 H0Z" fill="#c9d2dc"/>',
 /* 1 Blumen */ '<rect width="172" height="128" fill="#17110e"/><circle cx="60" cy="80" r="26" fill="#c4423b"/><circle cx="104" cy="66" r="20" fill="#e8806f"/><circle cx="80" cy="44" r="16" fill="#f1c6a8"/><circle cx="125" cy="98" r="18" fill="#d9a23a"/><circle cx="36" cy="40" r="12" fill="#a8334a"/><circle cx="92" cy="104" r="14" fill="#ece0cf"/><circle cx="150" cy="40" r="10" fill="#4f7a58"/>',
 /* 2 Surfer */ '<defs><linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c7e8e6"/><stop offset="1" stop-color="#2f8f93"/></linearGradient></defs><rect width="172" height="128" fill="url(#a2)"/><path d="M0 30 C60 0 130 20 172 70 L172 128 H0Z" fill="#7fc7c4" opacity=".8"/><path d="M0 100 C50 70 120 80 172 110 V128 H0Z" fill="#1f6f78"/><rect x="66" y="52" width="10" height="26" rx="4" fill="#f1f1f1"/><circle cx="71" cy="46" r="6" fill="#c9966b"/>',
 /* 3 Mops */ '<rect width="172" height="128" fill="#d9a514"/><ellipse cx="96" cy="66" rx="36" ry="38" fill="#141414"/><ellipse cx="68" cy="44" rx="14" ry="18" fill="#0d0d0d"/><ellipse cx="124" cy="44" rx="14" ry="18" fill="#0d0d0d"/><ellipse cx="96" cy="80" rx="22" ry="16" fill="#2a2a2a"/><circle cx="84" cy="60" r="6" fill="#fff"/><circle cx="108" cy="60" r="6" fill="#fff"/><circle cx="85" cy="61" r="3" fill="#000"/><circle cx="109" cy="61" r="3" fill="#000"/><rect x="60" y="100" width="70" height="28" fill="#8e8f8a"/>',
 /* 4 Fussball */ '<defs><linearGradient id="a4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d4a38"/><stop offset="1" stop-color="#1c2c20"/></linearGradient></defs><rect width="172" height="128" fill="url(#a4)"/><path d="M0 0 H80 L60 40 H0Z" fill="#3a74c9"/><circle cx="92" cy="80" r="36" fill="#f3f3f3"/><path d="M92 64 L106 74 L101 90 H83 L78 74Z" fill="#202020"/><path d="M60 70 L70 66 L72 80Z M118 60 L130 70 L120 82Z" fill="#303030"/>',
 /* 5 Jacke */ '<defs><linearGradient id="a5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7d7d7"/><stop offset="1" stop-color="#6c6c70"/></linearGradient></defs><rect width="172" height="128" fill="url(#a5)"/><path d="M30 0 H120 L150 60 L130 128 H40 L20 50Z" fill="#161616"/><path d="M70 0 L86 70 L100 0Z" fill="#3b3b3b"/><rect x="130" y="40" width="42" height="70" fill="#e9e9e9"/>',
 /* 6 Feld */ '<defs><linearGradient id="a6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e86b8"/><stop offset=".5" stop-color="#e7a35a"/><stop offset=".52" stop-color="#8b5d22"/><stop offset="1" stop-color="#4d3612"/></linearGradient></defs><rect width="172" height="128" fill="url(#a6)"/><circle cx="126" cy="62" r="14" fill="#ffd9a0" opacity=".85"/>',
 /* 7 Ballons */ '<defs><linearGradient id="a7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a6d6"/><stop offset=".5" stop-color="#b89cf0"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs><rect width="172" height="128" fill="url(#a7)"/><circle cx="52" cy="42" r="36" fill="#f6b6e6" opacity=".8"/><circle cx="118" cy="58" r="42" fill="#ffa63d" opacity=".85"/><circle cx="90" cy="96" r="30" fill="#7fa4ff" opacity=".6"/><circle cx="140" cy="20" r="18" fill="#fff" opacity=".35"/>'
];

function initSlantedSpreadHero(root, opts) {
  const C = Object.assign({}, SPREAD_CONFIG, opts || {});
  const spring = C.spring, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cardsEl = root.querySelector('.sp__cards');
  const titleEl = root.querySelector('.sp__title');
  const subEl = root.querySelector('.sp__sub');
  const art = C.art || SP_ART;
  if (!cardsEl.children.length) {
    art.forEach(svg => {
      const d = document.createElement('div'); d.className = 'sp__card';
      d.innerHTML = '<svg viewBox="0 0 172 128" preserveAspectRatio="xMidYMid slice">' + svg + '</svg>';
      cardsEl.appendChild(d);
    });
  }
  const cards = Array.from(cardsEl.children), n = cards.length;
  let u = 1, open = false, target = 0, x = 0, v = 0, acc = 0, last = 0, raf = 0, delayT = 0;
  const STEP = 1 / 240;
  const measure = () => { u = Math.min(root.clientWidth / 1234, root.clientHeight / 673); };
  const cl = (a, lo, hi) => a < lo ? lo : a > hi ? hi : a;
  const ease = t => t * t * (3 - 2 * t);

  function render(p) {
    const A = C.collapsed, B = C.spread;
    const sc = A.scale + (B.scale - A.scale) * p;
    const sx = A.stepX + (B.stepX - A.stepX) * p, sy = A.stepY + (B.stepY - A.stepY) * p;
    const ox = B.offX * p, oy = B.offY * p, rot = A.rot + (B.rot - A.rot) * p;
    for (let i = 0; i < n; i++) {
      const k = i - (n - 1) / 2;
      const r = rot + (C.tiltJitter[i % C.tiltJitter.length] || 0) * C.tiltAmount * p;
      cards[i].style.transform = 'translate3d(' + ((k * sx + ox) * u).toFixed(2) + 'px,' + ((k * sy + oy) * u).toFixed(2) + 'px,0) rotate(' + r.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')';
    }
    const t1 = ease(cl((p - C.textFrom) / (C.textTo - C.textFrom), 0, 1));
    const t2 = ease(cl((p - C.textFrom - C.subLag) / (C.textTo - C.textFrom), 0, 1));
    titleEl.style.opacity = t1.toFixed(3); subEl.style.opacity = t2.toFixed(3);
  }
  function tick(t) {
    const dt = Math.min(t - last, 50) / 1000; last = t; acc += dt;
    while (acc >= STEP) { // semi-impliziter Euler, fester Substep 1/240 s
      v += (-spring.stiffness * (x - target) - spring.damping * v) * STEP; x += v * STEP; acc -= STEP;
    }
    render(x);
    if (Math.abs(x - target) < 0.0005 && Math.abs(v) < 0.001) { x = target; v = 0; render(x); stop(); return; }
    raf = requestAnimationFrame(tick);
  }
  function stop() { raf = 0; root.classList.remove('is-animating'); }
  function go() {
    root.setAttribute('aria-expanded', String(open));
    if (reduce) { x = target; v = 0; render(x); return; }
    if (!raf) { last = performance.now(); acc = 0; root.classList.add('is-animating'); raf = requestAnimationFrame(tick); }
  }
  function set(o) { open = !!o; target = open ? 1 : 0; clearTimeout(delayT); go(); if (C.onChange) C.onChange(open); }
  const toggle = () => set(!open);

  root.addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; toggle(); }, { passive: true });
  root.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  if ('ResizeObserver' in window) new ResizeObserver(() => { measure(); render(x); }).observe(root);
  addEventListener('resize', () => { measure(); render(x); }, { passive: true });
  measure(); render(0);
  if (C.autoplay) delayT = setTimeout(() => set(true), reduce ? 0 : C.delay); // einmaliger Start-Timer, kein Animationstakt
  return { open: () => set(true), close: () => set(false), toggle, get isOpen() { return open; } };
}

/* ===== Demo: exakt der Video-Inhalt ===== */
const heroApi = initSlantedSpreadHero(document.getElementById('hero'));
</script>
</body>
</html>
