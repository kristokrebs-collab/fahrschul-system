<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flip Search</title>
<style>
/* ===== CONFIG (hier hochdrehen) ===== */
:root{
  --bg:#0f1115; --fg:#eef0f4; --muted:#8a90a0; --field-bg:#1a1d24; --field-line:#2b303b; --accent:#7aa2ff;
  --font:Inter,Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --h:48px;                      /* Hoehe von Feld und Knopf */
  --w:min(360px,calc(100vw - 32px));
  --radius:14px;
  /* Easing-Regeln: Eintritt ease-out, Austritt ease-in, nichts linear */
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.55,.08,.4,.95);
  --flip-in-ms:420; --flip-out-ms:260;   /* Austritt kuerzer als Eintritt */
  --persp:2.2;                           /* Perspektive = Faktor x Feldbreite */
}
:root[data-theme=light]{--bg:#f4f5f8;--fg:#14161b;--muted:#6b7183;--field-bg:#fff;--field-line:#d9dce4;--accent:#3b64e0}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f5f8;--fg:#14161b;--muted:#6b7183;--field-bg:#fff;--field-line:#d9dce4;--accent:#3b64e0}}
</style>
<style>
/* COMPONENT CSS */
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:grid;place-items:center}
.fs{position:relative;width:var(--w);height:var(--h)}
/* Sitz: traegt die Perspektive, haelt das Feld an der Oberkante */
.fs__seat{position:absolute;inset:0;perspective:calc(var(--persp) * var(--w));perspective-origin:50% 50%;pointer-events:none}
.fs__field{position:absolute;inset:0;transform-origin:50% 0;transform:rotateX(-90deg);opacity:0;visibility:hidden;
  backface-visibility:hidden;background:var(--field-bg);border:1px solid var(--field-line);border-radius:var(--radius);
  display:flex;align-items:center;padding:0 calc(var(--h) + 6px) 0 16px;box-sizing:border-box;
  transition:transform calc(var(--flip-out-ms)*1ms) var(--ease-in),opacity calc(var(--flip-out-ms)*1ms) var(--ease-in),visibility 0s linear calc(var(--flip-out-ms)*1ms)}
.fs.is-open .fs__field{transform:rotateX(0);opacity:1;visibility:visible;pointer-events:auto;
  transition:transform calc(var(--flip-in-ms)*1ms) var(--ease-out),opacity calc(var(--flip-in-ms)*.6ms) var(--ease-out),visibility 0s}
.fs__input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 16px/1 var(--font)}
.fs__input::placeholder{color:var(--muted)}
.fs__input::-webkit-search-cancel-button,.fs__input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
/* Ein Knopf, drei Aufgaben: oeffnen / leeren / schliessen. Die Icons sind uebereinander, Wechsel per Blende+Drehung */
.fs__btn{position:absolute;right:0;top:0;width:var(--h);height:var(--h);border:1px solid var(--field-line);border-radius:var(--radius);
  background:var(--field-bg);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2;
  transition:transform .18s var(--ease-out),border-color .18s var(--ease-out),background-color .18s var(--ease-out)}
.fs__btn:hover{border-color:var(--accent)}
.fs__btn:active{transform:scale(.94)}
.fs__btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs__btn svg{grid-area:1/1;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transform:rotate(-90deg) scale(.6);transition:transform .22s var(--ease-in),opacity .16s var(--ease-in)}
.fs[data-mode=open] .ic-search,.fs[data-mode=clear] .ic-clear,.fs[data-mode=close] .ic-close{opacity:1;transform:none;
  transition:transform .32s var(--ease-out),opacity .22s var(--ease-out)}
.fs__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .fs__field,.fs.is-open .fs__field{transform:none;transition:opacity .12s var(--ease-out),visibility 0s}
  .fs__btn svg,.fs[data-mode] svg{transform:none;transition:opacity .12s var(--ease-out)}
}
.theme{position:fixed;top:12px;right:12px;font:500 12px var(--font);color:var(--muted);background:none;border:1px solid var(--field-line);border-radius:999px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<button class="theme" id="theme" type="button">Hell / Dunkel</button>
<!-- COMPONENT:START -->
<div class="fs" id="fs" data-mode="open" role="search">
  <div class="fs__seat"><div class="fs__field" id="fsField"><input class="fs__input" id="fsInput" type="search" placeholder="Suchen ..." autocomplete="off" aria-label="Suchbegriff" tabindex="-1"></div></div>
  <button class="fs__btn" id="fsBtn" type="button" aria-expanded="false" aria-controls="fsField">
    <svg class="ic-search" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <svg class="ic-clear" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
    <svg class="ic-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    <span class="fs__sr" id="fsLabel">Suche oeffnen</span>
  </button>
</div>
<!-- COMPONENT:END -->
<script>
/* Init: initFlipSearch(rootEl, {onSearch(value)}). Zustaende: open (Lupe), clear (Text vorhanden), close (Feld leer).
   Nur transform/opacity per CSS-Transition; kein rAF noetig, daher bildratenunabhaengig. */
function initFlipSearch(root, opts){
  opts = opts || {};
  var field = root.querySelector('.fs__field'), input = root.querySelector('.fs__input'),
      btn = root.querySelector('.fs__btn'), label = root.querySelector('.fs__sr');
  var labels = { open:'Suche oeffnen', clear:'Eingabe leeren', close:'Suche schliessen' };
  var openState = false, kbd = false;
  addEventListener('keydown', function(){ kbd = true; }, true);          // Tastatur-Modalitaet merken
  addEventListener('pointerdown', function(){ kbd = false; }, true);
  function mode(){ return !openState ? 'open' : (input.value ? 'clear' : 'close'); }
  function sync(){
    var m = mode(); root.dataset.mode = m; label.textContent = labels[m];
    btn.setAttribute('aria-expanded', openState ? 'true' : 'false');
  }
  function open(){
    openState = true; root.classList.add('is-open'); input.tabIndex = 0; sync();
    setTimeout(function(){ input.focus({ preventScroll:true }); }, 120);   // Fokus erst, wenn das Feld sichtbar kippt
  }
  function close(){
    openState = false; root.classList.remove('is-open'); input.tabIndex = -1; input.value = ''; sync();
    if (kbd) btn.focus();
  }
  btn.addEventListener('click', function(){
    var m = mode();
    if (m === 'open') open();
    else if (m === 'clear'){ input.value = ''; sync(); input.focus(); }
    else close();
  });
  input.addEventListener('input', sync);
  input.addEventListener('keydown', function(e){
    if (e.key === 'Escape'){ e.preventDefault(); close(); btn.focus(); }
    else if (e.key === 'Enter' && opts.onSearch) opts.onSearch(input.value);
  });
  sync();
  root._fs = { open:open, close:close };
  return root._fs;
}
</script>
<script>
initFlipSearch(document.getElementById('fs'), {});
document.getElementById('theme').addEventListener('click', function(){
  var r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme:light)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
});
</script>
</body>
</html>
