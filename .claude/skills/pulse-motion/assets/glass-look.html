<!doctype html>
<html lang="de" data-look="glass" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Look</title>
<link rel="stylesheet" href="glass.css">
<style>
/* ===== CONFIG (hier hochdrehen) ===== */
:root{
  --gl-blur:22px;                /* Staerke der Unschaerfe hinter dem Glas */
  --lift:-5px;                   /* Hover-Anhub der Karten (wie whileHover y:-5) */
  --font:Inter,Geist,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --hover-ms:260; --enter-ms:520; --stagger-ms:60;
}
</style>
<style>
/* COMPONENT CSS - Glas, Szene und Licht kommen aus glass.css + glass-look.js; hier nur Layout und Schrift */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);padding:clamp(16px,4vw,48px) clamp(16px,4vw,48px) 110px}
.gd{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.gd__bar{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 12px 10px 20px;border-radius:999px}
.gd__bar b{font-weight:600;font-size:14px;letter-spacing:.01em} .gd__bar small{font-size:12px}
.gd__stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.gd__card{padding:22px;border-radius:24px;transition:transform calc(var(--hover-ms)*1ms) var(--spring);cursor:default}
.gd__card:hover{transform:translate3d(0,var(--lift),0)}
.gd__card p{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.gd__card h2{margin:10px 0 8px;font-size:40px;font-weight:300;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.gd__card span{font-size:12px;font-weight:600}
.gd__chart{padding:22px 22px 14px;border-radius:28px}
.gd__chart h3{margin:0 0 4px;font-size:15px;font-weight:600} .gd__chart small{font-size:12px}
.gd__chart svg{width:100%;height:160px;display:block;margin-top:12px}
.gd__pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.gd__pill{border:0;padding:9px 16px;border-radius:999px;font:500 13px var(--font);color:inherit;cursor:pointer;transition:transform .2s var(--spring)}
.gd__pill:hover{transform:translate3d(0,-2px,0)} .gd__pill:active{transform:scale(.95)}
.gd__pill:focus-visible{outline:2px solid var(--gl-fg);outline-offset:2px}
.gd__pill[aria-pressed=true]{font-weight:700}
.gd__dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;border-radius:26px;z-index:3}
.gd__dock button{width:44px;height:44px;border:0;border-radius:16px;background:transparent;color:inherit;font-size:18px;cursor:pointer;transition:transform .22s var(--spring)}
.gd__dock button:hover{transform:translate3d(0,-4px,0) scale(1.08)} .gd__dock button:focus-visible{outline:2px solid var(--gl-fg);outline-offset:2px}
/* Eintritt: ease-out, gestaffelt, nur transform/opacity */
.gd [data-in]{opacity:0;transform:translate3d(0,14px,0);animation:gd-in calc(var(--enter-ms)*1ms) var(--ease-out) forwards;animation-delay:calc(var(--n,0) * var(--stagger-ms) * 1ms)}
@keyframes gd-in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.gd [data-in]{animation:none;opacity:1;transform:none}.gd__card,.gd__pill,.gd__dock button{transition:none}}
@media (max-width:640px){body{padding-top:56px}}
.theme{position:fixed;top:12px;right:12px;z-index:5;font:500 12px var(--font);color:var(--gl-fg);background:rgba(255,255,255,.1);border:1px solid var(--gl-hair);border-radius:999px;padding:6px 12px;cursor:pointer}
</style>
</head>
<body>
<button class="theme" id="theme" type="button">Hell / Dunkel</button>
<!-- COMPONENT:START -->
<main class="gd">
  <header class="gd__bar gl" data-in style="--n:0"><b>Glass-Dashboard</b><small class="gl-dim">Beispielwerte, keine echten Daten</small></header>
  <section class="gd__stats" aria-label="Kennzahlen">
    <article class="gd__card gl" data-in style="--n:1"><p class="gl-dim">Einnahmen</p><h2>425k</h2><span class="gl-up">+8 % zum Vorzeitraum</span></article>
    <article class="gd__card gl" data-in style="--n:2"><p class="gl-dim">Ausgaben</p><h2>314k</h2><span class="gl-up">+3 % zum Vorzeitraum</span></article>
    <article class="gd__card gl" data-in style="--n:3"><p class="gl-dim">Gewinn</p><h2>111k</h2><span class="gl-up">+14 % zum Vorzeitraum</span></article>
    <article class="gd__card gl" data-in style="--n:4"><p class="gl-dim">Sparquote</p><h2>26,1 %</h2><span class="gl-up">vom Einkommen</span></article>
  </section>
  <section class="gd__chart gl" data-in style="--n:5">
    <h3>Verlauf</h3><small class="gl-dim">Letzte 12 Monate, Beispielkurve</small>
    <svg viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="Beispielkurve, steigend">
      <defs><linearGradient id="gd-g" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="160"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <path d="M0 120 C60 110 90 130 150 96 S250 70 310 84 S420 40 470 52 S560 22 600 30 V160 H0Z" fill="url(#gd-g)"/>
      <path d="M0 120 C60 110 90 130 150 96 S250 70 310 84 S420 40 470 52 S560 22 600 30" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="gd__pills" role="group" aria-label="Zeitraum">
      <button class="gd__pill gl" type="button" aria-pressed="false">Diese Woche</button>
      <button class="gd__pill gl" type="button" aria-pressed="true">Dieser Monat</button>
      <button class="gd__pill gl" type="button" aria-pressed="false">Dieses Jahr</button>
    </div>
  </section>
</main>
<nav class="gd__dock gl" aria-label="Schnellzugriff"><button type="button" aria-label="Start">&#8962;</button><button type="button" aria-label="Berichte">&#9783;</button><button type="button" aria-label="Suche">&#9906;</button><button type="button" aria-label="Einstellungen">&#9881;</button></nav>
<!-- COMPONENT:END -->
<script src="glass-look.js"></script>
<script>
/* Demo: .gl-Klassen sind hier von Hand gesetzt; glass-look.js erkennt zusaetzlich Flaechen in fremden Komponenten und steuert das gemeinsame Licht. */
document.querySelectorAll('.gd__pill').forEach(function(b){
  b.addEventListener('click', function(){ document.querySelectorAll('.gd__pill').forEach(function(o){ o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); }); });
});
document.getElementById('theme').addEventListener('click', function(){
  var r = document.documentElement; r.dataset.theme = r.dataset.theme === 'light' ? 'dark' : 'light';
});
</script>
</body>
</html>
