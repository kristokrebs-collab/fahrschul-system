<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Launch Hero</title>
<style>
/* ==========================================================================
   CONFIG (CSS) - alle Look-Werte zum "Hochdrehen". Referenz-Viewport 1234x673,
   die Buehne ist 1194x672 (16:9) und wird per Skalierung eingepasst.
   Motion-/Kamera-/Karten-Werte stehen im CONFIG (JS) weiter unten.
   ========================================================================== */
:root {
  /* --- Farben (aus dem Video gemessen, +-2 Stufen) --- */
  --plh-page:       #010101;  /* Seitenhintergrund ausserhalb der Buehne */
  --plh-stage:      #020202;  /* Video-Hintergrund (fast schwarz) */
  --plh-panel:      #070909;  /* Panel A: dunkle Seite mit Punktraster (leichter Gruenstich) */
  --plh-dot:        rgba(255,255,255,.085); /* Punktraster-Punkte */
  --plh-dot-gap:    24px;     /* Raster-Abstand */
  --plh-ink:        #f5f5f5;  /* Satz "that lets you ..." */
  --plh-ink-soft:   rgba(245,245,245,.86); /* "out AI." etwas leiser */
  --plh-square:     rgba(255,255,255,.36);  /* drehendes Quadrat-Outline */
  --plh-lit:        #e4e6e7;  /* Panel A "eingeschaltet" (weiss, kuehl) */
  --plh-hud:        #ffffff;  /* Befehlszeile "npx shadcn add @snapcn" */
  --plh-b-title-a:  #ececec;  /* Titel links (hell) ... */
  --plh-b-title-b:  #6a6a6a;  /* ... verblasst nach rechts */
  --plh-b-sub:      #5e5e5e;  /* "Article - The Design Process" */
  --plh-b-btn-bg:   #262626;  /* "Explore"-Pille */
  --plh-b-btn-ink:  #8a8a8a;

  /* --- Geometrie --- */
  --plh-radius-panel: 28px;   /* Ecken Panel A */
  --plh-radius-tile:  20px;   /* Ecken der Ring-Kacheln in B */
  --plh-card-radius:  3px;    /* Foto-Karten Panel A */

  /* --- Typo --- */
  --plh-font: Inter, Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
  --plh-row-size:   30px;     /* "that lets you [Foto] filter out AI." */
  --plh-hud-size:   34px;     /* Befehlszeile */
  --plh-title-size: 66px;     /* "A whole new universe" (vor der Seiten-Stauchung scaleX .74) */
}
html, body { margin: 0; height: 100%; }
body {
  background: var(--plh-page);
  display: grid; place-items: center; overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ===== COMPONENT CSS ===== */
.plh {
  position: relative;
  width: min(100vw, calc(100vh * 1194 / 672));      /* 16:9-Buehne, passt in jeden Viewport */
  aspect-ratio: 1194 / 672;
  overflow: hidden; contain: layout paint style;
  background: var(--plh-stage);
  font-family: var(--plh-font);
  color: var(--plh-ink);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  --plh-s: 1;
}
.plh:focus-visible { outline: 2px solid rgba(255,255,255,.55); outline-offset: -2px; }
.plh__stage {                      /* feste 1194x672-Zeichenflaeche, per --plh-s skaliert (nur bei Resize gesetzt) */
  position: absolute; left: 0; top: 0; width: 1194px; height: 672px;
  transform-origin: 0 0; transform: scale(var(--plh-s));
}
.plh__rig {                        /* Kamera-Absenkung (2D-Verschiebung) + 3D-Kontext fuer Panel A */
  position: absolute; inset: 0;
  perspective: 1200px; perspective-origin: 597px 336px;
}
.plh__a {                          /* Panel A: Ebene (1430 breit, breiter als die Buehne) mit translate3d + rotateY + scale um den Zeilenmittelpunkt */
  position: absolute; left: -118px; top: 54px; width: 1430px; height: 870px;
  transform-origin: 715px 433px;
}
.plh__panel {
  position: absolute; inset: 0; border-radius: var(--plh-radius-panel);
  background:
    radial-gradient(circle at center, var(--plh-dot) 0 1.1px, transparent 1.9px) 4px 12px / var(--plh-dot-gap) var(--plh-dot-gap),
    var(--plh-panel);
  overflow: hidden;
}
.plh__lit {                        /* weisse "Leinwand": links weich aus dem Dunkel, linear 0 -> 1 in ~0.5 s */
  position: absolute; inset: 0; border-radius: var(--plh-radius-panel); opacity: 0;
  background: linear-gradient(90deg, rgba(228,230,231,0) 0, var(--plh-lit) var(--lit-x, 430px), var(--plh-lit) 100%);
}
.plh__row {                        /* Satzzeile in der Panel-Mitte */
  position: absolute; left: 0; right: 0; top: 436px; transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center; white-space: nowrap;
  font-size: var(--plh-row-size); line-height: 1.2; letter-spacing: -0.005em; font-weight: 400;
}
.plh__row b { font-weight: 700; }
.plh__row .t2 { color: var(--plh-ink-soft); }
.plh__slot { position: relative; width: 131px; height: 174px; margin: 0 23px; flex: none; }
.plh__slot svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; display: block; }
.plh__sq {                         /* drehendes Quadrat-Outline (Auswahl-Marker) */
  position: absolute; left: 896px; top: 279px; width: 52px; height: 52px; box-sizing: border-box;
  border: 1.5px solid var(--plh-square); opacity: 0;
}
.plh__sq--dark { border-color: rgba(0,0,0,.2); }
.plh__ptr { position: absolute; left: 894px; top: 253px; width: 22px; height: 27px; opacity: 0; overflow: visible; }
.plh__cards { position: absolute; inset: 0; }
.plh__card {                       /* Foto-Karte (schwebt vor Panel A) */
  position: absolute; left: 0; top: 0; opacity: 0; visibility: hidden;
  border-radius: var(--plh-card-radius); overflow: hidden; background: #111;
}
.plh__card svg { display: block; width: 100%; height: 100%; }
.plh__card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.14), rgba(0,0,0,.22)); box-shadow: inset 0 0 14px rgba(0,0,0,.35); }

/* Panel B: Hero-Mock mit Kachel-Ring, schraege Oberkante (skewY) */
.plh__b {
  position: absolute; left: 628px; top: 205px; width: 1272px; height: 1000px;
  border-radius: 24px 0 0 0; overflow: hidden; background: #000;
  transform-origin: 0 0; transform: skewY(3.43deg);
  visibility: hidden;
}
.plh__bin { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; transform: skewY(-3.43deg); }
.plh__tile {
  position: absolute; left: 0; top: 0; border-radius: var(--plh-radius-tile); overflow: hidden; background: #222;
}
.plh__tile svg { display: block; width: 100%; height: 100%; }
.plh__tile::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.26); }
.plh__title {
  position: absolute; left: 144px; top: 225px; white-space: nowrap; transform-origin: 0 50%; transform: translateY(-50%) scaleX(.74);
  font-size: var(--plh-title-size); font-weight: 500; letter-spacing: -0.025em; line-height: 1;
  background: linear-gradient(90deg, var(--plh-b-title-a) 0, var(--plh-b-title-a) 7%, var(--plh-b-title-b) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
}
.plh__sub { position: absolute; left: 300px; top: 293px; width: 200px; text-align: center; white-space: nowrap; font-size: 13.5px; color: var(--plh-b-sub); transform: translate(0,-50%); letter-spacing: -0.005em; }
.plh__btn {
  position: absolute; left: 368px; top: 349px; width: 68px; height: 34px; border-radius: 17px;
  background: var(--plh-b-btn-bg); color: var(--plh-b-btn-ink); font-size: 12.5px; display: grid; place-items: center; transform: translate(0,-50%);
}
.plh__fade {                       /* Bildschirm-fester Verlauf nach unten (blendet mit der weissen Flaeche ein): alles faedelt zum Rand */
  position: absolute; left: 0; right: 0; top: 440px; bottom: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(180deg, rgba(2,2,2,0) 0, rgba(2,2,2,.05) 37px, rgba(2,2,2,.145) 57px, rgba(2,2,2,.24) 77px, rgba(2,2,2,.34) 97px, rgba(2,2,2,.44) 117px, rgba(2,2,2,.54) 137px, rgba(2,2,2,.66) 157px, rgba(2,2,2,.78) 177px, rgba(2,2,2,.88) 197px, rgba(2,2,2,.96) 217px, #020202 232px);
}
.plh__hud {
  position: absolute; left: 0; right: 0; top: 177px; text-align: center; opacity: 0; white-space: nowrap;
  font-size: var(--plh-hud-size); font-weight: 600; letter-spacing: -0.012em; line-height: 1; color: var(--plh-hud);
  transform: translateY(-50%);
}
.plh__veil { position: absolute; inset: 0; background: var(--plh-stage); opacity: 0; pointer-events: none; }
.plh__sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
/* will-change nur waehrend die Animation laeuft (JS setzt .is-live) */
.plh.is-live .plh__rig, .plh.is-live .plh__a, .plh.is-live .plh__b, .plh.is-live .plh__card, .plh.is-live .plh__tile, .plh.is-live .plh__hud, .plh.is-live .plh__lit { will-change: transform, opacity; }
/* ===== /COMPONENT CSS ===== */
</style>

      const bl = HERO.blur * clamp01((v - HERO.moveAt) / HERO.blurRise) * Math.exp(-HERO.blurK * Math.max(0, v - HERO.blurFrom));

      put(hero.el, 't', 'translate3d(' + r2(x) + 'px,' + r2(y) + 'px,0) rotate(' + r2(rt) + 'deg) scale(' + r3(sx) + ',' + r3(sy) + ')'); put(hero.el, 'f', bl > 0.1 ? 'blur(' + r2(bl) + 'px)' : 'none'); }
    // 5) Panel B: kritisch gedaempfte Feder von rechts
    const Bc = C.b, tau = v - Bc.t0; let bx = Bc.x0 - Bc.x1 > 0 ? Bc.x0 - BX : 0;
    const f = tau <= 0 ? 1 : (1 + Bc.omega * tau) * Math.exp(-Bc.omega * tau);   // 1 -> 0
    bx = (Bc.x0 - Bc.x1) * f;
    put(B, 'v', bx < 600 ? 'visible' : 'hidden');
    put(B, 't', 'translate3d(' + r2(bx) + 'px,0,0) skewY(3.43deg)');
    // Ring-Kacheln: Position auf Ellipse um (cx,cy), Winkel waechst linear mit der Zeit
    if (bx < 600) {
      const R = C.ring, bxc = bx;
      for (let i = 0; i < tiles.length; i++) {
        const t = tiles[i], phi = (t.phi + t.w * (v - R.ref)) * Math.PI / 180;
        const x = R.cx + t.r * R.aspect * Math.cos(phi), y = R.cy - t.r * Math.sin(phi);
        const rot = 180 - phi * 180 / Math.PI + t.rot;
        put(t.el, 't', 'translate3d(' + r2(x - BX) + 'px,' + r2(y - 205 + 0.06 * (x - BX) * 0) + 'px,0) rotate(' + r2(rot) + 'deg)');
      }
    }
    // 6) HUD: Befehlszeile blur-in (Deckkraft easeOutQuad, Versatz exponentiell, Blur kubisch)
    const H = C.hud, hx = clamp01((v - H.t0) / H.dur), ho = 1 - (1 - hx) * (1 - hx), hy = v <= H.t0 ? H.dy : H.dy * Math.exp(-H.kY * (v - H.t0)), hb = H.blur * (1 - hx) * (1 - hx) * (1 - hx);
    put(hud, 'o', r3(ho)); put(hud, 't', 'translate3d(0,' + r2(hy) + 'px,0) translateY(-50%)'); put(hud, 'f', hb > 0.15 ? 'blur(' + r2(hb) + 'px)' : 'none');
    // 7) harter Schnitt am Ende (Loop): Schwarz
    put(veil, 'o', v < 0.1 ? 1 : 0);
  }

  // --- Skalierung der Buehne (nur bei Resize messen) ---
  let ro = null;
  const fit = () => { const w = root.clientWidth || C.stage.w; stage.style.setProperty('--plh-s', String(w / C.stage.w)); root.style.setProperty('--plh-s', String(w / C.stage.w)); };
  fit();
  if (window.ResizeObserver) { ro = new ResizeObserver(fit); ro.observe(root); }

  // --- Zeitgeber ---
  let v = C.autoplay && !reduce.matches ? 0 : Math.min(C.duration - 0.2, 6.0), playing = false, raf = 0, last = 0, visible = true, userPaused = !C.autoplay;
  function tick(now) {
    raf = 0; if (!playing) return;
    const dt = Math.min(50, Math.max(0, now - last)); last = now;          // dt aus dem rAF-Zeitstempel, begrenzt
    v += dt / 1000 * C.speed;
    if (v >= C.duration) { if (C.loop) v = v % C.duration; else { v = C.duration - 0.001; playing = false; root.classList.remove('is-live'); render(v); return; } }
    render(v); raf = requestAnimationFrame(tick);
  }
  function play() { if (reduce.matches) return; userPaused = false; if (!playing && visible) { playing = true; root.classList.add('is-live'); last = performance.now(); raf = requestAnimationFrame(tick); } }
  function pause() { userPaused = true; playing = false; if (raf) cancelAnimationFrame(raf); raf = 0; root.classList.remove('is-live'); }
  function toggle() { (playing || (!userPaused && visible && raf)) ? pause() : play(); }
  function seek(sec) { v = ((sec % C.duration) + C.duration) % C.duration; render(v); }

  // --- Eingabe: Klick/Tipp = Pause/Play, Tasten ---
  const ac = new AbortController(), P = { signal: ac.signal, passive: true };
  root.addEventListener('pointerup', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; toggle(); }, P);
  root.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'k') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); seek(v + 0.5); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(v - 0.5); }
    else if (e.key === 'Home') { e.preventDefault(); seek(0); }
  }, { signal: ac.signal });
  // Tab unsichtbar / ausserhalb des Viewports: Loop anhalten (Energie)
  const onVis = () => { visible = !document.hidden; if (!visible) { playing = false; if (raf) cancelAnimationFrame(raf); raf = 0; root.classList.remove('is-live'); } else if (!userPaused) play(); };
  document.addEventListener('visibilitychange', onVis, { signal: ac.signal });
  let io = null;
  if (window.IntersectionObserver) { io = new IntersectionObserver(es => { visible = es[es.length - 1].isIntersecting && !document.hidden; if (!visible) { playing = false; if (raf) cancelAnimationFrame(raf); raf = 0; root.classList.remove('is-live'); } else if (!userPaused) play(); }); io.observe(root); }
  if (reduce.addEventListener) reduce.addEventListener('change', () => { if (reduce.matches) { pause(); seek(6.0); } else if (C.autoplay) play(); }, { signal: ac.signal });

  render(v);
  if (C.autoplay && !reduce.matches) play(); else { userPaused = true; }
  return {
    play, pause, toggle, seek, time: () => v,
    destroy() { ac.abort(); pause(); ro && ro.disconnect(); io && io.disconnect(); }
  };
}
