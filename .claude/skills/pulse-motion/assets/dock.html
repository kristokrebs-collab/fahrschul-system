<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dock</title>
<style>
/* ==================== CONFIG (alles zum "Hochdrehen" hier) ==================== */
:root{
  /* Farben (gemessen am 21st.dev-Video, Buehne 1234x673) */
  --stage:#1f1f1f;            /* Buehne = Dock-Hintergrund (Dock ist transparent) */
  --dock-border:#2b2b2b;      /* 1px Rahmen */
  --dock-glow:rgba(255,255,255,.04); /* zarter heller Schein UNTER dem Dock */
  --icon:#b3b3b3;             /* Icon-Strich im Ruhezustand */
  --pill:#484848;             /* Hover-Pille hinter dem Icon */
  --tip:#f9f9f9;              /* Tooltip-Text */

  /* Geometrie in px */
  --dock-radius:16px;
  --dock-pad-x:5.5px;         /* Innenabstand links/rechts */
  --dock-pad-y:5.3px;         /* oben/unten */
  --item-w:49.1px;            /* Rasterbreite je Icon (kein Gap) */
  --item-h:49.4px;
  --pill-radius:12px;
  --pill-bleed:.7px;          /* Pille ist je Seite etwas breiter als das Raster */
  --pill-lift:-2.5px;         /* Pille sitzt im Original ~2.5px ueber der Icon-Mitte */
  --icon-size:22px;
  --icon-stroke:1.6;
  --tip-size:12px;
  --tip-gap:20.3px;           /* Abstand Tooltip-Unterkante -> Item-Oberkante (Text-Mitte ~21px ueber dem Dock-Rand) */
  --font:Inter, Geist, ui-sans-serif, system-ui, sans-serif;
}
/* Motion-Werte stehen im JS-CONFIG (DOCK_CONFIG) direkt unter dem Style-Block. */
/* ==================== /CONFIG ==================== */

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--stage);color:var(--tip);font-family:var(--font);display:grid;place-items:center;overflow:hidden}

/* COMPONENT CSS */
.dk-fit{transform-origin:50% 50%;padding:44px 24px 44px;contain:layout paint}   /* Platz fuer Tooltip oben + Schein unten, damit paint-Containment nichts abschneidet */
.dk{position:relative;display:flex;padding:var(--dock-pad-y) var(--dock-pad-x);border:1px solid var(--dock-border);
  border-radius:var(--dock-radius);box-shadow:0 8px 16px var(--dock-glow);
  touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.dk__item{position:relative;display:grid;place-items:center;width:var(--item-w);height:var(--item-h);
  background:none;border:0;padding:0;color:var(--icon);cursor:pointer;border-radius:var(--pill-radius);outline:none}
.dk__pill{position:absolute;inset:0 calc(var(--pill-bleed) * -1);border-radius:var(--pill-radius);background:var(--pill);
  opacity:0;transform:translate3d(0,var(--pill-lift),0);pointer-events:none}
.dk__item svg{position:relative;width:var(--icon-size);height:var(--icon-size);fill:none;stroke:currentColor;
  stroke-width:var(--icon-stroke);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.dk__tip{position:absolute;left:50%;bottom:calc(100% + var(--tip-gap));font:500 var(--tip-size)/14px var(--font);
  color:var(--tip);white-space:nowrap;opacity:0;pointer-events:none;transform:translate3d(-50%,0,0)}
.dk__item:focus-visible .dk__pill{outline:1px solid rgba(255,255,255,.35);outline-offset:-1px}
/* /COMPONENT CSS */
</style>
</head>
<body>

<script>
/* ==================== MOTION CONFIG (ms, px, Feder) ==================== */
const DOCK_CONFIG = {
  tipInTauMs: 38,        // Tooltip-Opacity einblenden: exponentiell, tau 38 ms (~150 ms bis voll)
  tipOutTauMs: 35,       // Tooltip ausblenden
  tipRiseFrom: 6,        // Tooltip steigt von +6px unter seiner Zielposition auf
  tipSpring: { stiffness: 1000, damping: 38 },   // Aufstieg als Feder (leichter Overshoot ~0.6px)
  pillInTauMs: 40,       // Pille einblenden
  pillOutTauMs: 45,      // Pille ausblenden (traeger als der Tooltip)
  pillDelayMs: 25,       // Pille startet minimal nach dem Tooltip
  touchLingerMs: 700     // Touch: Zustand bleibt nach dem Loslassen so lange stehen
};
/* ==================== /MOTION CONFIG ==================== */
</script>

<!-- COMPONENT:START -->
<div class="dk-fit" id="dockFit">
  <nav class="dk" id="dock" aria-label="Dock">
    <button class="dk__item" type="button" data-label="Home" aria-label="Home"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
    <button class="dk__item" type="button" data-label="Search" aria-label="Search"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="dk__item" type="button" data-label="Music" aria-label="Music"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
    <button class="dk__item" type="button" data-label="Favorites" aria-label="Favorites"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
    <button class="dk__item" type="button" data-label="Add New" aria-label="Add New"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
    <button class="dk__item" type="button" data-label="Profile" aria-label="Profile"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
    <button class="dk__item" type="button" data-label="Settings" aria-label="Settings"><i class="dk__pill"></i>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </nav>
</div>
<!-- COMPONENT:END -->

<script>
/* ==================== COMPONENT JS ==================== */
/* initDock(root, opts): root = .dk (nav). opts ueberschreibt DOCK_CONFIG.
   Tooltips (aus data-label) werden einmal erzeugt. Event: root 'dock:select' {index,label}. */
function initDock(root, opts) {
  const cfg = Object.assign({}, DOCK_CONFIG, opts || {});
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const els = Array.from(root.querySelectorAll('.dk__item'));
  const N = els.length;
  const S = els.map((el) => {
    const tip = document.createElement('span');
    tip.className = 'dk__tip'; tip.setAttribute('aria-hidden', 'true'); tip.textContent = el.dataset.label;
    el.appendChild(tip);
    return { el, tip, pill: el.querySelector('.dk__pill'), a: 0, p: 0, y: 0, vy: 0, wa: -1, wp: -1, wy: 1e9, on: false };
  });
  let hov = -1, hovAt = 0, focusIdx = -1, ptr = null, ptrDirty = false, lingerUntil = 0, touching = false;
  let rect = null, stale = true, raf = 0, last = 0, acc = 0;
  const STEP = 1 / 240;

  function measure() {                       // einmalig (pointerenter / Resize), nie pro Frame
    const r = root.getBoundingClientRect(), cs = getComputedStyle(root);
    const sc = r.width / root.offsetWidth || 1;
    rect = { l: r.left, t: r.top, w: r.width, h: r.height, sc,
      off: (parseFloat(cs.paddingLeft) + parseFloat(cs.borderLeftWidth)) * sc, pitch: S[0].el.offsetWidth * sc };
    stale = false;
  }
  new ResizeObserver(() => { stale = true; }).observe(root);
  addEventListener('scroll', () => { stale = true; }, { passive: true });
  addEventListener('resize', () => { stale = true; }, { passive: true });

  function indexAt(x, y) {
    if (x < rect.l || x > rect.l + rect.w || y < rect.t || y > rect.t + rect.h) return -1;
    return Math.max(0, Math.min(N - 1, Math.floor((x - rect.l - rect.off) / rect.pitch)));
  }
  function setHover(i, now) {
    if (i === hov) return;
    hov = i; hovAt = now;
    if (i >= 0) { const s = S[i]; if (s.a < 0.03 && !reduce) { s.y = cfg.tipRiseFrom; s.vy = 0; } }
  }
  function wake() { if (!raf) { last = performance.now(); acc = 0; raf = requestAnimationFrame(frame); } }

  function onPtr(e) {
    const c = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    const l = c && c.length ? c[c.length - 1] : e;
    ptr = { x: l.clientX, y: l.clientY }; ptrDirty = true; touching = e.pointerType !== 'mouse';
    if (e.type === 'pointerenter' || stale) measure();
    wake();
  }
  root.addEventListener('pointerenter', onPtr, { passive: true });
  root.addEventListener('pointermove', onPtr, { passive: true });
  root.addEventListener('pointerdown', onPtr, { passive: true });
  root.addEventListener('pointerleave', () => { ptr = null; ptrDirty = true; lingerUntil = 0; wake(); }, { passive: true });
  root.addEventListener('pointercancel', () => { ptr = null; ptrDirty = true; wake(); }, { passive: true });
  root.addEventListener('pointerup', (e) => {
    if (e.pointerType !== 'mouse') { lingerUntil = performance.now() + cfg.touchLingerMs; wake(); }
  }, { passive: true });
  root.addEventListener('focusin', (e) => { const i = S.findIndex((s) => s.el === e.target); if (i >= 0 && e.target.matches(':focus-visible')) { focusIdx = i; wake(); } });
  root.addEventListener('focusout', () => { focusIdx = -1; wake(); });
  root.addEventListener('click', (e) => {
    const i = S.findIndex((s) => s.el.contains(e.target));
    if (i >= 0) root.dispatchEvent(new CustomEvent('dock:select', { detail: { index: i, label: S[i].el.dataset.label }, bubbles: true }));
  });

  function setOn(s, on) {
    if (on !== s.on) { s.on = on; const w = on ? 'opacity, transform' : ''; s.tip.style.willChange = w; s.pill.style.willChange = on ? 'opacity' : ''; }
  }

  function frame(t) {
    const dt = Math.min(t - last, 50); last = t;
    let alive = false;
    if (ptrDirty) {                          // gebuendelte Eingabe: einmal pro Frame
      ptrDirty = false;
      if (!rect || stale) measure();
      if (ptr) setHover(indexAt(ptr.x, ptr.y), t);
      else if (!(touching && t < lingerUntil)) setHover(-1, t);
    }
    if (touching && !ptr && lingerUntil && t >= lingerUntil) { lingerUntil = 0; setHover(-1, t); }
    if (touching && !ptr && t < lingerUntil) alive = true;
    const target = focusIdx >= 0 && hov < 0 ? focusIdx : hov;
    if (target !== hov && focusIdx >= 0 && hov < 0) { hov = focusIdx; hovAt = t; const s = S[hov]; if (s.a < 0.03 && !reduce) { s.y = cfg.tipRiseFrom; s.vy = 0; } }
    acc += dt / 1000;                        // Federn: semi-impliziter Euler, fester Substep 1/240 s
    let steps = 0; while (acc >= STEP && steps < 24) { acc -= STEP; steps++; }
    if (acc > STEP) acc = 0;
    for (let i = 0; i < N; i++) {
      const s = S[i], isH = i === hov;
      const tA = isH ? 1 : 0, tP = isH && t - hovAt >= cfg.pillDelayMs ? 1 : 0;
      if (reduce) { s.a = tA; s.p = tP || tA; s.y = 0; s.vy = 0; }
      else {
        s.a += (tA - s.a) * (1 - Math.exp(-dt / (tA ? cfg.tipInTauMs : cfg.tipOutTauMs)));
        s.p += (tP - s.p) * (1 - Math.exp(-dt / (tP ? cfg.pillInTauMs : cfg.pillOutTauMs)));
        const k = cfg.tipSpring.stiffness, c = cfg.tipSpring.damping;
        for (let j = 0; j < steps; j++) { s.vy += (-k * s.y - c * s.vy) * STEP; s.y += s.vy * STEP; }
      }
      if (Math.abs(tA - s.a) < 0.002) s.a = tA;
      if (Math.abs(tP - s.p) < 0.002) s.p = tP;
      if (Math.abs(s.y) < 0.01 && Math.abs(s.vy) < 0.05) { s.y = 0; s.vy = 0; }
      const busy = s.a !== tA || s.p !== tP || s.y !== 0 || (isH && !tP);
      if (busy) alive = true;
      setOn(s, busy || s.a > 0 || s.p > 0);
      if (s.a !== s.wa) { s.tip.style.opacity = s.a; s.wa = s.a; }
      if (s.p !== s.wp) { s.pill.style.opacity = s.p; s.wp = s.p; }
      if (s.y !== s.wy) { s.tip.style.transform = 'translate3d(-50%,' + s.y.toFixed(2) + 'px,0)'; s.wy = s.y; }
    }
    raf = alive ? requestAnimationFrame(frame) : 0;
  }
  return { destroy() { cancelAnimationFrame(raf); raf = 0; }, items: S };
}
/* ==================== /COMPONENT JS ==================== */

/* ==================== DEMO ==================== */
(function () {
  const fit = document.getElementById('dockFit'), dock = document.getElementById('dock');
  function scaleToFit() {                    // schmale Viewports: Dock proportional verkleinern (einmal pro Resize)
    const s = Math.min(1, (innerWidth - 32) / dock.offsetWidth);
    fit.style.transform = s < 1 ? 'scale(' + s + ')' : '';
  }
  scaleToFit(); addEventListener('resize', scaleToFit, { passive: true });
  window._dock = initDock(dock);
})();
</script>
</body>
</html>
