<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parallax Strip Slider</title>
<style>
/* ===== CONFIG (hier hochdrehen) ===== */
:root{
  /* Look */
  --stage-bg:#050505;              /* Buehne hinter den Bildern */
  --ui-text:#ffffff;               /* Label + Titel (Weiss) */
  --ui-text-dim:rgba(255,255,255,.55); /* Zaehler "01/ 03" */
  --line-base:rgba(255,255,255,.18);   /* Fortschrittslinie: Grundlinie */
  --line-fill:rgba(255,255,255,.65);   /* Fortschrittslinie: gefuellter Teil */
  --font-serif:"Instrument Serif","Cormorant Garamond","Playfair Display",ui-serif,"Liberation Serif",Georgia,serif;
  --font-sans:Inter,Geist,ui-sans-serif,system-ui,"Liberation Sans",Arial,sans-serif;
  --title-size:8.6cqw;             /* Titel ~106px @1230 Buehne */
  --title-xscale:.74;              /* Titel schmaler (Original: condensed Serif; Fallback-Serif ist breiter) */
  --title-letter-spacing:-.01em;
  --label-size:12px;               /* "Collection 01" */
  --counter-size:11px;             /* "01/ 03" */
  --pad:41px;                      /* Innenabstand der UI (links/rechts/oben) */
  --line-top:32px;                 /* Abstand der Linie von oben */
  --title-bottom:5.6%;             /* Abstand Titel-Unterkante zum unteren Rand */
  --veil:linear-gradient(to top,rgba(0,0,0,.28),rgba(0,0,0,0) 38%); /* leichter Verlauf unten */
}
</style>
<script>
/* ===== MOTION CONFIG (alle Zeiten in ms) ===== */
const PS_CONFIG = {
  columns: 10,            // Anzahl Streifen
  colStagger: 26,         // Versatz zwischen Streifen (links -> rechts)
  colWidthMs: 420,        // Dauer Breitenwachstum je Streifen (easeOutQuart)
  colHeightTau: 45,       // Zeitkonstante Hoehenwachstum von oben nach unten (1-exp(-t/tau)); klein = schneller
  colHeightEnd: 420,      // ab hier ist die Hoehe = 100 %
  titleOutDelay: 260,     // alter Titel/Label blendet ab
  titleOutMs: 280,
  titleInDelay: 560,      // neuer Titel steigt buchstabenweise auf
  letterStagger: 30,
  letterMs: 320,
  metaInDelay: 600,       // neues Label + Zaehler blenden ein
  metaInMs: 260,
  lineDelay: 300,         // Fortschrittslinie wandert zum neuen Stand
  lineMs: 650,
  totalMs: 1050,          // Gesamtdauer eines Wechsels
  autoplayMs: 1900,       // Start-zu-Start-Abstand; 0 = aus (nur Klick/Swipe/Tasten)
  firstDelayMs: 1040,     // Wartezeit bis zum ersten Wechsel (Video: ~1.04 s)
  swipePx: 40,
  reducedFadeMs: 220      // prefers-reduced-motion: nur Ueberblendung
};
</script>
<style>
/* COMPONENT CSS */
html,body{margin:0;height:100%}
body{background:var(--stage-bg);overflow:hidden;font-family:var(--font-sans)}
.ps{position:relative;width:100%;height:100%;container-type:size;contain:layout paint;overflow:hidden;
  background:var(--stage-bg);color:var(--ui-text);touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;-webkit-user-select:none}
.ps__slide{position:absolute;inset:0;visibility:hidden}
.ps__slide svg{display:block;width:100%;height:100%}
.ps__slide.is-base{visibility:visible;z-index:1}
.ps__slide.is-next{visibility:visible;z-index:2}
.ps.is-running .ps__slide.is-next{will-change:clip-path}
.ps__veil{position:absolute;inset:0;z-index:3;background:var(--veil);pointer-events:none}
.ps__line{position:absolute;z-index:4;left:var(--pad);right:var(--pad);top:var(--line-top);height:1px;background:var(--line-base);pointer-events:none}
.ps__fill{position:absolute;inset:0;background:var(--line-fill);transform-origin:0 50%;transform:scale3d(.3333,1,1)}
.ps__label{position:absolute;z-index:4;left:var(--pad);top:calc(var(--line-top) + 33px);font:600 var(--label-size)/1 var(--font-sans);letter-spacing:.01em;margin:0;pointer-events:none}
.ps__count{position:absolute;z-index:4;right:var(--pad);bottom:calc(var(--title-bottom) + 3.2cqw);font:400 var(--counter-size)/1 var(--font-sans);color:var(--ui-text-dim);letter-spacing:.04em;margin:0;pointer-events:none;font-variant-numeric:tabular-nums}
.ps__title{position:absolute;z-index:4;left:var(--pad);bottom:var(--title-bottom);margin:0;font:400 var(--title-size)/1.12 var(--font-serif);letter-spacing:var(--title-letter-spacing);
  transform:scale3d(var(--title-xscale),1,1);transform-origin:0 100%;overflow:hidden;padding:0 .08em .06em 0;white-space:nowrap;pointer-events:none}
.ps__ch{display:inline-block;transform:translate3d(0,0,0)}
.ps__nav{position:absolute;z-index:5;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;
  background:rgba(0,0,0,.28);color:#fff;cursor:pointer;opacity:0;transition:opacity .2s}
.ps:hover .ps__nav,.ps:focus-within .ps__nav{opacity:.85}
.ps__nav--prev{left:14px}.ps__nav--next{right:14px}
.ps__nav svg{width:16px;height:16px}
.ps__sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (hover:none){.ps__nav{display:none}}
@media (prefers-reduced-motion:reduce){.ps__nav{transition:none}}
</style>
</head>
<body>
<!-- COMPONENT:START -->
<section class="ps" id="ps" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Parallax Strip Slider">
  <div class="ps__slides"></div>
  <div class="ps__veil"></div>
  <div class="ps__line"><div class="ps__fill"></div></div>
  <p class="ps__label"></p>
  <p class="ps__count"></p>
  <h2 class="ps__title" aria-hidden="true"></h2>
  <button class="ps__nav ps__nav--prev" type="button" aria-label="Vorheriges Bild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ps__nav ps__nav--next" type="button" aria-label="Naechstes Bild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="ps__sr" aria-live="polite"></div>
</section>
<!-- COMPONENT:END -->

<script>
/* COMPONENT JS: initParallaxStripSlider(root, opts)
   opts: { slides:[{title,label,image(SVG/HTML-String ODER URL)}], ...PS_CONFIG-Ueberschreibungen, onChange(i) }
   API:  returns { next(), prev(), go(i), destroy() } */
function initParallaxStripSlider(root, opts){
  opts = opts || {};
  const C = Object.assign({}, PS_CONFIG, opts);
  const slides = opts.slides || [];
  const N = slides.length;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => root.querySelector(s);
  const wrap = $('.ps__slides'), fill = $('.ps__fill'), label = $('.ps__label'), count = $('.ps__count'),
        title = $('.ps__title'), live = $('.ps__sr');
  const ease4 = (p) => 1 - Math.pow(1 - p, 4);
  const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
  const pad2 = (n) => (n < 10 ? '0' : '') + n;

  // --- Slides einmal aufbauen ---
  const els = slides.map((s) => {
    const d = document.createElement('div'); d.className = 'ps__slide';
    if (/^\s*</.test(s.image)) d.innerHTML = s.image;
    else d.style.cssText = 'background:center/cover url("' + s.image + '")';
    wrap.appendChild(d); return d;
  });

  // --- Buehnengroesse einmal messen (kein Layout-Lesen pro Frame) ---
  let W = 1230, H = 672;
  const measure = () => { W = root.clientWidth; H = root.clientHeight; };
  measure();
  const ro = new ResizeObserver(() => { measure(); if (!running) idleClip(); });
  ro.observe(root);

  // --- Titel (Buchstaben-Spans nur beim Wechsel neu bauen) ---
  let chars = [];
  function setTitle(text){
    title.textContent = ''; chars = [];
    for (const ch of text) {
      const sp = document.createElement('span'); sp.className = 'ps__ch';
      sp.textContent = ch === ' ' ? ' ' : ch; title.appendChild(sp); chars.push(sp);
    }
  }
  function setMeta(i){ label.textContent = slides[i].label; count.textContent = pad2(i + 1) + '/ ' + pad2(N); }
  function idleClip(){ if (cur != null) els[cur].style.clipPath = 'none'; }

  let cur = 0, from = 0, to = 0, running = false, t0 = 0, raf = 0, nextAt = 0, dead = false;
  let lineFrom = 1 / N, lineTo = 1 / N;
  let metaSwapped = false, titleSwapped = false;

  els[0].classList.add('is-base'); setTitle(slides[0].title); setMeta(0);
  live.textContent = slides[0].label + ': ' + slides[0].title;

  function clipPath(e){
    // N Streifen: Breite waechst (links verankert), Hoehe waechst von oben nach unten
    const cw = W / C.columns; let d = '';
    for (let i = 0; i < C.columns; i++) {
      const le = e - i * C.colStagger;
      if (le <= 0) continue;
      const sx = ease4(clamp01(le / C.colWidthMs));
      const sy = le >= C.colHeightEnd ? 1 : 1 - Math.exp(-le / C.colHeightTau);
      const x = i * cw, w = cw * sx, h = H * sy;
      d += 'M' + x.toFixed(1) + ' 0h' + w.toFixed(1) + 'v' + h.toFixed(1) + 'h-' + w.toFixed(1) + 'z';
    }
    return d ? 'path("' + d + '")' : 'path("M0 0h0v0z")';
  }

  function render(e){
    const nextEl = els[to];
    if (reduce) {
      nextEl.style.opacity = clamp01(e / C.reducedFadeMs);
    } else {
      nextEl.style.clipPath = clipPath(e);
    }
    // Titel/Label alt: ausblenden, neu: aufsteigen
    const outP = clamp01((e - C.titleOutDelay) / C.titleOutMs);
    if (!titleSwapped) {
      title.style.opacity = 1 - outP; label.style.opacity = 1 - outP; count.style.opacity = 1 - outP;
      if (e >= C.titleInDelay) { titleSwapped = true; setTitle(slides[to].title); title.style.opacity = 1; }
    }
    if (titleSwapped) {
      for (let i = 0; i < chars.length; i++) {
        const p = ease4(clamp01((e - C.titleInDelay - i * C.letterStagger) / C.letterMs));
        chars[i].style.transform = 'translate3d(0,' + ((1 - p) * 110).toFixed(2) + '%,0)';
      }
    }
    if (!metaSwapped && e >= C.metaInDelay) { metaSwapped = true; setMeta(to); }
    if (metaSwapped) {
      const p = clamp01((e - C.metaInDelay) / C.metaInMs);
      label.style.opacity = p; count.style.opacity = p;
    }
    // Fortschrittslinie
    const lp = clamp01((e - C.lineDelay) / C.lineMs);
    const le = lp < .5 ? 4 * lp * lp * lp : 1 - Math.pow(-2 * lp + 2, 3) / 2;
    fill.style.transform = 'scale3d(' + (lineFrom + (lineTo - lineFrom) * le).toFixed(4) + ',1,1)';
  }

  function finish(){
    running = false; root.classList.remove('is-running');
    els[from].classList.remove('is-base');
    const n = els[to]; n.classList.remove('is-next'); n.classList.add('is-base'); n.style.clipPath = 'none'; n.style.opacity = '';
    title.style.opacity = ''; label.style.opacity = ''; count.style.opacity = '';
    for (const c of chars) c.style.transform = '';
    cur = to; lineFrom = lineTo; fill.style.transform = 'scale3d(' + lineTo.toFixed(4) + ',1,1)';
    live.textContent = slides[cur].label + ': ' + slides[cur].title;
    if (opts.onChange) opts.onChange(cur);
  }

  function frame(t){
    raf = 0; if (dead) return;
    if (running) {
      const e = t - t0;
      render(e);
      if (e >= C.totalMs) { finish(); if (C.autoplayMs > 0) nextAt = t0 + C.autoplayMs; }
    } else if (C.autoplayMs > 0 && nextAt && t >= nextAt) { start(cur + 1, t); return; }
    if (running || (C.autoplayMs > 0 && !document.hidden)) raf = requestAnimationFrame(frame);
  }
  function kick(){ if (!raf && !dead) raf = requestAnimationFrame(frame); }

  function start(i, t){
    if (N < 2) return;
    if (running) finish();            // laufenden Wechsel sofort abschliessen
    i = ((i % N) + N) % N;
    from = cur; to = i; lineTo = (to + 1) / N; metaSwapped = false; titleSwapped = false;
    const n = els[to]; n.classList.add('is-next');
    if (reduce) n.style.opacity = 0; else n.style.clipPath = 'path("M0 0h0v0z")';
    running = true; root.classList.add('is-running'); t0 = t != null ? t : performance.now();
    kick();
  }
  const go = (i) => start(i, null);
  const next = () => go(cur + 1), prev = () => go(cur - 1);
  // Autoplay-Start
  if (C.autoplayMs > 0) { nextAt = performance.now() + C.firstDelayMs; kick(); }

  // --- Eingabe: Pfeile, Tasten, Swipe (nur Position merken, passive Listener) ---
  $('.ps__nav--next').addEventListener('click', () => { nextAt = 0; next(); });
  $('.ps__nav--prev').addEventListener('click', () => { nextAt = 0; prev(); });
  const onKey = (e) => { if (e.key === 'ArrowRight') { nextAt = 0; next(); } else if (e.key === 'ArrowLeft') { nextAt = 0; prev(); } };
  root.addEventListener('keydown', onKey);
  let sx = null;
  const down = (e) => { sx = e.clientX; };
  const up = (e) => {
    if (sx == null) return; const dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > C.swipePx) { nextAt = 0; dx < 0 ? next() : prev(); }
  };
  root.addEventListener('pointerdown', down, { passive: true });
  root.addEventListener('pointerup', up, { passive: true });
  root.addEventListener('pointercancel', () => { sx = null; }, { passive: true });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (C.autoplayMs > 0) nextAt = performance.now() + C.autoplayMs; kick(); } });

  return { next, prev, go, destroy(){ dead = true; ro.disconnect(); cancelAnimationFrame(raf); root.removeEventListener('keydown', onKey); } };
}
</script>

<script>

  slides: [
    { title: 'Fire',   label: 'Collection 01', image: SVG_FIRE },
    { title: 'Allure', label: 'Collection 02', image: SVG_ALLURE },

</script>
