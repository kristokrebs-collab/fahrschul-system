<style>

	}
.leaflet-top,

.leaflet-popup {

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-oldie .leaflet-popup-content-wrapper {

.leaflet-oldie .leaflet-popup-tip {

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

	}
.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;

	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {
	left: 50%;

	}

<style>
/* ============================================================
   DESIGN-TOKENS  ·  Quiet Luxury / Matte Sophistication
   ============================================================ */
:root{
  --bg-base:#0F1219;
  --bg-deep:#0B0E14;
  --surface:#1A1F2C;
  --surface-2:#1F2536;
  --surface-3:#242B3D;

  --border:rgba(248,250,252,0.07);
  --border-strong:rgba(248,250,252,0.13);

  --text:#F8FAFC;
  --text-dim:#9AA3B4;
  --text-faint:#616B80;

  --accent:#E11D48;          /* gedecktes Akzent-Rot */
  --accent-hi:#F43F5E;
  --accent-soft:rgba(225,29,72,0.12);
  --accent-line:rgba(225,29,72,0.38);
  --accent-glow:rgba(225,29,72,0.45);

  --emerald:#10B981;         /* Prüfungs-Ready */
  --emerald-hi:#34D399;
  --emerald-soft:rgba(16,185,129,0.12);
  --emerald-line:rgba(16,185,129,0.40);

  --radius:20px;
  --radius-sm:14px;
  --radius-xs:10px;

  --shadow:0 18px 44px -22px rgba(0,0,0,0.85);
  --shadow-sm:0 8px 22px -14px rgba(0,0,0,0.8);

  /* physikbasierte CSS-Spring-Transition */
  --spring:transform .5s cubic-bezier(.34,1.56,.64,1);
  --spring-soft:transform .42s cubic-bezier(.22,1.2,.4,1);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-base);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.5;
  letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
/* Ambient: sehr zurückhaltende, matte Lichtstimmung – kein Neon */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 18% -8%, rgba(225,29,72,0.10), transparent 60%),
    radial-gradient(760px 520px at 108% 12%, rgba(52,73,110,0.16), transparent 62%),
    radial-gradient(700px 700px at 50% 118%, rgba(16,185,129,0.05), transparent 60%);
}

/* Interactive Particle Background – dezente Verkehrszeichen-Silhouetten */
#fxCanvas{position:fixed;inset:0;z-index:-2;pointer-events:none;transform:translateZ(0);}

/* ============================================================
   ANTI-FLICKER + 3D-BASIS  ·  stabile GPU-Kompositionen
   ============================================================ */
/* Flächen, die animiert/transformiert werden, bekommen eine eigene,
   flimmerfreie Ebene. backface-hidden verhindert Sub-Pixel-Shimmer. */
.card,.theme-tile,.class-tile,.mini,.stat-box,.morph-card,.hot-item,
.tl-row,.besitz-tile,.ring-wrap svg,.cd-unit,.doc-scan,.avatar,.logo{
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  -webkit-transform:translateZ(0);
}
/* 3D-Bühne: Karten dürfen sich echt im Raum neigen */
.tilt3d{transform-style:preserve-3d;transition:transform .55s var(--ease-out);}
.tilt3d.tilting{transition:transform .12s linear;}
.tilt-depth{transform:translateZ(28px);transform-style:preserve-3d;}
.tilt-depth-sm{transform:translateZ(14px);}
/* Glanzreflex, der beim Neigen über die Karte wandert (rein dekorativ) */
.tilt-sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.10),transparent 60%);
  transition:opacity .3s var(--ease-out);mix-blend-mode:screen;z-index:1;}
.tilt3d.tilting .tilt-sheen{opacity:1;}

/* Scroll-getriebener Fortschrittsbalken am oberen Rand */
.scroll-progress{
  position:fixed;top:0;left:0;height:2px;width:0;z-index:150;pointer-events:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-hi));
  box-shadow:0 0 12px -2px var(--accent-glow);
  border-radius:0 999px 999px 0;
}

/* Basisgröße der Inline-Icons (Kontext-Selektoren überschreiben) */
svg.lci{width:18px;height:18px;flex:0 0 auto;}

/* ============================================================
   LAYOUT  ·  mobiles PWA-Cockpit (zentrierte Spalte)
   ============================================================ */
.app{
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:20px 18px calc(48px + env(safe-area-inset-bottom));
  padding-top:calc(18px + env(safe-area-inset-top));
  perspective:1500px;
  perspective-origin:50% 22%;
}

/* Screen-Übergang (Anmeldung → Klassenwahl → Cockpit) · 3D-Tiefenschub */
.screen{animation:screenIn .6s var(--ease-out);transform-origin:50% 40%;}
@keyframes screenIn{
  from{opacity:0;transform:perspective(1500px) translate3d(0,26px,-120px) rotateX(9deg);}
  to{opacity:1;transform:perspective(1500px) translate3d(0,0,0) rotateX(0);}
}

/* Scroll-Animate-on-Reveal: Sektionen klappen leicht aus dem Raum herein.
   Nach der Animation wird der Transform entfernt (.settled) → Text bleibt
   gestochen scharf, kein Sub-Pixel-Flackern. */
.reveal{opacity:0;transform:perspective(1300px) translate3d(0,32px,0) rotateX(8deg);transform-origin:50% 0;transition:opacity .7s var(--ease-out),transform .85s var(--ease-out);}
.reveal.revealed{opacity:1;transform:perspective(1300px) translate3d(0,0,0) rotateX(0);}
.reveal.settled{transform:none;transition:opacity .4s var(--ease-out);}
/* „Flieg-herein" – Sektionen kommen abwechselnd leicht von links/rechts aus dem Raum */
.reveal.rv-l{transform:perspective(1300px) translate3d(-22px,30px,-40px) rotateX(7deg) rotateY(6deg);}
.reveal.rv-r{transform:perspective(1300px) translate3d(22px,30px,-40px) rotateX(7deg) rotateY(-6deg);}
.reveal.rv-l.revealed,.reveal.rv-r.revealed{transform:perspective(1300px) translate3d(0,0,0) rotateX(0) rotateY(0);}

/* Premium-Sperre: Prüfgebiet-Guide (exklusive Leistung der Fahrschule) */
.lock-card{position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border-strong);
  background:linear-gradient(180deg,var(--surface),#141824);padding:26px 20px;text-align:center;box-shadow:var(--shadow-sm);}
.lock-card::before{content:"";position:absolute;inset:0;opacity:.45;pointer-events:none;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask:radial-gradient(120% 82% at 50% 0,#000,transparent 72%);mask:radial-gradient(120% 82% at 50% 0,#000,transparent 72%);}
.lock-card>*{position:relative;z-index:1;}
.lock-glow{position:absolute;left:50%;top:-14%;width:300px;height:190px;transform:translateX(-50%);z-index:0;
  background:radial-gradient(circle,var(--accent-soft),transparent 65%);pointer-events:none;}
.lock-badge{width:62px;height:62px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;position:relative;
  background:var(--accent-soft);border:1px solid var(--accent-line);box-shadow:0 0 26px -6px var(--accent-glow);}
.lock-badge svg{width:28px;height:28px;color:var(--accent-hi);}
.lock-badge .lb-ping{position:absolute;inset:0;border-radius:18px;border:1px solid var(--accent-line);animation:lbping 2.6s var(--ease-out) infinite;}
@keyframes lbping{0%{transform:scale(1);opacity:.7;}100%{transform:scale(1.5);opacity:0;}}
.lock-eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-hi);font-weight:700;margin-bottom:7px;}
.lock-title{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:9px;}
.lock-desc{font-size:13px;color:var(--text-dim);line-height:1.6;margin:0 auto 16px;max-width:340px;}
.lock-teaser{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--text-dim);
  background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 14px;margin-bottom:18px;}
.lock-teaser svg{width:14px;height:14px;color:var(--accent-hi);}
.lock-card .btn{max-width:280px;margin:0 auto;}
.lock-hint{font-size:11px;color:var(--text-faint);margin-top:12px;}
.map-unlocked-note{display:flex;align-items:center;gap:8px;justify-content:center;font-size:11px;color:var(--emerald-hi);
  background:var(--emerald-soft);border:1px solid var(--emerald-line);border-radius:999px;padding:6px 12px;margin:0 auto 12px;width:max-content;}
.map-unlocked-note svg{width:13px;height:13px;}

/* Premium-Umschalter (Ruhiger Modus) */
.switch-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;
  padding:12px 13px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);
  font-family:inherit;color:var(--text);cursor:pointer;transition:border-color .25s,background .25s;}
.switch-row:hover{border-color:var(--border-strong);}
.switch-row .swic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 34px;}
.switch-row .swic svg{width:16px;height:16px;color:var(--text-dim);}
.switch-row .swt{flex:1;min-width:0;}
.switch-row .swt .ht{display:block;font-size:13px;font-weight:700;}
.switch-row .swt .hd{display:block;font-size:11px;color:var(--text-faint);line-height:1.4;margin-top:2px;}
.sw-toggle{flex:0 0 auto;width:44px;height:26px;border-radius:999px;background:var(--surface-3);border:1px solid var(--border-strong);position:relative;transition:background .3s,border-color .3s;}
.sw-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--text-faint);transition:transform .32s var(--ease-out),background .3s;}
.switch-row.on .swic{background:var(--accent-soft);border-color:var(--accent-line);}
.switch-row.on .swic svg{color:var(--accent-hi);}
.switch-row.on .sw-toggle{background:var(--accent-soft);border-color:var(--accent-line);}
.switch-row.on .sw-knob{transform:translateX(18px);background:var(--accent-hi);}

/* ---------- Topbar & Branding ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.logo{
  width:44px;height:44px;flex:0 0 44px;border-radius:13px;
  background:linear-gradient(150deg,#000 0%,#14171F 100%);
  border:1px solid var(--border-strong);
  display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 18px -8px rgba(0,0,0,0.9);
}
.logo svg{width:100%;height:100%;}
.wordmark{display:flex;flex-direction:column;min-width:0;}
.wordmark .name{font-size:12.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text);white-space:nowrap;}
.wordmark .sub{font-size:10.5px;letter-spacing:0.24em;text-transform:uppercase;color:var(--text-faint);}
.top-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.icon-btn{
  width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-dim);display:grid;place-items:center;
  cursor:pointer;position:relative;transition:var(--spring),border-color .3s,color .3s,background .3s;
}
.icon-btn:hover{transform:scale(1.06);border-color:var(--border-strong);color:var(--text);}
.icon-btn:active{transform:scale(.96);}
.icon-btn svg{width:19px;height:19px;}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--surface);}
.avatar{
  width:42px;height:42px;border-radius:12px;flex:0 0 42px;display:grid;place-items:center;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--text);
  background:linear-gradient(150deg,#242B3D,#1A1F2C);border:1px solid var(--border-strong);
}

/* ---------- Greeting ---------- */
.greeting{margin-bottom:26px;}
.greeting .hello{font-size:13px;color:var(--text-dim);letter-spacing:.01em;margin-bottom:4px;}
.greeting h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1.08;}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;
  font-size:12px;font-weight:600;letter-spacing:.01em;
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
}

/* Greeting-Kopf mit schwebendem Fortschritts-Badge */
.greeting-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.greeting-top .gt-l{min-width:0;flex:1;}
.hero-badge{
  flex:0 0 auto;position:relative;width:76px;height:76px;border-radius:20px;
  background:linear-gradient(155deg,var(--surface-2),#14192339);
  border:1px solid var(--border-strong);display:grid;place-items:center;
  box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;
}
.hero-badge .hb-ring{position:absolute;inset:8px;border-radius:50%;
  background:conic-gradient(from -90deg,var(--accent) 0turn,var(--accent-hi) var(--p,0turn),var(--surface-3) var(--p,0turn));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  transition:--p 1.4s var(--ease-out);}
.hero-badge .hb-core{position:relative;text-align:center;z-index:2;}
.hero-badge .hb-pct{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.hero-badge .hb-lab{font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-top:2px;}
.hero-badge .hb-sheen{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.14) 50%,transparent 58%);
  transform:translateX(-130%);animation:sweep 2.6s var(--ease-io) 1s infinite;}
@property --p{syntax:'<angle>';inherits:false;initial-value:0turn;}
.chip svg{width:14px;height:14px;color:var(--accent-hi);}
.chip.accent{background:var(--accent-soft);border-color:var(--accent-line);color:#FCA5B5;}
.chip.accent svg{color:var(--accent-hi);}

/* ---------- Section scaffold ---------- */
.section{margin-bottom:26px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 13px;}
.eyebrow{font-size:10.5px;letter-spacing:0.26em;text-transform:uppercase;color:var(--text-faint);font-weight:700;}
.section-title{font-size:16px;font-weight:700;letter-spacing:-0.02em;margin:2px 0 0;}
.head-note{font-size:11.5px;color:var(--text-faint);letter-spacing:.01em;}

/* ---------- Card base ---------- */
.card{
  background:linear-gradient(180deg,var(--surface) 0%,#171B27 100%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  box-shadow:var(--shadow-sm);
  position:relative;
}
.card + .card{margin-top:14px;}
.card.interactive{cursor:pointer;transition:var(--spring),border-color .35s,box-shadow .35s;will-change:transform;}
.card.interactive:hover{transform:scale(1.03);border-color:var(--border-strong);box-shadow:var(--shadow);}
.card.interactive:active{transform:scale(.985);}

.card-title{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--text);margin-bottom:14px;}
.card-title .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border);flex:0 0 30px;}
.card-title .ic svg{width:16px;height:16px;color:var(--accent-hi);}
.card-title .spacer{flex:1;}
.card-title .meta{font-size:12px;font-weight:600;color:var(--text-dim);letter-spacing:0;}

/* ---------- Progress bars ---------- */
.bar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.bar-label{font-size:13px;color:var(--text-dim);}
.bar-value{font-size:13px;font-weight:700;color:var(--text);}
.bar-value b{color:var(--accent-hi);}
.track{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative;}
.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent) 0%,var(--accent-hi) 100%);transition:width 1.25s var(--ease-out);box-shadow:0 0 14px -2px var(--accent-glow);}
.fill.emerald{background:linear-gradient(90deg,var(--emerald),var(--emerald-hi));box-shadow:0 0 14px -2px rgba(16,185,129,.5);}
.fill.muted{background:linear-gradient(90deg,#39415A,#4A5470);box-shadow:none;}

/* ---------- Sonderfahrten grid ---------- */
.divider{height:1px;background:var(--border);margin:16px 0;}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mini{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 10px;text-align:center;position:relative;overflow:hidden;
  transition:var(--spring-soft),border-color .3s;will-change:transform;
}
.mini:hover{transform:scale(1.03);border-color:var(--border-strong);}
.mini .mic{width:30px;height:30px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 8px;}
.mini .mic svg{width:16px;height:16px;color:var(--text-dim);}
.mini .mnum{font-size:19px;font-weight:800;letter-spacing:-0.02em;}
.mini .mnum b{color:var(--accent-hi);}
.mini .mlab{font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;text-transform:uppercase;margin-top:2px;}
.mini .mtrack{height:4px;border-radius:999px;background:var(--surface-3);margin-top:9px;overflow:hidden;}
.mini .mfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width 1.1s var(--ease-out);border-radius:999px;}
.mini.locked .mnum,.mini.locked .mlab{opacity:.35;}
.mini .lockwrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(15,18,25,0.72);backdrop-filter:blur(2px);}
.mini .lockwrap svg{width:16px;height:16px;color:var(--text-dim);}
.mini .lockwrap span{font-size:9.5px;color:var(--text-dim);letter-spacing:.03em;text-transform:uppercase;margin-top:5px;text-align:center;padding:0 6px;}
.mini .lockwrap .lc{display:flex;flex-direction:column;align-items:center;}

/* ---------- Twin stat row (Übung / Sim) ---------- */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.stat-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;}
.stat-box .sbtop{display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;}
.stat-box .sbtop svg{width:15px;height:15px;color:var(--accent-hi);}
.stat-box .sbnum{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-top:6px;}
.stat-box .sbnum small{font-size:14px;font-weight:600;color:var(--text-faint);}
.stat-box .sbsub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.sim-cta{margin-top:11px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:700;letter-spacing:.01em;
  border:1px solid transparent;cursor:pointer;transition:var(--spring),background .25s,border-color .25s,opacity .25s;
  will-change:transform;font-family:inherit;
}
.btn svg{width:16px;height:16px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:#fff;box-shadow:0 10px 24px -12px var(--accent-glow);}
.btn-primary:hover{transform:translateY(-1px);}
.btn-ghost{background:var(--surface-3);color:var(--text);border-color:var(--border-strong);}
.btn-ghost:hover{transform:translateY(-1px);border-color:var(--text-faint);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}

/* ============================================================
   FAHRSTIL-TRACKER  ·  Signature: kreisförmiger SVG-Ring
   ============================================================ */
.fahrstil-card{display:flex;gap:18px;align-items:center;}
.ring-wrap{flex:0 0 148px;width:148px;height:148px;position:relative;}
.ring-wrap svg{width:148px;height:148px;display:block;transform:rotate(-90deg);}
.ring-track{fill:none;stroke:var(--surface-3);stroke-width:12;}
.ring-progress{fill:none;stroke:url(#ringGrad);stroke-width:12;stroke-linecap:round;filter:url(#ringGlow);transition:stroke-dashoffset 1.5s var(--ease-out);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.ring-center .pct{font-size:34px;font-weight:800;letter-spacing:-0.04em;line-height:1;}
.ring-center .pct span{font-size:16px;color:var(--text-faint);font-weight:700;}
.ring-center .rlab{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint);margin-top:5px;}
.fahrstil-side{flex:1;min-width:0;}
.subscore{display:flex;align-items:center;gap:10px;padding:6px 0;}
.subscore .sic{width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 26px;}
.subscore .sic svg{width:14px;height:14px;color:var(--text-dim);}
.subscore .stext{flex:1;min-width:0;}
.subscore .stext .sname{font-size:12px;color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dots{display:flex;gap:4px;flex:0 0 auto;}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3);display:block;}
.dots i.on{background:var(--accent);box-shadow:0 0 7px -1px var(--accent-glow);}
.fahrstil-verdict{margin-top:14px;padding:11px 13px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid var(--accent-line);display:flex;align-items:center;gap:9px;}
.fahrstil-verdict svg{width:16px;height:16px;color:var(--accent-hi);flex:0 0 16px;}
.fahrstil-verdict span{font-size:12.5px;color:#FCC7D1;font-weight:600;}

/* ---------- Dokumente ---------- */
.doc-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.doc-row:last-child{border-bottom:none;}
.doc-row .dic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 34px;}
.doc-row .dic svg{width:17px;height:17px;color:var(--text-dim);}
.doc-row .dname{flex:1;font-size:13.5px;font-weight:600;}
.doc-row .dname small{display:block;font-size:11px;color:var(--text-faint);font-weight:500;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;cursor:default;border:none;font-family:inherit;}
.pill svg{width:13px;height:13px;}
.pill.ok{background:var(--emerald-soft);border:1px solid var(--emerald-line);color:var(--emerald-hi);}
.pill.wait{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text-dim);}
.pill.pending{background:var(--accent-soft);border:1px solid var(--accent-line);color:#FCA5B5;cursor:pointer;transition:var(--spring);}
.pill.pending:hover{transform:scale(1.05);}
.pill.pending:active{transform:scale(.95);}

/* ---------- Finanzen (nur Anzeige – Zahlung vor Ort) ---------- */
.finance-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;}
.finance-amount{font-size:32px;font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums;}
.finance-amount.due{color:var(--accent-hi);}
.finance-amount.clear{color:var(--emerald-hi);}
.finance-lab{font-size:11.5px;color:var(--text-faint);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px;}
.finance-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;}
.finance-badge.due{background:var(--accent-soft);border:1px solid var(--accent-line);color:#FCA5B5;}
.finance-badge.clear{background:var(--emerald-soft);border:1px solid var(--emerald-line);color:var(--emerald-hi);}
.finance-badge svg{width:13px;height:13px;}
.fin-list{margin:2px 0 14px;}
.fin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.fin-row:last-child{border-bottom:none;}
.fin-row .fr-l{font-size:13px;color:var(--text-dim);}
.fin-row .fr-a{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* ---------- Countdown ---------- */
.cd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cd-next{font-size:12.5px;color:var(--text-dim);}
.cd-next b{color:var(--text);}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
.cd-unit{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;}
.cd-unit .cdn{font-size:24px;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;}
.cd-unit .cdl{font-size:9.5px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:3px;}

/* ---------- Exam / Prüfungs-Ready ---------- */
.exam-done{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--radius-sm);background:var(--emerald-soft);border:1px solid var(--emerald-line);}
.exam-done .edic{width:36px;height:36px;border-radius:10px;background:rgba(16,185,129,.16);display:grid;place-items:center;flex:0 0 36px;}
.exam-done .edic svg{width:19px;height:19px;color:var(--emerald-hi);}
.exam-done .edtext{flex:1;}
.exam-done .edtext .t{font-size:13.5px;font-weight:700;color:var(--emerald-hi);}
.exam-done .edtext .s{font-size:11.5px;color:var(--text-dim);}

.ready-card{
  background:linear-gradient(180deg,var(--surface) 0%,#161A25 100%);
  border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);
}
.ready-head{display:flex;align-items:center;gap:11px;margin-bottom:16px;}
.ready-head .rhic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 38px;transition:background .4s,border-color .4s;}
.ready-head .rhic svg{width:20px;height:20px;color:var(--text-dim);transition:color .4s;}
.ready-head.active .rhic{background:var(--emerald-soft);border-color:var(--emerald-line);}
.ready-head.active .rhic svg{color:var(--emerald-hi);}
.ready-head .rht{font-size:14.5px;font-weight:700;}
.ready-head .rhs{font-size:11.5px;color:var(--text-faint);}
.cond{display:flex;align-items:center;gap:11px;padding:9px 0;}
.cond .cbox{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:0 0 22px;border:1px solid var(--border-strong);background:var(--surface-2);transition:var(--spring),background .35s,border-color .35s;}
.cond .cbox svg{width:13px;height:13px;color:var(--text-faint);transition:color .35s;}
.cond.met .cbox{background:var(--emerald-soft);border-color:var(--emerald-line);transform:scale(1);}
.cond.met .cbox svg{color:var(--emerald-hi);}
.cond .ctext{flex:1;font-size:12.5px;color:var(--text-dim);transition:color .35s;}
.cond.met .ctext{color:var(--text);}
.ready-btn{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:14px;font-size:14px;font-weight:800;letter-spacing:.02em;border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text-faint);cursor:not-allowed;transition:background .5s,color .5s,border-color .5s,box-shadow .5s;font-family:inherit;}
.ready-btn svg{width:18px;height:18px;}
.ready-btn.active{
  background:linear-gradient(180deg,var(--emerald-hi),var(--emerald));
  color:#04140D;border-color:transparent;cursor:pointer;
  box-shadow:0 0 0 rgba(16,185,129,0);
  animation:readyPulse 2.4s var(--ease-io) infinite;
}
@keyframes readyPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.42),0 12px 30px -14px rgba(16,185,129,.7);}
  50%{box-shadow:0 0 0 10px rgba(16,185,129,0),0 12px 30px -14px rgba(16,185,129,.7);}
}

/* ============================================================
   THEORIE-KALENDER  ·  Signature: fluide Morphing-Transition
   ============================================================ */
.theme-scroller{display:flex;gap:12px;overflow-x:auto;padding:3px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
.theme-scroller::-webkit-scrollbar{height:5px;}
.theme-scroller::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:999px;}
.theme-tile{
  flex:0 0 236px;scroll-snap-align:start;
  background:linear-gradient(180deg,var(--surface) 0%,#171B27 100%);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:relative;cursor:pointer;
  transition:var(--spring),border-color .35s,box-shadow .35s;will-change:transform;overflow:hidden;
}
.theme-tile:hover{transform:scale(1.03);border-color:var(--border-strong);box-shadow:var(--shadow);}
.theme-tile:active{transform:scale(.985);}
.tt-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.tt-num{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--accent-hi);}
.tt-num.z{font-size:12px;letter-spacing:.02em;}
.tt-badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
.tt-badge svg{width:11px;height:11px;}
.tt-badge.open{background:var(--surface-3);color:var(--text-dim);border:1px solid var(--border-strong);}
.tt-badge.booked{background:var(--accent-soft);color:#FCA5B5;border:1px solid var(--accent-line);}
.tt-badge.done{background:var(--emerald-soft);color:var(--emerald-hi);border:1px solid var(--emerald-line);}
.tt-badge.locked{background:rgba(97,107,128,.14);color:var(--text-faint);border:1px solid var(--border-strong);}
.tt-cat{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:5px;}
.tt-title{font-size:14.5px;font-weight:700;letter-spacing:-0.01em;line-height:1.25;margin-bottom:12px;min-height:36px;}
.tt-foot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);}
.tt-foot svg{width:14px;height:14px;color:var(--text-faint);}
.theme-tile.is-locked{opacity:.72;}
.theme-tile.is-done .tt-title{color:var(--text-dim);}

/* Morph-Layer (Vollbild) */
.morph-layer{position:fixed;z-index:120;pointer-events:none;visibility:hidden;inset:0;}
.morph-layer.open,.morph-layer.closing{visibility:visible;}
.morph-layer.open{pointer-events:auto;}
.morph-backdrop{position:fixed;inset:0;background:rgba(8,11,17,0);backdrop-filter:blur(0px);transition:background .45s var(--ease-out),backdrop-filter .45s var(--ease-out);}
.morph-layer.open .morph-backdrop{background:rgba(8,11,17,0.62);backdrop-filter:blur(6px);}
.morph-card{
  position:fixed;overflow:hidden;top:0;left:0;width:0;height:0;
  background:linear-gradient(180deg,var(--surface) 0%,#161A25 100%);
  border:1px solid var(--border-strong);box-shadow:var(--shadow);
  transition:top .5s var(--ease-out),left .5s var(--ease-out),width .5s var(--ease-out),height .5s var(--ease-out),border-radius .5s var(--ease-out);
  will-change:top,left,width,height,border-radius;
}
.morph-inner{padding:26px 22px calc(26px + env(safe-area-inset-bottom));opacity:0;transform:translateY(10px);transition:opacity .35s var(--ease-out) .12s,transform .4s var(--ease-out) .12s;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.morph-layer.open .morph-inner{opacity:1;transform:translateY(0);}
.morph-close{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);display:grid;place-items:center;cursor:pointer;z-index:2;transition:var(--spring);}
.morph-close:hover{transform:scale(1.06);color:var(--text);}
.morph-close:active{transform:scale(.94);}
.morph-close svg{width:18px;height:18px;}
.mo-num{width:56px;height:56px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--accent-hi);margin-bottom:16px;}
.mo-num.z{font-size:15px;}
.mo-num svg{width:26px;height:26px;}
.mo-cat{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:7px;}
.mo-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.12;margin-bottom:8px;}
.mo-when{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);padding:8px 12px;border-radius:10px;margin-bottom:18px;}
.mo-when svg{width:15px;height:15px;color:var(--accent-hi);}
.mo-desc{font-size:14px;color:var(--text-dim);line-height:1.6;margin-bottom:20px;}
.mo-cap{margin-bottom:20px;}
.mo-cap .cl{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:8px;}
.mo-cap .cl b{color:var(--text);}
.mo-note{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border-strong);margin-bottom:20px;}
.mo-note svg{width:16px;height:16px;color:var(--accent-hi);flex:0 0 16px;margin-top:1px;}
.mo-note span{font-size:12px;color:var(--text-dim);line-height:1.5;}

/* ---------- Karte ---------- */
#map{height:320px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-strong);box-shadow:var(--shadow-sm);}
.leaflet-container{background:var(--bg-deep);font-family:inherit;}
/* Darkmode via CSS-Filter über die Kacheln */
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.86) contrast(.92) saturate(.72);}
.leaflet-control-attribution{background:rgba(15,18,25,.72)!important;color:var(--text-faint)!important;font-size:9px!important;backdrop-filter:blur(4px);}
.leaflet-control-attribution a{color:var(--text-dim)!important;}
.leaflet-control-zoom a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important;}
.leaflet-control-zoom a:hover{background:var(--surface-2)!important;}
.leaflet-popup-content-wrapper{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border-strong)!important;border-radius:14px!important;box-shadow:var(--shadow)!important;}
.leaflet-popup-tip{background:var(--surface)!important;border:1px solid var(--border-strong)!important;}
.leaflet-popup-content{margin:13px 15px!important;font-family:inherit!important;}
.hot-pop .hp-cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-hi);font-weight:700;margin-bottom:4px;}
.hot-pop .hp-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px;}
.hot-pop .hp-desc{font-size:12px;color:var(--text-dim);line-height:1.45;}
/* Roter Hotspot-Marker */
.hot-marker{position:relative;width:26px;height:26px;}
.hot-marker .core{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6);z-index:2;}
.hot-marker .halo{position:absolute;inset:0;border-radius:50%;background:var(--accent-glow);animation:halo 2.1s ease-out infinite;}
@keyframes halo{0%{transform:scale(.5);opacity:.75;}100%{transform:scale(1.5);opacity:0;}}
.map-note{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:900;background:rgba(15,18,25,.85);border:1px solid var(--border-strong);color:var(--text-dim);font-size:11px;font-weight:600;padding:7px 13px;border-radius:999px;pointer-events:none;white-space:nowrap;backdrop-filter:blur(4px);}

.hot-list{margin-top:14px;display:flex;flex-direction:column;gap:10px;}
.hot-item{display:flex;gap:12px;align-items:flex-start;padding:13px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:var(--spring-soft),border-color .3s;}
.hot-item:hover{transform:scale(1.02);border-color:var(--border-strong);}
.hot-item:active{transform:scale(.99);}
.hot-item .hnum{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent-line);display:grid;place-items:center;flex:0 0 30px;}
.hot-item .hnum svg{width:15px;height:15px;color:var(--accent-hi);}
.hot-item .htext .ht{font-size:13px;font-weight:700;margin-bottom:2px;}
.hot-item .htext .hd{font-size:11.5px;color:var(--text-faint);line-height:1.45;}

/* ---------- Ausbildungsbaum (vertikale Timeline) ---------- */
.tree{position:relative;padding-left:8px;}
.tree-node{position:relative;padding:0 0 22px 40px;}
.tree-node:last-child{padding-bottom:0;}
.tree-node::before{
  content:"";position:absolute;left:13px;top:26px;bottom:-4px;width:2px;
  background:linear-gradient(180deg,var(--border-strong),var(--border));
}
.tree-node:last-child::before{display:none;}
.tree-dot{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--border-strong);z-index:1;transition:background .4s,border-color .4s,box-shadow .4s;}
.tree-dot svg{width:15px;height:15px;color:var(--text-faint);transition:color .4s;}
.tree-node.done .tree-dot{background:var(--accent-soft);border-color:var(--accent-line);box-shadow:0 0 16px -3px var(--accent-glow);}
.tree-node.done .tree-dot svg{color:var(--accent-hi);}
.tree-node.goal.ready .tree-dot{background:var(--emerald-soft);border-color:var(--emerald-line);box-shadow:0 0 16px -3px rgba(16,185,129,.5);}
.tree-node.goal.ready .tree-dot svg{color:var(--emerald-hi);}
.tn-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
.tn-title{font-size:13.5px;font-weight:700;}
.tn-title small{display:block;font-size:11px;color:var(--text-faint);font-weight:500;letter-spacing:.01em;}
.tn-count{font-size:12.5px;font-weight:700;color:var(--text-dim);white-space:nowrap;}
.tn-count b{color:var(--accent-hi);}
.tn-count.done b{color:var(--emerald-hi);}
.tn-track{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;}
.tn-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-hi));transition:width 1.2s var(--ease-out);}
.tn-fill.complete{background:linear-gradient(90deg,var(--accent),var(--accent-hi));box-shadow:0 0 12px -2px var(--accent-glow);}
.tree-node.goal .tn-goal{font-size:12px;color:var(--text-faint);}
.tree-node.goal.ready .tn-goal{color:var(--emerald-hi);}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;z-index:200;pointer-events:none;padding:0 16px;}
.toast{
  pointer-events:auto;max-width:440px;width:100%;
  display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border-strong);box-shadow:var(--shadow);
  transform:translateY(20px) scale(.96);opacity:0;transition:transform .42s var(--ease-out),opacity .42s var(--ease-out);
}
.toast.show{transform:translateY(0) scale(1);opacity:1;}
.toast .tic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;}
.toast .tic svg{width:16px;height:16px;}
.toast.ok .tic{background:var(--emerald-soft);}.toast.ok .tic svg{color:var(--emerald-hi);}
.toast.info .tic{background:var(--accent-soft);}.toast.info .tic svg{color:var(--accent-hi);}
.toast.block .tic{background:rgba(97,107,128,.18);}.toast.block .tic svg{color:var(--text-dim);}
.toast .tmsg{font-size:13px;font-weight:600;line-height:1.35;}
.toast .tmsg small{display:block;font-size:11.5px;color:var(--text-faint);font-weight:500;}

/* ---------- Footer ---------- */
.foot{margin-top:34px;text-align:center;}
.foot .fbrand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint);font-weight:700;}
.foot .fnote{font-size:11px;color:var(--text-faint);margin-top:6px;opacity:.75;}
.foot .freset{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);background:none;border:none;cursor:pointer;letter-spacing:.02em;transition:color .25s;padding:6px 10px;border-radius:8px;font-family:inherit;}
.foot .freset:hover{color:var(--accent-hi);}
.foot .freset svg{width:13px;height:13px;}

/* ============================================================
   ANMELDUNG  ·  Schritt 1
   ============================================================ */
.auth-screen{
  min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:20px;
  max-width:440px;margin:0 auto;
  padding:36px 20px calc(36px + env(safe-area-inset-bottom));
  padding-top:calc(36px + env(safe-area-inset-top));
  perspective:1400px;
}
.auth-hero{display:flex;align-items:center;gap:14px;}
.logo-xl{width:56px;height:56px;flex:0 0 56px;border-radius:16px;}
.auth-brandname{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
.auth-brandsub{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;}
.auth-card{padding:22px;}
.auth-title{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em;}
.auth-sub{margin:0 0 18px;font-size:13px;color:var(--text-dim);line-height:1.55;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap .fic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none;display:grid;place-items:center;}
.input-wrap .fic svg{width:16px;height:16px;}
input.txt{
  width:100%;padding:13px 46px 13px 41px;border-radius:12px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--text);font-family:inherit;font-size:15px;letter-spacing:-.01em;
  outline:none;transition:border-color .25s,box-shadow .25s,background .25s;
}
input.txt::placeholder{color:var(--text-faint);}
input.txt:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface-3);}
.eye-btn{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:9px;border:none;background:none;color:var(--text-faint);display:grid;place-items:center;cursor:pointer;transition:color .25s;}
.eye-btn:hover{color:var(--text);}
.eye-btn svg{width:17px;height:17px;}
.check-row{display:flex;align-items:center;gap:10px;margin:2px 0 16px;cursor:pointer;user-select:none;font-size:13px;color:var(--text-dim);position:relative;}
.check-row input{position:absolute;opacity:0;width:1px;height:1px;}
.check-row .cbx{width:20px;height:20px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface-2);display:grid;place-items:center;flex:0 0 20px;transition:background .25s,border-color .25s;}
.check-row .cbx svg{width:12px;height:12px;color:transparent;transition:color .2s;}
.check-row input:checked ~ .cbx{background:var(--accent-soft);border-color:var(--accent);}
.check-row input:checked ~ .cbx svg{color:var(--accent-hi);}
.check-row input:focus-visible ~ .cbx{outline:2px solid var(--accent-hi);outline-offset:2px;}
.form-error{display:flex;align-items:flex-start;gap:9px;padding:11px 13px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--accent-line);margin-bottom:14px;font-size:12.5px;font-weight:600;color:#FCA5B5;line-height:1.45;}
.form-error svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px;}
.form-error[hidden]{display:none;}
.shake{animation:shake .45s var(--ease-io);}
@keyframes shake{20%{transform:translateX(-5px);}40%{transform:translateX(4px);}60%{transform:translateX(-3px);}80%{transform:translateX(2px);}}
.auth-user{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:16px;}
.auth-user .au-name{font-size:14px;font-weight:700;}
.auth-user .au-mail{font-size:11.5px;color:var(--text-faint);}
.auth-links{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.link-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-faint);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:8px 10px;border-radius:8px;transition:color .25s;}
.link-btn:hover{color:var(--accent-hi);}
.link-btn svg{width:13px;height:13px;}
.auth-foot{text-align:center;font-size:11px;color:var(--text-faint);line-height:1.7;}
.auth-foot b{color:var(--text-dim);font-weight:600;}

/* ============================================================
   KLASSENWAHL  ·  Schritt 2
   ============================================================ */
.klasse-screen{
  max-width:480px;margin:0 auto;min-height:100vh;min-height:100svh;min-height:100dvh;display:flex;flex-direction:column;
  padding:24px 18px calc(40px + env(safe-area-inset-bottom));
  padding-top:calc(22px + env(safe-area-inset-top));
  perspective:1400px;
}
.klasse-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px;}
.klasse-head .icon-btn{flex:0 0 42px;margin-top:3px;}
.klasse-title{margin:3px 0 0;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;}
.klasse-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px;}
.class-tile{
  position:relative;overflow:hidden;text-align:left;padding:15px 14px 13px;border-radius:var(--radius);
  border:1px solid var(--border);background:linear-gradient(180deg,var(--surface) 0%,#171B27 100%);
  color:var(--text);font-family:inherit;cursor:pointer;
  transition:var(--spring-soft),border-color .3s,box-shadow .3s;
}
.class-tile:hover{transform:scale(1.03);border-color:var(--border-strong);}
.class-tile:active{transform:scale(.97);}
.class-tile .ct-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;margin-bottom:11px;transition:background .3s,border-color .3s;}
.class-tile .ct-ic svg{width:21px;height:21px;color:var(--text-dim);transition:color .3s;}
.class-tile .ct-code{font-size:18px;font-weight:800;letter-spacing:-.02em;}
.class-tile .ct-name{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:1px;}
.class-tile .ct-age{font-size:10px;color:var(--text-faint);margin-top:7px;letter-spacing:.03em;text-transform:uppercase;font-weight:700;}
.class-tile .ct-check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;transition:background .25s,border-color .25s;}
.class-tile .ct-check svg{width:12px;height:12px;color:transparent;transition:color .2s;}
.class-tile.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 16px 30px -16px var(--accent-glow),var(--shadow-sm);transform:translateZ(0) scale(1.035);}
.class-tile.selected .ct-ic{background:var(--accent-soft);border-color:var(--accent-line);}
.class-tile.selected .ct-ic svg{color:var(--accent-hi);}
.class-tile.selected .ct-check{background:var(--accent);border-color:var(--accent);}
.class-tile.selected .ct-check svg{color:#fff;}
.class-tile .ct-pop{position:absolute;top:14px;right:42px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--emerald-hi);background:var(--emerald-soft);border:1px solid var(--emerald-line);padding:3px 7px;border-radius:999px;}
.klasse-info{margin-bottom:16px;}
.ki-desc{font-size:13px;color:var(--text-dim);line-height:1.55;margin:0 0 12px;}
.ki-chips{display:flex;flex-wrap:wrap;gap:8px;}
.klasse-cta{margin-top:auto;padding:15px;font-size:14px;border-radius:14px;}

/* Ausbildungsart: Ersterwerb / Erweiterung */
.besitz-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.besitz-tile{
  position:relative;overflow:hidden;text-align:left;padding:13px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
  font-family:inherit;cursor:pointer;transition:var(--spring-soft),border-color .25s,background .25s,opacity .25s;
  display:flex;align-items:flex-start;gap:11px;
}
.besitz-tile:hover{transform:scale(1.02);border-color:var(--text-faint);}
.besitz-tile:active{transform:scale(.98);}
.besitz-tile .bic{width:32px;height:32px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 32px;transition:background .25s,border-color .25s;}
.besitz-tile .bic svg{width:16px;height:16px;color:var(--text-dim);transition:color .25s;}
.besitz-tile .bt-t{font-size:13px;font-weight:800;letter-spacing:-.01em;}
.besitz-tile .bt-s{font-size:10.5px;color:var(--text-faint);margin-top:2px;line-height:1.4;}
.besitz-tile.selected{background:var(--accent-soft);border-color:var(--accent);}
.besitz-tile.selected .bic{background:rgba(225,29,72,.16);border-color:var(--accent-line);}
.besitz-tile.selected .bic svg{color:var(--accent-hi);}
.besitz-tile.disabled{opacity:.4;cursor:not-allowed;}
.besitz-tile.disabled:hover{transform:none;border-color:var(--border-strong);}
.besitz-note{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--text-faint);line-height:1.5;margin-top:10px;}
.besitz-note svg{width:13px;height:13px;flex:0 0 13px;margin-top:2px;color:var(--accent-hi);}
.besitz-block{margin-bottom:16px;}
.besitz-block .eyebrow{margin:0 2px 10px;display:block;}

/* Theorie-Filter-Chips */
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.fchip{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  font-size:12px;font-weight:700;font-family:inherit;letter-spacing:.01em;
  background:var(--surface);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;
  transition:var(--spring-soft),background .25s,border-color .25s,color .25s;
}
.fchip b{color:var(--text-faint);font-weight:800;}
.fchip:hover{transform:scale(1.04);border-color:var(--border-strong);}
.fchip:active{transform:scale(.96);}
.fchip.active{background:var(--accent-soft);border-color:var(--accent-line);color:#FCA5B5;}
.fchip.active b{color:var(--accent-hi);}
.theory-empty{flex:0 0 100%;padding:24px 12px;text-align:center;font-size:12.5px;color:var(--text-faint);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--radius);}

/* „Thema wählen"-Knopf im Sektionskopf */
.head-btn{
  display:inline-flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.01em;color:var(--accent-hi);
  padding:6px 8px;border-radius:8px;transition:transform .25s var(--ease-out),color .25s;white-space:nowrap;
}
.head-btn svg{width:13px;height:13px;transition:transform .25s var(--ease-out);}
.head-btn:hover{color:#FCA5B5;}
.head-btn:hover svg{transform:translateX(2px);}
.head-btn:active{transform:scale(.96);}

/* Themenliste im Sheet */
.tl-group{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin:18px 2px 10px;}
.tl-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:9px;
  padding:12px 13px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);
  font-family:inherit;color:var(--text);position:relative;overflow:hidden;
}
button.tl-row{cursor:pointer;transition:var(--spring-soft),border-color .25s,background .25s;}
button.tl-row:hover{transform:scale(1.015);border-color:var(--accent-line);}
button.tl-row:active{transform:scale(.99);}
.tl-row .tln{width:34px;height:34px;border-radius:10px;background:var(--surface-3);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--accent-hi);flex:0 0 34px;}
.tl-row.done .tln{color:var(--text-faint);}
.tl-row .tlm{flex:1;min-width:0;}
.tl-row .tlt{display:block;font-size:13px;font-weight:700;line-height:1.3;}
.tl-row.done .tlt{color:var(--text-dim);}
.tl-row .tls{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-faint);margin-top:3px;flex-wrap:wrap;}
.tl-row .tls svg{width:11px;height:11px;flex:0 0 11px;}
.tl-row .tt-badge{flex:0 0 auto;}

/* ============================================================
   HISTORIE  ·  Fahrstunden & Theorie
   ============================================================ */
.seg{display:flex;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:4px;margin-bottom:14px;}
.seg-btn{
  position:relative;overflow:hidden;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 8px;border:none;border-radius:10px;background:none;color:var(--text-dim);
  font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:background .25s,color .25s;
}
.seg-btn svg{width:15px;height:15px;}
.seg-btn.active{background:var(--surface-3);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong);}
.h-sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
.h-rows{display:block;}
.h-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.h-rows .h-row:last-child{border-bottom:none;}
.h-ic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;flex:0 0 36px;}
.h-ic svg{width:17px;height:17px;color:var(--text-dim);}
.h-ic.sonder{background:var(--accent-soft);border-color:var(--accent-line);}
.h-ic.sonder svg{color:var(--accent-hi);}
.h-ic.num{font-size:12.5px;font-weight:800;color:var(--accent-hi);}
.h-main{flex:1;min-width:0;}
.h-title{font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
.h-sub{font-size:12px;color:var(--text-dim);margin-top:1px;line-height:1.45;}
.h-meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);margin-top:4px;flex-wrap:wrap;}
.h-meta svg{width:12px;height:12px;flex:0 0 12px;}
.h-dur{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--text-dim);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 9px;white-space:nowrap;margin-top:2px;}
.h-toggle{margin-top:12px;}
.h-toggle svg{transition:transform .35s var(--ease-out);}
.h-toggle.open svg{transform:rotate(180deg);}
.h-empty{padding:20px 8px;text-align:center;font-size:12.5px;color:var(--text-faint);line-height:1.6;}

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.08s!important;}
  .hot-marker .halo{display:none;}
  .reveal{opacity:1;transform:none;}
  .tilt3d{transform:none!important;}
  .tilt-sheen,.hero-badge .hb-sheen,[data-fill].shimmer::after{display:none;}
  #fxCanvas{display:none;}
}
/* ---------- Focus states (Accessibility) ---------- */
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:8px;}

/* ============================================================
   Interaktionen, Sheets, Verfügbarkeit, Konfetti
   ============================================================ */
button.avatar{padding:0;font-family:inherit;cursor:pointer;}
button.pill{font-family:inherit;}

/* Ripple */
.btn,.slot-chip,.avail-cell,.exam-opt,.icon-btn,.hot-item,.ready-btn,.pill.pending,.class-tile,.seg-btn{position:relative;overflow:hidden;}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:rgba(248,250,252,.32);pointer-events:none;animation:ripple .6s var(--ease-out) forwards;}
@keyframes ripple{to{transform:scale(2.6);opacity:0;}}

/* Erfolgs-Puls: dezenter, expandierender Ring statt Konfetti */
.pulse-ring{
  position:fixed;z-index:290;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
  border:2px solid var(--accent-hi);box-shadow:0 0 26px -4px var(--accent-glow);
  pointer-events:none;animation:pulseRing .85s var(--ease-out) forwards;
}
.pulse-ring.second{animation-delay:.16s;opacity:0;}
.pulse-ring.emerald{border-color:var(--emerald-hi);box-shadow:0 0 26px -4px rgba(16,185,129,.5);}
@keyframes pulseRing{0%{transform:scale(.5);opacity:.9;}100%{transform:scale(6.5);opacity:0;}}

/* Glanz-Sweep über gefüllte Fortschrittsbalken (einmalig nach Reveal) */
[data-fill]{position:relative;overflow:hidden;}
[data-fill].shimmer::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);
  transform:translateX(-130%);animation:sweep 1.3s var(--ease-io) .9s 1 both;
}
@keyframes sweep{to{transform:translateX(130%);}}

/* Zeilen-Stagger (Historie, Listen) */
.row-in{opacity:0;animation:rowIn .5s var(--ease-out) forwards;}
@keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Sheet-Inhalte gestaffelt einblenden */
.morph-layer.open .morph-inner>*{animation:moIn .5s var(--ease-out) both;}
.morph-layer.open .morph-inner>*:nth-child(2){animation-delay:.05s;}
.morph-layer.open .morph-inner>*:nth-child(3){animation-delay:.1s;}
.morph-layer.open .morph-inner>*:nth-child(4){animation-delay:.15s;}
.morph-layer.open .morph-inner>*:nth-child(5){animation-delay:.2s;}
.morph-layer.open .morph-inner>*:nth-child(6){animation-delay:.25s;}
.morph-layer.open .morph-inner>*:nth-child(n+7){animation-delay:.3s;}
@keyframes moIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* Primär-Button: feiner Licht-Sweep beim Hover */
.btn-primary::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.16) 50%,transparent 60%);
  transform:translateX(-130%);transition:transform .7s var(--ease-io);
}
.btn-primary:hover::before{transform:translateX(130%);}

/* Animierter Haken + Spinner */
.cdraw{width:13px;height:13px;display:block;}
.cdraw path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;animation:cdraw .5s var(--ease-out) forwards;}
@keyframes cdraw{to{stroke-dashoffset:0;}}
.pill.wait svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Pop bei Zahl-Update */
.pop{animation:pop .5s var(--ease-out);}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}

/* Dokument-Thumbnail + Scan-Linie */
.doc-thumb{width:34px;height:34px;border-radius:10px;flex:0 0 34px;object-fit:cover;border:1px solid var(--border-strong);display:block;}
.doc-scan{position:relative;width:34px;height:34px;border-radius:10px;flex:0 0 34px;overflow:hidden;border:1px solid var(--accent-line);background:var(--surface-2);}
.doc-scan img{width:100%;height:100%;object-fit:cover;filter:grayscale(.2) brightness(.9);}
.doc-scan::after{content:"";position:absolute;left:0;right:0;height:45%;top:-45%;background:linear-gradient(180deg,transparent,rgba(225,29,72,.6),transparent);animation:scanline 1.1s var(--ease-io) infinite;}
@keyframes scanline{0%{top:-45%;}100%{top:100%;}}

/* Sheet-Kopf (generisch im Morph) */
.sheet-eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);font-weight:700;margin-bottom:7px;}
.sheet-title{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.12;margin-bottom:8px;}
.sheet-sub{font-size:13.5px;color:var(--text-dim);line-height:1.55;margin-bottom:20px;}

/* Simulator-Slots */
.slot-day{margin-bottom:16px;}
.slot-day .sd-lab{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--text);margin-bottom:9px;}
.slot-day .sd-lab svg{width:15px;height:15px;color:var(--accent-hi);}
.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.slot-chip{padding:13px 6px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface-2);text-align:center;cursor:pointer;transition:var(--spring),border-color .25s,background .25s,color .25s;}
.slot-chip .st{font-size:14px;font-weight:800;}
.slot-chip .ss{display:block;font-size:10px;color:var(--text-faint);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:.04em;}
.slot-chip:hover{transform:scale(1.04);border-color:var(--text-faint);}
.slot-chip:active{transform:scale(.96);}
.slot-chip.reserved{opacity:.45;cursor:not-allowed;background:var(--surface);}
.slot-chip.reserved .ss{color:var(--accent-hi);}
.slot-chip.selected{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-hi);box-shadow:0 0 0 3px var(--accent-soft);}

/* Prüfungstermine (Optionsliste) */
.exam-opt{display:flex;align-items:center;gap:13px;padding:14px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-2);cursor:pointer;margin-bottom:11px;transition:var(--spring),border-color .25s,background .25s;}
.exam-opt:hover{transform:scale(1.02);border-color:var(--text-faint);}
.exam-opt:active{transform:scale(.99);}
.exam-opt.selected{background:var(--accent-soft);border-color:var(--accent);}
.exam-opt .eo-cal{width:44px;height:48px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 44px;}
.exam-opt.selected .eo-cal{background:rgba(225,29,72,.16);border-color:var(--accent-line);}
.exam-opt .eo-cal .d{font-size:18px;font-weight:800;line-height:1;}
.exam-opt .eo-cal .m{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-faint);margin-top:2px;}
.exam-opt .eo-body{flex:1;min-width:0;}
.exam-opt .eo-body .t{font-size:14px;font-weight:700;}
.exam-opt .eo-body .s{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
.exam-opt .eo-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);flex:0 0 22px;display:grid;place-items:center;transition:border-color .25s;}
.exam-opt.selected .eo-radio{border-color:var(--accent);}
.exam-opt.selected .eo-radio::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--accent);}

/* Verfügbarkeits-Matrix */
.avail-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin:0 -2px;}
.avail-grid{display:grid;grid-template-columns:auto repeat(6,minmax(38px,1fr));gap:7px;min-width:330px;}
.avail-day{font-size:11px;font-weight:800;text-align:center;color:var(--text-dim);padding:2px 0;}
.avail-plab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-dim);white-space:nowrap;padding-right:4px;}
.avail-plab svg{width:14px;height:14px;color:var(--text-faint);}
.avail-cell{height:34px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface-2);cursor:pointer;transition:var(--spring),background .2s,border-color .2s;display:grid;place-items:center;}
.avail-cell svg{width:14px;height:14px;color:transparent;transition:color .2s;}
.avail-cell:hover{border-color:var(--text-faint);}
.avail-cell:active{transform:scale(.92);}
.avail-cell.plan{box-shadow:inset 0 0 0 1.5px var(--emerald-line);}
.avail-cell.on{background:var(--accent-soft);border-color:var(--accent);}
.avail-cell.on svg{color:var(--accent-hi);}
.avail-legend{display:flex;gap:16px;margin-top:13px;flex-wrap:wrap;}
.avail-legend .lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text-faint);}
.avail-legend .lg .sw{width:14px;height:14px;border-radius:5px;}
.avail-legend .lg .sw.you{background:var(--accent-soft);border:1px solid var(--accent);}
.avail-legend .lg .sw.fl{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--emerald-line);}
.match-btn{margin-top:14px;}
</style>
</head>
<body>

<canvas id="fxCanvas" aria-hidden="true"></canvas>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<div id="app"></div>

<!-- Morph-Layer (Detail-Sheets) -->
<div class="morph-layer" id="morphLayer" aria-hidden="true">
  <div class="morph-backdrop" data-action="close-morph"></div>
  <div class="morph-card" id="morphCard" role="dialog" aria-modal="true">
    <button class="morph-close" data-action="close-morph" aria-label="Schließen"></button>
    <div class="morph-inner" id="morphInner"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>
<input type="file" id="docInput" accept="image/*" capture="environment" style="display:none" aria-hidden="true" />

<!-- Inline-SVG-Defs (Ring-Gradient/Glow) – einmal im Dokument -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="ringGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="#E11D48" flood-opacity="0.55"/>
    </filter>
  </defs>
</svg>

<script>
/* @preserve
 * Leaflet 1.9.4, a JS library for interactive maps. https://leafletjs.com

/* ---------- 1 · Storage (localStorage mit Fallback) ---------- */
const PROFILE_KEY='fk_profile_v2';
const STATE_KEY='fk_state_v3';
const SESSION_KEY='fk_session_v2';
/* Altlasten früherer Versionen entfernen – neue Version startet immer
   mit Anmeldung → Klassenwahl, bis ein aktuelles Konto angelegt ist. */
const LEGACY_KEYS=['fk_profile_v1','fk_session_v1','fk_state_v2','fk_cockpit_state'];
const Store=(()=>{
  let ok=false; try{ const k='__fk_t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok=true; }catch(e){ ok=false; }
  const mem={};
  return {
    ok,
    get(key){ try{ return ok?localStorage.getItem(key):(key in mem?mem[key]:null); }catch(e){ return key in mem?mem[key]:null; } },
    set(key,v){ try{ if(ok){ localStorage.setItem(key,v); return; } }catch(e){} mem[key]=v; },
    del(key){ try{ if(ok) localStorage.removeItem(key); }catch(e){} delete mem[key]; }
  };
})();
const Session={
  get(){ try{ return sessionStorage.getItem(SESSION_KEY); }catch(e){ return Store.get('__fk_sess'); } },
  set(v){ try{ sessionStorage.setItem(SESSION_KEY,v); return; }catch(e){} Store.set('__fk_sess',v); },
  del(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} Store.del('__fk_sess'); }
};

/* ---------- 2 · Datum- & Format-Helfer ---------- */
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','März','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON_FULL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad=n=>String(n).padStart(2,'0');
const fmtDay=d=>`${WD[d.getDay()]}, ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`;
const fmtDayTime=d=>`${fmtDay(d)} · ${pad(d.getHours())}:${pad(d.getMinutes())} Uhr`;
const fmtTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function fmtEuro(n){ try{ return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'}); }catch(e){ return n.toFixed(2).replace('.',',')+' €'; } }
function fmtStunden(min){ const h=min/60; try{ return h.toLocaleString('de-DE',{maximumFractionDigits:1}); }catch(e){ return String(Math.round(h*10)/10).replace('.',','); } }
function prevMonthName(){ const d=new Date(); return MON_FULL[(d.getMonth()+11)%12]; }
function upcomingDays(n){ const out=[]; let d=new Date(); d.setHours(0,0,0,0); while(out.length<n){ d=new Date(d.getTime()+86400000); if(d.getDay()===0) continue; out.push({label:fmtDay(d),dow:d.getDay()}); } return out; }
function nextDateForDow(dow,hour){ const now=new Date(); let add=(dow-now.getDay()+7)%7; const d=new Date(now); d.setHours(hour,0,0,0); if(add===0 && d<=now) add=7; d.setDate(now.getDate()+add); d.setHours(hour,0,0,0); return d; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function firstName(n){ return (n||'').trim().split(/\s+/)[0]||''; }
function initialsOf(name){ const parts=(name||'').trim().split(/\s+/).filter(Boolean); if(!parts.length) return '–'; const a=parts[0][0]||''; const b=parts.length>1?(parts[parts.length-1][0]||''):(parts[0][1]||''); return (a+b).toUpperCase(); }

/* Vollständiger Themenkatalog der Klasse: Grundstoff (12 bzw. 6 bei Erweiterung) + Zusatzstoff */
function buildCatalog(code,besitz){
  const cfg=CLASS_CONFIG[code]||CLASS_CONFIG.B;
  const grund=GRUND_TOPICS.slice(0,grundCountFor(code,besitz)).map(t=>({num:String(t[0]),cat:'Grundstoff',title:t[1]}));
  const zusatz=(ZUSATZ_TOPICS[cfg.zusatzKat]||[]).slice(0,cfg.zusatz).map(t=>({num:t[0],cat:cfg.zusatzKat,title:t[1]}));
  return grund.concat(zusatz).map(t=>Object.assign({desc:TOPIC_DESCS[t.num]||''},t));
}
/* Theorie-Sessions: der komplette Katalog der eigenen Klasse ist buchbar.
   Besuchte Themen tragen ihr vergangenes Datum, fehlende den nächsten Termin. */
function buildThemeSessions(code,besitz){
  const catalog=buildCatalog(code,besitz);
  const n=catalog.length; if(!n) return [];
  const grundCount=grundCountFor(code,besitz);
  const missing=new Set();
  if(n>grundCount) missing.add(n-1);                 /* letztes Zusatzthema fehlt noch */
  if(grundCount>=12){ missing.add(7); missing.add(10); } /* Thema 8 & 11 fehlen noch */
  else if(grundCount>=6){ missing.add(4); }          /* Thema 5 fehlt noch */
  const attendedIdx=catalog.map((_,i)=>i).filter(i=>!missing.has(i));
  const an=attendedIdx.length;
  const sessions=[]; let futureSeq=0;
  catalog.forEach((tp,i)=>{
    let d,status;
    if(missing.has(i)){
      d=new Date(); d.setHours(futureSeq%2?19:18,0,0,0); d.setDate(d.getDate()+2+futureSeq*3);
      if(d.getDay()===0) d.setDate(d.getDate()+1);
      status='offen'; futureSeq++;
    } else {
      const k=attendedIdx.indexOf(i);
      d=new Date(); d.setHours(19,0,0,0); d.setDate(d.getDate()-(16+Math.round((an-1-k)*3.5)));
      status='erledigt';
    }
    sessions.push({id:'th-'+tp.num,num:tp.num,cat:tp.cat,title:tp.title,desc:tp.desc,status,dateISO:d.toISOString(),day:fmtDay(d),time:pad(d.getHours())+':00 Uhr',kap:{belegt:6+((i*7)%15),gesamt:24}});
  });
  return sessions;
}
function buildHistory(cfg,seed,sessions){
  const fahr=[],theorie=[];
  const mk=(daysAgo,h,m)=>{ const d=new Date(); d.setDate(d.getDate()-daysAgo); d.setHours(h,m||0,0,0); return d.toISOString(); };
  /* Simulator-Einheiten (je 90 min) */
  const simFocus=['Grundlagen & Bedienelemente','Stadtfahrt & Gefahrenlagen','Autobahn & Überholen','Nachtfahrt & Blendung'];
  [64,61,57,54].slice(0,seed.sim).forEach((off,i)=>fahr.push({type:'simulator',date:mk(off,17,0),minutes:90,focus:simFocus[i%simFocus.length]}));
  /* Übungsfahrten: 2 Fahrstunden à 45 min pro Termin */
  const focusList=FOCUS_BY_VEHIKEL[cfg.vehikel]||FOCUS_BY_VEHIKEL.pkw;
  const offs=[46,43,39,36,32,29,25,22,18,11,4];
  const termine=Math.round(seed.uebungen/2);
  for(let i=0;i<termine;i++){
    const off=(i<offs.length)?offs[i]:Math.max(2,46-i*4);
    const hm=(i%2)?[16,30]:[15,0];
    fahr.push({type:'uebung',date:mk(off,hm[0],hm[1]),minutes:90,focus:focusList[i%focusList.length]});
  }
  /* Absolvierte Sonderfahrten */
  if(seed.sonderIst.ueberland>0) fahr.push({type:'ueberland',date:mk(9,14,0),minutes:seed.sonderIst.ueberland*45,focus:'Landstraßen & Ortsdurchfahrten in der Rhön'});
  if(seed.sonderIst.autobahn>0) fahr.push({type:'autobahn',date:mk(6,10,0),minutes:seed.sonderIst.autobahn*45,focus:'A7 / A66 – Auffahren, Überholen, Abstand halten'});
  if(seed.sonderIst.nacht>0) fahr.push({type:'nacht',date:mk(3,20,0),minutes:seed.sonderIst.nacht*45,focus:'Beleuchtung, Blendung & Orientierung bei Dunkelheit'});
  fahr.sort((a,b)=>new Date(b.date)-new Date(a.date));
  /* Theorie-Doppelstunden (je 90 min) – exakt die besuchten Themen aus dem Katalog */
  (sessions||[]).filter(s=>s.status==='erledigt').forEach(s=>{
    theorie.push({num:s.num,cat:s.cat,title:s.title,date:s.dateISO,minutes:90});
  });
  theorie.sort((a,b)=>new Date(b.date)-new Date(a.date));
  return {fahr,theorie};
}

  return {

    ]},

    fahrlehrerGo:true,

  };
}

function randomSalt(){
  try{ const a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let s=''; for(let i=0;i<32;i++) s+='0123456789abcdef'[Math.floor(Math.random()*16)]; return s; }
}
function fallbackHash(str){ /* cyrb53-Doppelhash als Fallback ohne WebCrypto */
  let h1=0xdeadbeef^str.length, h2=0x41c6ce57^str.length;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0');
}
function hashAlgoAvailable(){ return (typeof crypto!=='undefined'&&crypto.subtle&&crypto.subtle.digest)?'sha256':'x53'; }
async function hashPassword(pw,salt,algo){
  const input=salt+'::'+pw;
  if(algo==='sha256'){
    if(!(typeof crypto!=='undefined'&&crypto.subtle&&crypto.subtle.digest)) throw new Error('sha-unsupported');
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  return fallbackHash(input);
}

/* ---------- 9 · Hash-Router (Zurück-Taste des Browsers funktioniert) ---------- */
let currentScreen=null;
function targetFromHash(){ return (location.hash||'').replace(/^#/,'').split('/')[0]; }
function defaultTarget(){ const p=getProfile(); return authed?(p&&p.klasse?'cockpit':'klasse'):'login'; }
function resolveTarget(t){
  const p=getProfile();
  if(t==='cockpit') return (authed&&p&&p.klasse)?'cockpit':(authed&&p?'klasse':'login');
  if(t==='klasse')  return (authed||pendingProfile)?'klasse':'login';
  if(t==='login')   return (authed&&p&&p.klasse)?'cockpit':'login';
  return defaultTarget();
}
function nav(t){
  if(targetFromHash()===t){ route(); return; }
  try{ location.hash=t; }catch(e){ renderScreen(resolveTarget(t),true); }
}
function navReplace(t){
  if(targetFromHash()===t){ route(); return; }
  try{ location.replace('#'+t); }catch(e){ try{ location.hash=t; }catch(e2){ renderScreen(resolveTarget(t),true); } }
}
function route(){
  const want=targetFromHash();
  if(!want){ navReplace(defaultTarget()); return; }
  const t=resolveTarget(want);
  if(t!==want){ navReplace(t); return; }
  renderScreen(t,false);
}
window.addEventListener('hashchange',route);
function teardownScreen(){
  clearInterval(cdInterval); cdInterval=null;
  if(mapInstance){ try{ mapInstance.remove(); }catch(e){} mapInstance=null; }
  closeMorphInstant();
  Reveal.reset();
  Tilt.reset();
}
function renderScreen(t,force){
  const app=el('app');
  if(!force&&currentScreen===t&&app.childElementCount>0) return;
  teardownScreen();
  currentScreen=t;
  if(t==='login') renderLoginScreen();
  else if(t==='klasse') renderClassScreen();
  else renderCockpitScreen();
  window.scrollTo(0,0);
  updateScrollProgress();
}
