function haptic(t){ if(!('vibrate' in navigator)) return; if(t==='confirm') navigator.vibrate([12,45,12]); else if(t==='block') navigator.vibrate(32); }
const reducedMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
/* Ruhiger Modus: schaltet Partikel-Hintergrund & 3D-Tilt ab (Flacker-Kill-Switch,
   pro Gerät). Standard: automatisch an auf sehr schwachen Geräten. */
function autoCalm(){ try{ if(navigator.deviceMemory&&navigator.deviceMemory<=2) return true; }catch(e){} return false; }
function calmMode(){ const p=getProfile(); if(p&&typeof p.calm==='boolean') return p.calm; return autoCalm(); }

let toastTimer=null;
function toast(kind,msg,sub){
  const wrap=el('toastWrap'); if(!wrap) return; wrap.innerHTML='';
  const icName=kind==='ok'?'circle-check':(kind==='block'?'lock':'info');
  const t=document.createElement('div'); t.className='toast '+kind;
  t.innerHTML=`<div class="tic">${ic(icName)}</div><div class="tmsg">${msg}${sub?`<small>${sub}</small>`:''}</div>`;
  wrap.appendChild(t); requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),450); },3400);
}

/* Erfolgs-Puls: zwei feine, expandierende Ringe (dezent statt Konfetti) */
function pulseAt(x,y,emerald){
  if(reducedMotion()) return;
  [0,1].forEach(i=>{
    const ring=document.createElement('div');
    ring.className='pulse-ring'+(i?' second':'')+(emerald?' emerald':'');
    ring.style.left=x+'px'; ring.style.top=y+'px';
    document.body.appendChild(ring); setTimeout(()=>ring.remove(),1100);
  });
}
function pulseFrom(elm,emerald){
  if(!elm){ pulseAt(window.innerWidth/2,window.innerHeight*0.4,emerald); return; }
  const r=elm.getBoundingClientRect();
  pulseAt(r.left+r.width/2,r.top+r.height/2,emerald);
}

/* Scroll-Animate-on-Reveal (IntersectionObserver) */
const Reveal=(()=>{
  let io=null,lastT=0,queue=0;
  function onRevealed(elm){
    animateFills(elm);
    if(elm.querySelector&&elm.querySelector('#ringProg')) animateRing();
    if(elm.querySelector&&elm.querySelector('.hero-badge')) animateHeroBadge(elm);
    countUps(elm);
  }
  function ensure(){
    if(io) return io;
    io=new IntersectionObserver(ents=>{
      ents.forEach(en=>{
        if(!en.isIntersecting) return;
        const elm=en.target; io.unobserve(elm);
        const now=performance.now(); if(now-lastT>400) queue=0; lastT=now;
        const delay=Math.min(queue*80,400); queue++;
        elm.style.transitionDelay=delay+'ms';
        elm.classList.add('revealed');
        setTimeout(()=>{ elm.style.transitionDelay=''; onRevealed(elm); },delay+60);
        /* Anti-Flicker: nach der 3D-Animation Transform entfernen → Text bleibt scharf */
        setTimeout(()=>{ elm.classList.add('settled'); },delay+920);
      });
    },{threshold:0.12,rootMargin:'0px 0px -6% 0px'});
    return io;
  }
  return {
    wire(root){
      /* Content-Sektionen wechseln „fliegend" zwischen links/rechts */
      (root||document).querySelectorAll('.section.reveal').forEach((s,i)=>{ if(!s.classList.contains('rv-l')&&!s.classList.contains('rv-r')) s.classList.add(i%2?'rv-r':'rv-l'); });
      const els=(root||document).querySelectorAll('.reveal:not(.revealed)');
      if(!('IntersectionObserver' in window)||reducedMotion()){ els.forEach(elm=>{ elm.classList.add('revealed','settled'); onRevealed(elm); }); return; }
      const obs=ensure(); els.forEach(elm=>obs.observe(elm));
    },
    reset(){ if(io){ io.disconnect(); io=null; } lastT=0; queue=0; }
  };
})();
function animateFills(scope){
  const root=scope||document;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-fill]').forEach(n=>{
      n.style.width=(n.getAttribute('data-fill')||0)+'%';
      if(!n.dataset.shimmered&&!reducedMotion()&&parseInt(n.getAttribute('data-fill'),10)>0){ n.dataset.shimmered='1'; n.classList.add('shimmer'); }
    });
  }));
}
/* Stagger-Klasse nach der Eintrittsanimation entfernen (gibt Hover-Transforms frei) */
document.addEventListener('animationend',e=>{
  const t=e.target;
  if(t&&t.classList&&t.classList.contains('row-in')&&e.animationName==='rowIn'){ t.classList.remove('row-in'); t.style.animationDelay=''; }
});
function countUps(scope){
  const root=scope||document;
  root.querySelectorAll('[data-countup]').forEach(n=>{
    if(n.dataset.counted) return; n.dataset.counted='1';
    const target=parseInt(n.getAttribute('data-countup'),10)||0;
    if(reducedMotion()||target<=0){ n.textContent=String(target); return; }
    const dur=900, start=performance.now();
    (function tick(now){
      const e=Math.min(1,(now-start)/dur), eased=1-Math.pow(1-e,3);
      n.textContent=String(Math.round(target*eased));
      if(e<1) requestAnimationFrame(tick);
    })(performance.now());
  });
}
/* Gesamt-Fortschritt (0-100) über alle Ausbildungssäulen – speist das Greeting-Badge */
function overallPct(){
  if(!state) return 0;
  const parts=[];
  if(state.theorie.gesamt>0) parts.push(pct(state.theorie.besucht,state.theorie.gesamt));
  const sf=state.sonderfahrten, soll=sf.ueberland.soll+sf.autobahn.soll+sf.nacht.soll;
  if(soll>0) parts.push(pct(sf.ueberland.ist+sf.autobahn.ist+sf.nacht.ist,soll));
  parts.push(pct(state.simulator.ist,state.simulator.soll));
  parts.push(Math.round((['sehtest','ersteHilfe','passbild'].filter(k=>state.dokumente[k].status==='verifiziert').length/3)*100));
  parts.push(fahrstilPct());
  const tp=state.theoriePruefung;
  parts.push(!tp.erforderlich||tp.bestanden?100:(tp.angemeldet?50:0));
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length);
}
function animateHeroBadge(scope){
  const badge=(scope||document).querySelector('.hero-badge'); if(!badge) return;
  const ring=badge.querySelector('.hb-ring'), label=badge.querySelector('.hb-pct');
  const target=parseInt(badge.getAttribute('data-pct'),10)||0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(ring) ring.style.setProperty('--p',(target/100)+'turn'); }));
  if(!label) return;
  if(reducedMotion()){ label.textContent=target+'%'; return; }
  const dur=1400, start=performance.now();
  (function tick(now){ const e=Math.min(1,(now-start)/dur), eased=1-Math.pow(1-e,3); label.textContent=Math.round(target*eased)+'%'; if(e<1) requestAnimationFrame(tick); })(performance.now());
}

/* ============================================================
   TILT-3D  ·  Karten neigen sich im Raum (Touch + Scroll)
   Rein GPU-kompositiert, kein Neuzeichnen von Layout → flimmerfrei.
   ============================================================ */
const Tilt=(()=>{
  let items=[],scrollRaf=null,active=false,gyroActive=false,gyroBound=false;
  const MAXP=7;   /* max. Grad durch Zeiger/Touch */
  const MAXS=4;   /* max. Grad durch Scroll-Position */
  const MAXG=6;   /* max. Grad durch Gyroskop */
  function apply(it){
    const rx=(it.ambient.x+it.pointer.x), ry=(it.ambient.y+it.pointer.y);
    const dz=it.tilting?18:0;
    it.el.style.transform=`translateZ(0) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(${dz? '-2px':'0'})`;
  }
  function onScroll(){
    if(gyroActive||scrollRaf) return;   /* bei aktivem Gyroskop treibt das Gerät die Neigung */
    scrollRaf=requestAnimationFrame(()=>{
      scrollRaf=null; const vh=window.innerHeight;
      items.forEach(it=>{
        const r=it.el.getBoundingClientRect();
        if(r.bottom<-80||r.top>vh+80){ return; }
        const center=r.top+r.height/2, rel=(center-vh/2)/(vh/2); /* -1..1 */
        it.ambient.x=Math.max(-MAXS,Math.min(MAXS,rel*MAXS));   /* oben kippt nach vorn */
        if(!it.tilting) apply(it);
      });
    });
  }
  /* Gyroskop: Handy kippen → alle Karten neigen sich sanft im Raum */
  function onGyro(e){
    if(e==null||e.gamma==null||e.beta==null) return;
    gyroActive=true;
    const gy=Math.max(-MAXG,Math.min(MAXG,e.gamma/9));       /* links/rechts */
    const gx=Math.max(-MAXG,Math.min(MAXG,(e.beta-42)/9));   /* vor/zurück, Ruhelage ~42° */
    items.forEach(it=>{ it.ambient.x=gx; it.ambient.y=gy; if(!it.tilting) apply(it); });
  }
  function enableGyro(){ if(gyroBound||!('DeviceOrientationEvent' in window)) return; gyroBound=true; window.addEventListener('deviceorientation',onGyro,{passive:true}); }
  function setupGyro(){
    if(!('DeviceOrientationEvent' in window)) return;
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      /* iOS 13+: Erlaubnis nur nach echter Nutzergeste – bei erster Berührung anfragen, kein aufdringliches Popup beim Laden */
      const req=()=>{ DeviceOrientationEvent.requestPermission().then(s=>{ if(s==='granted') enableGyro(); }).catch(()=>{}); };
      window.addEventListener('pointerdown',req,{once:true,passive:true});
    } else { enableGyro(); }
  }
  function bind(it){
    const el=it.el;
    el.addEventListener('pointermove',e=>{
      if(e.pointerType==='mouse'&&e.buttons) return;
      const r=el.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width-0.5, py=(e.clientY-r.top)/r.height-0.5;
      it.pointer.y=Math.max(-MAXP,Math.min(MAXP,px*MAXP*2));
      it.pointer.x=Math.max(-MAXP,Math.min(MAXP,-py*MAXP*2));
      el.style.setProperty('--mx',(px*100+50)+'%'); el.style.setProperty('--my',(py*100+50)+'%');
      if(!it.tilting){ it.tilting=true; el.classList.add('tilting'); }
      apply(it);
    },{passive:true});
    const release=()=>{ it.pointer.x=0; it.pointer.y=0; it.tilting=false; el.classList.remove('tilting'); apply(it); };
    el.addEventListener('pointerleave',release,{passive:true});
    el.addEventListener('pointercancel',release,{passive:true});
    el.addEventListener('pointerup',release,{passive:true});
  }
  return {
    wire(root){
      if(reducedMotion()||calmMode()) return;
      const els=(root||document).querySelectorAll('.tilt3d');
      if(!els.length) return;
      items=[];
      els.forEach(el=>{ const it={el,pointer:{x:0,y:0},ambient:{x:0,y:0},tilting:false}; items.push(it); bind(it); });
      if(!active){ active=true; window.addEventListener('scroll',onScroll,{passive:true}); }
      setupGyro();
      onScroll();
    },
    reset(){ items=[]; if(active){ window.removeEventListener('scroll',onScroll); active=false; } }
  };
})();

/* Scroll-getriebener Fortschrittsbalken */
let spTicking=false;
function updateScrollProgress(){
  const bar=el('scrollProgress'); if(!bar) return;
  const doc=document.documentElement;
  const max=(doc.scrollHeight-window.innerHeight);
  const p=max>0?Math.min(1,Math.max(0,(window.scrollY||doc.scrollTop)/max)):0;
  bar.style.width=(p*100).toFixed(2)+'%';
}
function initScrollProgress(){
  window.addEventListener('scroll',()=>{
    if(spTicking) return; spTicking=true;
    requestAnimationFrame(()=>{ updateScrollProgress(); spTicking=false; });
  },{passive:true});
  updateScrollProgress();
}

/* ---------- 11 · Interactive Particle Background (Verkehrszeichen) ---------- */
const FX=(()=>{
  let canvas,ctx,W=0,H=0,DPR=1,parts=[],raf=null,lastTs=0;
  const pointer={x:-9999,y:-9999};
  function drawSign(p,drawX,drawY){
    const s=p.size*0.5;
    ctx.save();
    ctx.translate(drawX,drawY);
    ctx.rotate(p.rot);
    ctx.lineWidth=1.4;
    ctx.lineJoin='round'; ctx.lineCap='round';
    const a=p.alpha;
    ctx.strokeStyle=p.red?`rgba(244,63,94,${a})`:`rgba(154,163,180,${a})`;
    ctx.beginPath();
    switch(p.shape){
      case 0: /* Gefahrzeichen: Dreieck mit Ausrufezeichen */
        ctx.moveTo(0,-s); ctx.lineTo(s*0.9,s*0.62); ctx.lineTo(-s*0.9,s*0.62); ctx.closePath();
        ctx.moveTo(0,-s*0.32); ctx.lineTo(0,s*0.1);
        ctx.moveTo(0,s*0.32); ctx.lineTo(0,s*0.34);
        break;
      case 1: /* Vorfahrt gewähren: umgedrehtes Dreieck */
        ctx.moveTo(-s*0.9,-s*0.62); ctx.lineTo(s*0.9,-s*0.62); ctx.lineTo(0,s); ctx.closePath();
        break;
      case 2: /* Vorfahrtstraße: Raute mit Innenraute */
        ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath();
        ctx.moveTo(0,-s*0.45); ctx.lineTo(s*0.45,0); ctx.lineTo(0,s*0.45); ctx.lineTo(-s*0.45,0); ctx.closePath();
        break;
      case 3: /* Verbotszeichen: Kreis mit Schrägbalken */
        ctx.arc(0,0,s*0.82,0,Math.PI*2);
        ctx.moveTo(-s*0.58,s*0.58); ctx.lineTo(s*0.58,-s*0.58);
        break;
      case 4: /* Stop: Achteck mit Balken */
        for(let i=0;i<8;i++){ const ang=Math.PI/8+i*Math.PI/4; const x=Math.cos(ang)*s*0.88, y=Math.sin(ang)*s*0.88; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
        ctx.closePath();
        ctx.moveTo(-s*0.42,0); ctx.lineTo(s*0.42,0);
        break;
      default: /* Vorgeschriebene Fahrtrichtung: Kreis mit Pfeil */
        ctx.arc(0,0,s*0.85,0,Math.PI*2);
        ctx.moveTo(0,s*0.42); ctx.lineTo(0,-s*0.36);
        ctx.moveTo(-s*0.24,-s*0.08); ctx.lineTo(0,-s*0.36); ctx.lineTo(s*0.24,-s*0.08);
        break;
    }
    ctx.stroke();
    ctx.restore();
  }
  function seed(){
    parts=[];
    const count=Math.max(9,Math.min(20,Math.round((W*H)/62000)));
    for(let i=0;i<count;i++){
      const depth=0.35+Math.random()*0.65;
      parts.push({
        x:Math.random()*W,
        y:Math.random()*(H+200)-100,
        depth,
        size:(26+Math.random()*44)*depth,
        rot:(Math.random()*0.6-0.3),
        rotV:(Math.random()*0.06-0.03),
        vy:(7+Math.random()*11)*depth,
        swayA:8+Math.random()*20,
        swayF:0.25+Math.random()*0.45,
        phase:Math.random()*Math.PI*2,
        shape:i%6,
        red:Math.random()<0.22,
        alpha:0.05+depth*0.06,
        ox:0,oy:0
      });
    }
  }
  function size(){
    if(!canvas) return;
    DPR=Math.min(1.5,window.devicePixelRatio||1);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  function tick(ts){
    raf=requestAnimationFrame(tick);
    if(document.hidden) return;
    if(ts-lastTs<31) return;   /* ~32 fps Deckel: halbe GPU-Last, kein Flimmern auf dem Handy */
    const dt=Math.min(0.05,(ts-lastTs)/1000||0.016); lastTs=ts;
    ctx.clearRect(0,0,W,H);
    const t=ts/1000, scrollY=window.scrollY||0, wrap=H+240;
    for(const p of parts){
      p.y-=p.vy*dt;            /* langsames Aufsteigen */
      p.rot+=p.rotV*dt;
      /* Scroll-Parallaxe + Wrap-Around */
      let dy=(p.y - scrollY*p.depth*0.12 + 120)%wrap; if(dy<0) dy+=wrap; dy-=120;
      const dx=p.x+Math.sin(t*p.swayF+p.phase)*p.swayA;
      /* Interaktion: sanftes Ausweichen vor dem Zeiger */
      const px=dx+p.ox, py=dy+p.oy;
      const ddx=px-pointer.x, ddy=py-pointer.y, dist=Math.hypot(ddx,ddy);
      let tx=0,ty=0;
      if(dist<170&&dist>0.001){ const f=(1-dist/170)*30*p.depth; tx=(ddx/dist)*f; ty=(ddy/dist)*f; }
      p.ox+=(tx-p.ox)*0.06; p.oy+=(ty-p.oy)*0.06;
      drawSign(p,dx+p.ox,dy+p.oy);
    }
  }
  return {
    init(){
      canvas=el('fxCanvas'); if(!canvas||!canvas.getContext) return;
      ctx=canvas.getContext('2d'); if(!ctx) return;
      size(); seed();
      if(reducedMotion()) return; /* Canvas bleibt leer (CSS blendet ihn zusätzlich aus) */
      window.addEventListener('resize',()=>{ size(); seed(); });
      window.addEventListener('pointermove',e=>{ pointer.x=e.clientX; pointer.y=e.clientY; },{passive:true});
      window.addEventListener('pointerleave',()=>{ pointer.x=-9999; pointer.y=-9999; },{passive:true});
      this.start();
    },
    start(){ if(reducedMotion()||calmMode()||raf) return; lastTs=0; raf=requestAnimationFrame(tick); },
    stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } if(ctx&&W&&H) ctx.clearRect(0,0,W,H); }
  };
})();
</script>

<script>
/* ============================================================
   SCREENS  ·  1) Anmeldung · 2) Klassenwahl · 3) Cockpit
   ============================================================ */
let cdInterval=null;
let mapInstance=null;
let prevReady=false;
let klasseSelected=null;
let historyUI={tab:'fahr',expanded:false};

function fkLogoSVG(){ return `<svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-label="Fahrschule Krebs"><rect x="7" y="9" width="4.4" height="26" rx="2.2" fill="#E11D48"/><text x="24.5" y="29.5" text-anchor="middle" font-family="-apple-system,Segoe UI,Arial" font-size="17" font-weight="800" fill="#F8FAFC" letter-spacing="-1">FK</text></svg>`; }

/* ---------- Screen 1 · Anmeldung ---------- */
function renderLoginScreen(){
  const p=getProfile();
  const isLogin=!!p;
  const name=isLogin?p.name:(pendingProfile?pendingProfile.name:'');
  const email=isLogin?p.email:(pendingProfile?pendingProfile.email:'');
  const remember=isLogin?!!p.remember:(pendingProfile?!!pendingProfile.remember:true);
  const app=el('app'); app.className='';
  app.innerHTML=`<div class="screen auth-screen">
    <div class="auth-hero reveal">
      <div class="logo logo-xl">${fkLogoSVG()}</div>
      <div><div class="auth-brandname">Fahrschule Krebs</div><div class="auth-brandsub">Schüler-Cockpit</div></div>
    </div>
    <div class="card auth-card reveal">
      <div class="eyebrow" style="margin-bottom:8px">${isLogin?'Anmeldung':'Schritt 1 von 2 · Dein Konto'}</div>
      <h1 class="auth-title">${isLogin?'Willkommen zurück.':'Konto erstellen.'}</h1>
      <p class="auth-sub">${isLogin?'Melde dich mit deinem Passwort an, um dein Cockpit zu öffnen.':'Lege deinen persönlichen Zugang an – Konto und Ausbildungsstand bleiben lokal auf diesem Gerät.'}</p>
      ${isLogin?`<div class="auth-user"><div class="avatar">${esc(initialsOf(p.name))}</div><div><div class="au-name">${esc(p.name)}</div><div class="au-mail">${esc(p.email)}</div></div></div>`:''}
      <form id="authForm" novalidate>
        ${isLogin?'':`
        <div class="field"><label for="authName">Vollständiger Name</label><div class="input-wrap"><span class="fic">${ic('user-round')}</span><input class="txt" id="authName" name="name" type="text" autocomplete="name" placeholder="Vor- und Nachname" value="${esc(name)}" /></div></div>
        <div class="field"><label for="authEmail">E-Mail-Adresse</label><div class="input-wrap"><span class="fic">${ic('mail')}</span><input class="txt" id="authEmail" name="email" type="email" autocomplete="email" placeholder="name@beispiel.de" value="${esc(email)}" /></div></div>`}
        <div class="field"><label for="authPass">Passwort</label><div class="input-wrap"><span class="fic">${ic('lock')}</span><input class="txt" id="authPass" name="password" type="password" autocomplete="${isLogin?'current-password':'new-password'}" placeholder="${isLogin?'Dein Passwort':'Mindestens 8 Zeichen'}" /><button type="button" class="eye-btn" data-action="toggle-pass" data-target="authPass" aria-label="Passwort anzeigen">${ic('eye')}</button></div></div>
        ${isLogin?'':`<div class="field"><label for="authPass2">Passwort wiederholen</label><div class="input-wrap"><span class="fic">${ic('key-round')}</span><input class="txt" id="authPass2" type="password" autocomplete="new-password" placeholder="Passwort bestätigen" /><button type="button" class="eye-btn" data-action="toggle-pass" data-target="authPass2" aria-label="Passwort anzeigen">${ic('eye')}</button></div></div>`}
        <label class="check-row"><input type="checkbox" id="authRemember" ${remember?'checked':''} /><span class="cbx">${ic('check')}</span>Angemeldet bleiben</label>
        <div class="form-error" id="authError" hidden>${ic('circle-alert')}<span id="authErrorText"></span></div>
        <button class="btn btn-primary" id="authSubmit" type="submit">${ic(isLogin?'log-in':'user-plus')}${isLogin?'Anmelden':'Weiter zur Klassenwahl'}</button>
      </form>
      <div class="auth-links">${isLogin?`<button class="link-btn" data-action="auth-reset">${ic('rotate-ccw')}Passwort vergessen? Zugang zurücksetzen</button>`:''}</div>
    </div>
    <div class="auth-foot reveal"><b>Fahrschule Krebs</b> · Am Bahnhof 3, Fulda<br/>Konto &amp; Ausbildungsstand werden ausschließlich lokal in deinem Browser gespeichert.</div>
  </div>`;
  Reveal.wire(app);
  el('authForm').addEventListener('submit',e=>{ e.preventDefault(); handleAuthSubmit(); });
}
function showAuthError(msg){
  const box=el('authError'), txt=el('authErrorText'); if(!box||!txt) return;
  txt.textContent=msg; box.hidden=false;
  const card=box.closest('.auth-card');
  if(card){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }
  haptic('block');
}
function hideAuthError(){ const box=el('authError'); if(box) box.hidden=true; }
async function handleAuthSubmit(){
  hideAuthError();
  const p=getProfile();
  try{
    if(p){ /* Anmeldung mit bestehendem Konto */
      const pw=el('authPass').value;
      if(!pw){ showAuthError('Bitte gib dein Passwort ein.'); return; }
      const hash=await hashPassword(pw,p.salt,p.algo);
      if(hash!==p.hash){ showAuthError('Falsches Passwort. Bitte versuche es erneut.'); return; }
      p.remember=!!el('authRemember').checked; saveProfile(p);
      authed=true; Session.set('1'); haptic('confirm');
      nav(p.klasse?'cockpit':'klasse');
      setTimeout(()=>toast('ok','Willkommen zurück, '+esc(firstName(p.name))+'!','Anmeldung erfolgreich.'),350);
    } else { /* Registrierung */
      const name=el('authName').value.trim();
      const email=el('authEmail').value.trim();
      const pw=el('authPass').value, pw2=el('authPass2').value;
      if(name.length<3){ showAuthError('Bitte gib deinen vollständigen Namen an (mindestens 3 Zeichen).'); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showAuthError('Bitte gib eine gültige E-Mail-Adresse an.'); return; }
      if(pw.length<8){ showAuthError('Das Passwort braucht mindestens 8 Zeichen.'); return; }
      if(pw!==pw2){ showAuthError('Die Passwörter stimmen nicht überein.'); return; }
      const salt=randomSalt(), algo=hashAlgoAvailable();
      const hash=await hashPassword(pw,salt,algo);
      pendingProfile={name,email,salt,algo,hash,remember:!!el('authRemember').checked,createdAt:new Date().toISOString()};
      haptic('confirm');
      nav('klasse');
    }
  }catch(e){
    showAuthError('Sichere Anmeldung wird von diesem Browser nicht unterstützt. Bitte aktualisiere deinen Browser.');
  }
}
function togglePassVisibility(btn){
  const input=el(btn.getAttribute('data-target')); if(!input) return;
  const show=input.type==='password';
  input.type=show?'text':'password';
  btn.innerHTML=ic(show?'eye-off':'eye');
  btn.setAttribute('aria-label',show?'Passwort verbergen':'Passwort anzeigen');
}

function pickKlasse(btn){
  const code=btn.getAttribute('data-klasse'); if(!CLASS_CONFIG[code]) return;
  klasseSelected=code;
  if(CLASS_CONFIG[code].vorbesitzPflicht) besitzSelected='erweiterung';
  document.querySelectorAll('.class-tile').forEach(t=>{
    const on=t.getAttribute('data-klasse')===code;
    t.classList.toggle('selected',on); t.setAttribute('aria-pressed',on?'true':'false');
  });
  const bes=el('besitzBlock'); if(bes) bes.innerHTML=besitzBlockHTML(code);
  const info=el('klasseInfo'); if(info) info.innerHTML=classInfoHTML(code,besitzSelected);
  const cta=el('klasseContinue'); if(cta) cta.disabled=false;
  if('vibrate' in navigator) navigator.vibrate(8);
}
function pickBesitz(btn){
  if(btn.classList.contains('disabled')){
    haptic('block');
    const cfg=klasseSelected?CLASS_CONFIG[klasseSelected]:null;
    if(cfg&&cfg.vorbesitzHinweis) toast('block','Nur als Erweiterung möglich',cfg.vorbesitzHinweis);
    return;
  }
  const val=btn.getAttribute('data-besitz'); if(val!=='erst'&&val!=='erweiterung') return;
  besitzSelected=val;
  const bes=el('besitzBlock'); if(bes) bes.innerHTML=besitzBlockHTML(klasseSelected);
  const info=el('klasseInfo'); if(info) info.innerHTML=classInfoHTML(klasseSelected,besitzSelected);
  if('vibrate' in navigator) navigator.vibrate(8);
}
function klasseBack(){ if(classCtx==='change') nav('cockpit'); else nav('login'); }
function klasseContinue(){
  const code=klasseSelected; if(!code||!CLASS_CONFIG[code]) return;
  const besitz=CLASS_CONFIG[code].vorbesitzPflicht?'erweiterung':(besitzSelected||'erst');
  if(classCtx==='change'){
    const p=getProfile(); if(!p){ nav('login'); return; }
    if(p.klasse===code&&(p.besitz||defaultBesitz(code))===besitz){ nav('cockpit'); return; }
    let go=true; try{ go=confirm('Ausbildung wirklich auf Klasse '+code+' ('+besitzLabel(besitz)+') umstellen? Dein Cockpit wird entsprechend angepasst.'); }catch(e){}
    if(!go) return;
    p.klasse=code; p.besitz=besitz; saveProfile(p);
    state=buildDefaultState(code,besitz); saveState();
    haptic('confirm'); nav('cockpit');
    setTimeout(()=>toast('ok','Ausbildung umgestellt','Klasse '+code+' · '+besitzLabel(besitz)+'.'),350);
  } else {
    if(!pendingProfile){ nav('login'); return; }
    const p=Object.assign({},pendingProfile,{klasse:code,besitz});
    saveProfile(p); pendingProfile=null;
    authed=true; Session.set('1');
    state=buildDefaultState(code,besitz); saveState();
    haptic('confirm'); nav('cockpit');
    setTimeout(()=>toast('ok','Willkommen, '+esc(firstName(p.name))+'!','Dein Cockpit für Klasse '+code+' ('+besitzLabel(besitz)+') ist bereit.'),400);
  }
}

function animateRing(){
  const ring=el('ringProg'), label=el('ringPct'); if(!ring||!label||ring.dataset.done) return; ring.dataset.done='1';
  const target=parseInt(ring.getAttribute('data-target'),10)||0, C=parseFloat(ring.getAttribute('stroke-dasharray'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ ring.style.strokeDashoffset=(C*(1-target/100)).toFixed(2); }));
  if(reducedMotion()){ label.innerHTML=target+'<span>%</span>'; return; }
  const dur=1500, start=performance.now();
  (function tick(now){ const e=Math.min(1,(now-start)/dur), eased=1-Math.pow(1-e,3); label.innerHTML=Math.round(target*eased)+'<span>%</span>'; if(e<1) requestAnimationFrame(tick); })(performance.now());
}
function startCountdown(){
  const target=new Date(state.naechsteFahrstunde), whenEl=el('cd-when');
  if(whenEl) whenEl.textContent=fmtDayTime(target);
  clearInterval(cdInterval);
  const upd=()=>{ let diff=Math.max(0,target-new Date()); const d=Math.floor(diff/86400000); diff-=d*86400000; const h=Math.floor(diff/3600000); diff-=h*3600000; const m=Math.floor(diff/60000); diff-=m*60000; const s=Math.floor(diff/1000); const set=(id,v)=>{ const n=el(id); if(n) n.textContent=pad(v); }; set('cd-d',d); set('cd-h',h); set('cd-m',m); set('cd-s',s); };
  upd(); cdInterval=setInterval(upd,1000);
}
function initMap(){

  mapInstance=L.map('map',{zoomControl:true,scrollWheelZoom:false,attributionControl:true}).setView([50.5528,9.6779],14);

/* ---------- Morph (generisch) ---------- */
let morphOpen=false, morphOriginRect=null;
function openMorph(originEl,innerHTML){
  const layer=el('morphLayer'), card=el('morphCard'), inner=el('morphInner');
  inner.innerHTML=innerHTML;
  const r=originEl?originEl.getBoundingClientRect():{top:window.innerHeight*0.5-1,left:window.innerWidth*0.5-1,width:2,height:2};
  morphOriginRect=r;
  const setRect=(t,l,w,h,rad)=>{ card.style.top=t+'px'; card.style.left=l+'px'; card.style.width=w+'px'; card.style.height=h+'px'; card.style.borderRadius=rad; };
  layer.classList.remove('closing'); layer.classList.add('open'); layer.setAttribute('aria-hidden','false'); morphOpen=true;
  setRect(r.top,r.left,r.width,r.height,'20px'); document.body.style.overflow='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ const vw=window.innerWidth,vh=window.innerHeight,w=Math.min(480,vw),left=Math.max(0,(vw-w)/2); setRect(0,left,w,vh,'0px'); }));
}
function closeMorph(){
  if(!morphOpen) return;
  const layer=el('morphLayer'), card=el('morphCard'), r=morphOriginRect;
  if(r){ card.style.top=r.top+'px'; card.style.left=r.left+'px'; card.style.width=r.width+'px'; card.style.height=r.height+'px'; card.style.borderRadius='20px'; }
  layer.classList.remove('open'); layer.classList.add('closing'); layer.setAttribute('aria-hidden','true'); document.body.style.overflow=''; morphOpen=false;
  setTimeout(()=>{ layer.classList.remove('closing'); el('morphInner').innerHTML=''; card.style.top='0'; card.style.width='0'; card.style.height='0'; },520);
}
function morphSwap(innerHTML){
  const inner=el('morphInner'); if(!inner) return;
  if(!morphOpen){ openMorph(null,innerHTML); return; }
  inner.innerHTML=innerHTML; inner.scrollTop=0;
}
function closeMorphInstant(){
  const layer=el('morphLayer'); if(!layer) return;
  layer.classList.remove('open','closing'); layer.setAttribute('aria-hidden','true');
  const card=el('morphCard'), inner=el('morphInner');
  if(inner) inner.innerHTML='';
  if(card){ card.style.top='0'; card.style.left='0'; card.style.width='0'; card.style.height='0'; }
  document.body.style.overflow=''; morphOpen=false;
}

  const numCls=s.num.length>2?'mo-num z':'mo-num';
  const back=fromList?`<button type="button" class="link-btn" data-action="theme-list-swap" style="padding:6px 8px 6px 0;margin-bottom:10px">${ic('arrow-left')}Alle Themen</button>`:'';
  return `${back}<div class="${numCls}">${s.num}</div><div class="mo-cat">${s.cat}</div><div class="mo-title">${s.title}</div><div class="mo-when">${ic('calendar-clock')}${s.day} · ${s.time}</div><div class="mo-desc">${s.desc}</div><div class="mo-cap"><div class="cl"><span>Raumbelegung</span><span><b>${s.kap.belegt}</b> / ${s.kap.gesamt} Plätzen</span></div><div class="track"><div class="fill" style="width:${kp}%"></div></div></div>${sollErf?`<div class="mo-note">${ic('info')}<span>Dein Theorie-Soll ist bereits erfüllt. Diese Buchung erfolgt als freiwillige Wiederholung – ohne Anrechnung auf die Pflichteinheiten.</span></div>`:''}<button class="btn btn-primary" data-action="confirm-booking" data-id="${s.id}"${fromList?' data-from="list"':''}>${ic('check')}Platz verbindlich buchen</button>`;
}
function themeListSheetHTML(){
  const sess=state.themeSessions;
  const fehlend=sess.filter(s=>s.status!=='erledigt');
  const besucht=sess.filter(s=>s.status==='erledigt');
  const offenCount=sess.filter(s=>s.status==='offen').length;
  const row=s=>{
    const meta=`<span class="tls">${ic('calendar')}${s.day} · ${s.time}<span>·</span>${s.cat}</span>`;
    if(s.status==='offen'){
      return `<button type="button" class="tl-row" data-action="theme-detail" data-id="${s.id}">
        <span class="tln">${s.num}</span>
        <span class="tlm"><span class="tlt">${s.title}</span>${meta}</span>
        <span class="tt-badge open">${ic('calendar-plus')}Frei</span>
      </button>`;
    }
    if(s.status==='gebucht'){
      return `<div class="tl-row">
        <span class="tln">${s.num}</span>
        <span class="tlm"><span class="tlt">${s.title}</span>${meta}</span>
        <span class="tt-badge booked">${ic('check')}Gebucht</span>
      </div>`;
    }
    return `<div class="tl-row done">
      <span class="tln">${s.num}</span>
      <span class="tlm"><span class="tlt">${s.title}</span>${meta}</span>
      <span class="tt-badge done">${ic('check-check')}Besucht</span>
    </div>`;
  };
  return `<div class="mo-num">${ic('graduation-cap')}</div>
    <div class="sheet-eyebrow">Termine &amp; Buchung</div>
    <div class="sheet-title">Thema wählen</div>
    <div class="sheet-sub">${who().klasseLabel} · ${besitzLabel(state.besitz)} — ${sess.length} Pflichtthemen, davon ${besucht.length} besucht${offenCount?`, ${offenCount} noch ohne Termin`:''}.</div>
    ${fehlend.length?`<div class="tl-group" style="margin-top:4px">Fehlen noch</div>${fehlend.map(row).join('')}`:''}
    ${besucht.length?`<div class="tl-group">Besucht</div>${besucht.map(row).join('')}`:''}`;
}
function simSheetHTML(){
  const byDay={}; state.simSlots.forEach(s=>{ (byDay[s.day]=byDay[s.day]||[]).push(s); });
  let body='';
  Object.keys(byDay).forEach(day=>{ body+=`<div class="slot-day"><div class="sd-lab">${ic('calendar')}${day}</div><div class="slot-grid">`+byDay[day].map(s=>`<div class="slot-chip ${s.reserved?'reserved':''}" ${s.reserved?'':`data-action="sim-pick" data-id="${s.id}"`}><span class="st">${s.time}</span><span class="ss">${s.reserved?'Belegt':'Frei'}</span></div>`).join('')+`</div></div>`; });
  return `<div class="mo-num">${ic('gamepad-2')}</div><div class="sheet-eyebrow">Simulator</div><div class="sheet-title">Platz wählen</div><div class="sheet-sub">Wähle einen freien 90-Minuten-Slot. Aktuell ${state.simulator.ist} von ${state.simulator.soll} empfohlenen Einheiten absolviert.</div>${body}<button class="btn btn-primary" id="simConfirm" data-action="confirm-sim" disabled>${ic('check')}Verbindlich reservieren</button>`;
}
function examSheetHTML(){
  const opts=state.examTermine.map(t=>`<div class="exam-opt" data-action="exam-pick" data-id="${t.id}"><div class="eo-cal"><div class="d">${t.dNum}</div><div class="m">${t.mon}</div></div><div class="eo-body"><div class="t">${t.label} · ${t.time} Uhr</div><div class="s">${t.ort}</div></div><div class="eo-radio"></div></div>`).join('');
  return `<div class="mo-num">${ic('clipboard-check')}</div><div class="sheet-eyebrow">Theorieprüfung</div><div class="sheet-title">Termin wählen</div><div class="sheet-sub">Freie Prüfungstermine beim TÜV im Prüfgebiet Fulda.</div>${opts}<button class="btn btn-primary" id="examConfirm" data-action="confirm-exam" disabled>${ic('calendar-check')}Verbindlich anmelden</button>`;
}
function notifSheetHTML(){
  const items=[];
  items.push({icon:'car-front',t:'Nächste Fahrstunde',s:`${fmtDayTime(new Date(state.naechsteFahrstunde))} mit ${FL_NAME}`});
  const pend=['sehtest','ersteHilfe','passbild'].filter(k=>state.dokumente[k].status!=='verifiziert');
  if(pend.length) items.push({icon:'file-warning',t:'Dokumente ausstehend',s:`${pend.length} Nachweis${pend.length>1?'e':''} noch einzuscannen`});
  const off=openAmount();
  if(off>0) items.push({icon:'banknote',t:'Offener Betrag: '+fmtEuro(off),s:'Begleichung vor Ort in der Fahrschule – bar oder mit Karte'});
  const fehlt=state.themeSessions.filter(s=>s.status==='offen').length;
  if(fehlt) items.push({icon:'graduation-cap',t:fehlt===1?'1 Theorie-Thema fehlt noch':fehlt+' Theorie-Themen fehlen noch',s:'Termine dafür findest du im Themenkatalog'});
  const tp=state.theoriePruefung;
  if(tp.erforderlich&&!tp.bestanden) items.push({icon:'clipboard-check',t:'Theorieprüfung',s:tp.angemeldet?`Angemeldet für ${tp.datum} · ${tp.time} Uhr`:'Anmeldung nach Abschluss aller Pflichtthemen'});
  const geb=state.themeSessions.filter(s=>s.status==='gebucht').length;
  if(geb) items.push({icon:'calendar-check',t:'Theorie-Buchungen',s:`${geb===1?'Ein Platz':geb+' Plätze'} fest reserviert`});
  if(state.simulator.ist<state.simulator.soll) items.push({icon:'gamepad-2',t:'Simulator-Empfehlung',s:`Noch ${state.simulator.soll-state.simulator.ist} empfohlene Einheit${(state.simulator.soll-state.simulator.ist)>1?'en':''} offen – Slot sichern`});
  if(!hotspotsUnlocked()) items.push({icon:'map-pin',t:'Prüfgebiet-Guide verfügbar',s:'Exklusive Fulda-Hotspots – in der Fahrschule freischalten'});
  const rows=items.map(n=>`<div class="hot-item" style="cursor:default"><div class="hnum">${ic(n.icon)}</div><div class="htext"><div class="ht">${n.t}</div><div class="hd">${n.s}</div></div></div>`).join('');
  return `<div class="mo-num">${ic('bell')}</div><div class="sheet-eyebrow">Mitteilungen</div><div class="sheet-title">Benachrichtigungen</div><div class="hot-list" style="margin-top:4px">${rows}</div>`;
}
function profileSheetHTML(){
  const w=who();
  return `<div class="mo-num">${ic('user-round')}</div><div class="sheet-eyebrow">Profil</div><div class="sheet-title">${esc(w.name)}</div>
    <div class="hot-list" style="margin:6px 0 18px">
      <div class="hot-item" style="cursor:default"><div class="hnum">${ic('mail')}</div><div class="htext"><div class="ht">${esc(w.email)}</div><div class="hd">Hinterlegte E-Mail-Adresse</div></div></div>
      <div class="hot-item" style="cursor:default"><div class="hnum">${ic('badge-check')}</div><div class="htext"><div class="ht">${w.klasseLabel} · ${w.ausbildungsart}</div><div class="hd">${w.cfg.name} – ${w.cfg.beschreibung}</div></div></div>
      <div class="hot-item" style="cursor:default"><div class="hnum">${ic('car-front')}</div><div class="htext"><div class="ht">${FL_NAME}</div><div class="hd">Zugeteilter Fahrlehrer</div></div></div>
      <div class="hot-item" style="cursor:default"><div class="hnum">${ic('database')}</div><div class="htext"><div class="ht">${Store.ok?'Lokal gespeichert':'Sitzungsspeicher'}</div><div class="hd">Konto &amp; Fortschritt bleiben auf diesem Gerät</div></div></div>
    </div>
    <button type="button" class="switch-row ${calmMode()?'on':''}" data-action="toggle-calm" role="switch" aria-checked="${calmMode()?'true':'false'}">
      <span class="swic">${ic('sparkles')}</span>
      <span class="swt"><span class="ht">Ruhiger Modus</span><span class="hd">Reduziert Partikel-Hintergrund &amp; 3D – falls dein Gerät flackert</span></span>
      <span class="sw-toggle"><span class="sw-knob"></span></span>
    </button>
    <button class="btn btn-ghost" data-action="change-class" style="margin-bottom:10px">${ic('arrow-left-right')}Führerscheinklasse wechseln</button>
    <button class="btn btn-ghost" data-action="reset-training" style="margin-bottom:10px">${ic('rotate-ccw')}Ausbildungsdaten zurücksetzen</button>
    <button class="btn btn-ghost" data-action="logout" style="margin-bottom:10px">${ic('log-out')}Abmelden</button>
    <button class="btn btn-ghost" data-action="delete-account" style="color:var(--accent-hi)">${ic('trash-2')}Konto &amp; lokale Daten löschen</button>`;
}

/* ---------- Aktionen ---------- */
function handleTheme(id,tileEl){
  const s=state.themeSessions.find(x=>x.id===id); if(!s) return;
  if(s.status==='gesperrt'){ haptic('block'); toast('block','Nicht für deine Klasse','Dieses Thema ist für '+who().klasseLabel+' nicht relevant.'); return; }
  if(s.status==='erledigt'){ haptic('block'); toast('block','Bereits besucht','Dieses Pflichtthema ist schon angerechnet.'); return; }
  if(s.status==='gebucht'){ toast('info','Bereits gebucht','Dein Platz für dieses Thema ist reserviert.'); return; }
  openMorph(tileEl,themeSheetHTML(s));
}
function confirmBooking(id,btnEl){
  const s=state.themeSessions.find(x=>x.id===id); if(!s||s.status!=='offen') return;
  const fromList=!!(btnEl&&btnEl.getAttribute&&btnEl.getAttribute('data-from')==='list');
  s.status='gebucht'; s.kap.belegt=Math.min(s.kap.gesamt,s.kap.belegt+1);
  saveState(); haptic('confirm'); pulseFrom(btnEl);
  if(fromList&&state.themeSessions.some(x=>x.status==='offen')) morphSwap(themeListSheetHTML()); else closeMorph();
  refreshTheory(); refreshExam(); toast('ok','Platz gebucht','„'+s.title+'" – wir sehen uns.');
}
function openThemeDetail(id){
  const s=state.themeSessions.find(x=>x.id===id); if(!s||s.status!=='offen') return;
  morphSwap(themeSheetHTML(s,true));
}
let simSelected=null;
function pickSimSlot(chip){ if(chip.classList.contains('reserved')) return; document.querySelectorAll('#morphInner .slot-chip.selected').forEach(c=>c.classList.remove('selected')); chip.classList.add('selected'); simSelected=chip.getAttribute('data-id'); const b=el('simConfirm'); if(b) b.disabled=false; }
function confirmSim(btnEl){
  const slot=state.simSlots.find(s=>s.id===simSelected); if(!slot||slot.reserved) return;
  slot.reserved=true; state.simulator.ist++; saveState(); haptic('confirm'); pulseFrom(btnEl); closeMorph(); updateSimCount(); toast('ok','Simulator reserviert',`${slot.day} · ${slot.time} Uhr`); simSelected=null;
}
let examSelected=null;
function pickExam(row){ document.querySelectorAll('#morphInner .exam-opt.selected').forEach(c=>c.classList.remove('selected')); row.classList.add('selected'); examSelected=row.getAttribute('data-id'); const b=el('examConfirm'); if(b) b.disabled=false; }
function confirmExam(btnEl){
  const t=state.examTermine.find(x=>x.id===examSelected); if(!t) return;
  const tp=state.theoriePruefung; tp.angemeldet=true; tp.terminId=t.id; tp.datum=t.label; tp.ort=t.ort; tp.time=t.time;
  saveState(); haptic('confirm'); pulseFrom(btnEl); closeMorph(); refreshExam(); toast('ok','Zur Theorieprüfung angemeldet',`${t.label} · ${t.ort}`); examSelected=null;
}
function passExam(btnEl){ state.theoriePruefung.bestanden=true; saveState(); haptic('confirm'); pulseFrom(btnEl,true); refreshExam(); refreshReady(); toast('ok','Theorieprüfung bestanden','Glückwunsch!'); }
function toggleAvail(cell){ const d=cell.getAttribute('data-d'), p=cell.getAttribute('data-p'); const cur=!!(state.verfuegbarkeit[d]&&state.verfuegbarkeit[d][p]); if(!state.verfuegbarkeit[d]) state.verfuegbarkeit[d]={}; state.verfuegbarkeit[d][p]=!cur; cell.classList.toggle('on',!cur); saveState(); if('vibrate' in navigator) navigator.vibrate(8); }
function requestLesson(btnEl){
  let selected=0, candidates=[];
  DAYS.forEach(d=>PERIODS.forEach(p=>{ const on=state.verfuegbarkeit[d.k]&&state.verfuegbarkeit[d.k][p.k]; if(on) selected++; const plan=FL_PLAN[d.k]&&FL_PLAN[d.k][p.k]; if(on&&plan) candidates.push({dt:nextDateForDow(d.k,p.hour)}); }));
  if(selected===0){ haptic('block'); toast('info','Noch keine Zeiten markiert','Tippe im Raster deine freien Fenster an.'); return; }
  if(candidates.length===0){ haptic('block'); toast('block','Kein Match gefunden',`Deine Zeiten überschneiden sich nicht mit ${FL_NAME}. Markiere weitere Fenster.`); return; }
  candidates.sort((a,b)=>a.dt-b.dt); const m=candidates[0];
  state.naechsteFahrstunde=m.dt.toISOString(); saveState(); refreshCountdown(); haptic('confirm'); pulseFrom(btnEl); toast('ok','Fahrstunde gematcht!',`${fmtDayTime(m.dt)} mit ${FL_NAME}`);
}
function focusHotspot(idx){ const h=hotspots[idx]; if(!h||!mapInstance) return; mapInstance.flyTo([h.lat,h.lng],16,{duration:.8}); if(h._marker) h._marker.openPopup(); const m=el('map'); if(m) m.scrollIntoView({behavior:'smooth',block:'center'}); }
function openUnlock(btnEl){ openMorph(btnEl,unlockSheetHTML()); }
function confirmUnlock(btnEl){
  const inp=el('unlockCode'); if(!inp) return;
  const val=(inp.value||'').trim().replace(/\s+/g,'').toUpperCase();
  if(val!==HOTSPOT_ACCESS_CODE.toUpperCase()){
    const box=el('unlockError'), txt=el('unlockErrorText'), wrap=el('unlockWrap');
    if(txt) txt.textContent=val?'Dieser Code ist nicht gültig. Den Freischaltcode erhältst du in der Fahrschule.':'Bitte gib deinen Freischaltcode ein.';
    if(box) box.hidden=false;
    if(wrap){ wrap.classList.remove('shake'); void wrap.offsetWidth; wrap.classList.add('shake'); }
    haptic('block'); return;
  }
  const p=getProfile(); if(p){ p.hotspotsUnlocked=true; saveProfile(p); }
  haptic('confirm'); pulseFrom(btnEl,true); closeMorph(); refreshMap();
  toast('ok','Prüfgebiet-Guide freigeschaltet','Die Fulda-Hotspots sind jetzt für dich verfügbar.');
}
function readyGo(btnEl){ haptic('confirm'); pulseFrom(btnEl,true); toast('ok','Prüfungsreife bestätigt','Alle Voraussetzungen sind erfüllt.'); }
function resetTraining(){
  let go=true; try{ go=confirm('Ausbildungsdaten wirklich zurücksetzen? Buchungen, Scans und Fortschritt in diesem Cockpit werden auf den Ausgangsstand gebracht.'); }catch(e){}
  if(!go) return;
  const p=getProfile(); if(!p||!p.klasse) return;
  closeMorphInstant();
  state=buildDefaultState(p.klasse,p.besitz||defaultBesitz(p.klasse)); saveState();
  historyUI={tab:'fahr',expanded:false};
  theoryUI={filter:'alle'};
  renderScreen('cockpit',true);
  setTimeout(()=>toast('ok','Cockpit zurückgesetzt','Ausgangsstand wiederhergestellt.'),250);
}
function deleteAccountFlow(){
  let go=true; try{ go=confirm('Konto und alle lokal gespeicherten Daten endgültig löschen?'); }catch(e){}
  if(!go) return;
  wipeAll(); closeMorphInstant();
  if(currentScreen==='login') renderScreen('login',true); else nav('login');
  setTimeout(()=>toast('info','Alle Daten gelöscht','Du kannst jederzeit ein neues Konto anlegen.'),300);
}
function changeClassFlow(){ closeMorphInstant(); nav('klasse'); }
function toggleCalm(){
  const p=getProfile(); if(!p) return;
  const now=!calmMode(); p.calm=now; saveProfile(p);
  if(now){ FX.stop(); } else { FX.start(); }
  closeMorphInstant();
  renderScreen('cockpit',true);   /* re-wired Tilt/Reveal je nach Modus */
  haptic(now?'block':'confirm');
  setTimeout(()=>toast('info',now?'Ruhiger Modus an':'Volle Effekte an',now?'Partikel & 3D-Neigung sind reduziert.':'Partikel-Hintergrund & 3D-Neigung aktiv.'),320);
}

/* ---------- Dokument-Scan (Kamera/Datei) ---------- */
let pendingDoc=null;
function startScan(key){ pendingDoc=key; const inp=el('docInput'); if(inp){ inp.value=''; inp.click(); } }
function makeThumb(dataURL,size,cb){ try{ const img=new Image(); img.onload=()=>{ try{ const sc=size/Math.max(img.width,img.height); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.72)); }catch(e){ cb(dataURL); } }; img.onerror=()=>cb(dataURL); img.src=dataURL; }catch(e){ cb(dataURL); } }
function onDocFile(file){
  if(!file||!pendingDoc||!state) return; const key=pendingDoc; pendingDoc=null;
  const labels={sehtest:'Sehtest',ersteHilfe:'Erste-Hilfe-Kurs',passbild:'Passbild'};
  const reader=new FileReader();
  reader.onload=()=>{ makeThumb(reader.result,90,(thumb)=>{
    state.dokumente[key].thumb=thumb; state.dokumente[key].status='pruefung'; saveState(); refreshDocs(); refreshReady();
    toast('info',labels[key]+' wird geprüft','Scan im Büro-Eingang …');
    setTimeout(()=>{ if(!state||state.dokumente[key].status!=='pruefung') return; state.dokumente[key].status='verifiziert'; saveState(); haptic('confirm'); refreshDocs(); refreshReady(); toast('ok',labels[key]+' verifiziert','Dokument amtlich anerkannt.'); },1700);
  }); };
  reader.onerror=()=>toast('block','Scan fehlgeschlagen','Bitte erneut versuchen.');
  reader.readAsDataURL(file);
}

/* ---------- Ripple ---------- */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('.btn:not(:disabled),.slot-chip,.avail-cell,.exam-opt,.icon-btn,.hot-item,.ready-btn.active,.pill.pending,.class-tile,.seg-btn,.fchip,button.tl-row,.besitz-tile:not(.disabled)'); if(!t) return;
  const rect=t.getBoundingClientRect(), s=Math.max(rect.width,rect.height); const rip=document.createElement('span'); rip.className='ripple';
  rip.style.width=rip.style.height=s+'px'; rip.style.left=(e.clientX-rect.left-s/2)+'px'; rip.style.top=(e.clientY-rect.top-s/2)+'px';
  t.appendChild(rip); setTimeout(()=>rip.remove(),650);
},{passive:true});

/* ---------- Event-Delegation ---------- */
document.addEventListener('click',e=>{
  const trg=e.target.closest('[data-action]'); if(!trg) return; const a=trg.getAttribute('data-action');
  switch(a){
    case 'toggle-pass': togglePassVisibility(trg); break;
    case 'auth-reset': deleteAccountFlow(); break;
    case 'klasse-pick': pickKlasse(trg); break;
    case 'besitz-pick': pickBesitz(trg); break;
    case 'klasse-back': klasseBack(); break;
    case 'klasse-continue': klasseContinue(); break;
    case 'theme': handleTheme(trg.getAttribute('data-id'),trg); break;
    case 'theme-list': openMorph(trg,themeListSheetHTML()); break;
    case 'theme-detail': openThemeDetail(trg.getAttribute('data-id')); break;
    case 'theme-list-swap': morphSwap(themeListSheetHTML()); break;
    case 'theory-filter': setTheoryFilter(trg.getAttribute('data-f')); break;
    case 'confirm-booking': confirmBooking(trg.getAttribute('data-id'),trg); break;
    case 'close-morph': closeMorph(); break;
    case 'scan': startScan(trg.getAttribute('data-doc')); break;
    case 'book-sim': openMorph(trg,simSheetHTML()); break;
    case 'sim-pick': pickSimSlot(trg); break;
    case 'confirm-sim': confirmSim(trg); break;
    case 'exam-open': openMorph(trg,examSheetHTML()); break;
    case 'exam-pick': pickExam(trg); break;
    case 'confirm-exam': confirmExam(trg); break;
    case 'exam-pass': passExam(trg); break;
    case 'avail': toggleAvail(trg); break;
    case 'request-lesson': requestLesson(trg); break;
    case 'focus-hot': focusHotspot(parseInt(trg.getAttribute('data-idx'),10)); break;
    case 'unlock-hotspots': openUnlock(trg); break;
    case 'confirm-unlock': confirmUnlock(trg); break;
    case 'ready-go': readyGo(trg); break;
    case 'notifs': openMorph(trg,notifSheetHTML()); break;
    case 'profile': openMorph(trg,profileSheetHTML()); break;
    case 'history-tab': setHistoryTab(trg.getAttribute('data-tab')); break;
    case 'history-toggle': toggleHistory(); break;
    case 'change-class': changeClassFlow(); break;
    case 'toggle-calm': toggleCalm(); break;
    case 'logout': logout(); break;
    case 'delete-account': deleteAccountFlow(); break;
    case 'reset-training': resetTraining(); break;
  }
});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  if((e.key==='Enter'||e.key===' ')&&ae&&ae.classList){
    if(ae.classList.contains('theme-tile')){ e.preventDefault(); handleTheme(ae.getAttribute('data-id'),ae); }
    else if(ae.classList.contains('avail-cell')){ e.preventDefault(); toggleAvail(ae); }
  }
  if(e.key==='Enter'&&ae&&ae.id==='unlockCode'){ e.preventDefault(); confirmUnlock(document.querySelector('#morphInner [data-action="confirm-unlock"]')); }
  if(e.key==='Escape'&&morphOpen) closeMorph();
});
window.addEventListener('resize',()=>{ if(mapInstance) mapInstance.invalidateSize(); });

/* ---------- Start ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  LEGACY_KEYS.forEach(k=>Store.del(k));
  try{ LEGACY_KEYS.forEach(k=>sessionStorage.removeItem(k)); }catch(e){}
  const mc=document.querySelector('.morph-close'); if(mc) mc.innerHTML=ic('x');
  bootAuth();
  FX.init();
  initScrollProgress();
  const inp=el('docInput'); if(inp) inp.addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; onDocFile(f); });
  if(!location.hash){ navReplace(defaultTarget()); }
  route();
  setTimeout(()=>{ if(!currentScreen) route(); },60);
});
</script>
</body>
</html>
