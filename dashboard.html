<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahrschul-Zentrale · Admin</title>
<style>
/* ── Design-Tokens ─────────────────────────────────────────────────── */
:root{
  --bg:#0B0F1E; --surface:#131931; --surface2:#1A2140; --surface3:#222A52;
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.14);
  --ink:#F1F5F9; --ink2:#A5B0C6; --ink3:#6B7694;
  --accent:#6366F1; --accent2:#818CF8;
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; --info:#3B82F6; --neutral:#64748B;
  --r:12px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit}

/* ── Header ────────────────────────────────────────────────────────── */
header{
  flex-shrink:0; height:60px; padding:0 20px;
  display:flex; align-items:center; gap:16px;
  background:var(--surface); border-bottom:1px solid var(--border);
}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#6366F1,#4F46E5);
  display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.brand b{font-size:15px;display:block}
.brand span{font-size:11px;color:var(--ink3)}
.kpis{margin-left:auto;display:flex;gap:10px}
.kpi{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
  padding:6px 14px;text-align:right;min-width:96px}
.kpi b{font-size:16px;display:block;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  color:var(--ok);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);
  border-radius:99px;padding:3px 10px}
.live-pill.off{color:var(--ink3);background:var(--surface2);border-color:var(--border)}
.live-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.live-pill.off .live-dot{animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── Toolbar ───────────────────────────────────────────────────────── */
.toolbar{
  flex-shrink:0; padding:10px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:rgba(19,25,49,.6); border-bottom:1px solid var(--border);
}
.search{position:relative;flex:1;min-width:200px;max-width:340px}
.search input{
  width:100%; padding:8px 12px 8px 34px; border-radius:9px;
  background:var(--surface2); border:1px solid var(--border); color:var(--ink); outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
select{
  padding:8px 10px;border-radius:9px;background:var(--surface2);
  border:1px solid var(--border);color:var(--ink);outline:none;cursor:pointer;
}
.chip{
  padding:7px 13px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface2);color:var(--ink2);font-size:12.5px;font-weight:600;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-add{
  margin-left:auto;padding:8px 16px;border-radius:9px;font-weight:700;
  background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff;
}
.btn-add:hover{filter:brightness(1.12)}

/* ── Hauptlayout ───────────────────────────────────────────────────── */
.main{flex:1;display:grid;grid-template-columns:minmax(340px,430px) 1fr;min-height:0}
.list-col{border-right:1px solid var(--border);overflow-y:auto;padding:12px}
.detail-col{overflow-y:auto;padding:18px 22px}
@media(max-width:860px){
  .main{grid-template-columns:1fr}
  .detail-col{display:none}
  .main.show-detail .list-col{display:none}
  .main.show-detail .detail-col{display:block}
}
.back-btn{display:none;margin-bottom:10px;color:var(--accent2);font-weight:600}
@media(max-width:860px){.back-btn{display:inline-block}}

/* ── Schüler-Karten ────────────────────────────────────────────────── */
.count-line{font-size:12px;color:var(--ink3);padding:2px 6px 10px}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r);
  padding:12px 14px; margin-bottom:8px; cursor:pointer; transition:border-color .12s;
}
.card:hover{border-color:var(--border2)}
.card.sel{border-color:var(--accent);background:var(--surface2)}
.card-top{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.card-name{font-weight:700}
.card-meta{font-size:11.5px;color:var(--ink3)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:auto}
.badge.live{color:var(--ok);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3)}
.badge.ready{color:#0B0F1E;background:var(--ok)}
.badge.crit{color:var(--bad);background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)}
.mini-rows{margin-top:9px;display:grid;gap:5px}
.mini-row{display:grid;grid-template-columns:52px 1fr 64px;gap:8px;align-items:center;font-size:11px}
.mini-row .lbl{color:var(--ink3);font-weight:600}
.mini-row .val{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent2)}
.card-flags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600}
.flag.bad{color:var(--bad);background:rgba(239,68,68,.1)}
.flag.warn{color:var(--warn);background:rgba(245,158,11,.1)}
.flag.ok{color:var(--ok);background:rgba(16,185,129,.1)}
.no-result{color:var(--ink3);text-align:center;padding:40px 10px}

/* ── Detail ────────────────────────────────────────────────────────── */
.d-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);gap:8px}
.d-empty .big{font-size:34px}
.d-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.d-avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#6366F1,#4F46E5);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff}
.d-name{font-size:19px;font-weight:800}
.d-sub{font-size:12.5px;color:var(--ink3)}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);margin-bottom:12px;
  display:flex;align-items:center;gap:7px}
.prog-row{margin-bottom:12px}
.prog-row:last-child{margin-bottom:0}
.prog-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.prog-top .l{color:var(--ink2);font-weight:600}
.prog-top .v{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.bar.big{height:8px}
.bar i.full{background:var(--ok)}
.step-btns{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.step-btns button{width:20px;height:20px;border-radius:6px;background:var(--surface3);
  font-size:12px;line-height:1;color:var(--ink2)}
.step-btns button:hover{background:var(--accent);color:#fff}
.status-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.status-chip.ok{color:var(--ok);background:rgba(16,185,129,.12)}
.status-chip.warn{color:var(--warn);background:rgba(245,158,11,.12)}
.status-chip.bad{color:var(--bad);background:rgba(239,68,68,.12)}
.status-chip.info{color:var(--info);background:rgba(59,130,246,.12)}
.doc-row,.fin-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.doc-row:last-child,.fin-row:last-child{border-bottom:none}
.doc-name{font-weight:600;flex:1}
.mini-btn{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:7px;
  background:var(--surface3);color:var(--ink2)}
.mini-btn:hover{background:var(--accent);color:#fff}
.mini-btn.ok:hover{background:var(--ok)}
.fin-label{flex:1;color:var(--ink2)}
.fin-amount{font-weight:700;font-variant-numeric:tabular-nums}
.fin-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;
  border-top:1px solid var(--border2);font-weight:800}
.fin-add{display:flex;gap:6px;margin-top:10px}
.fin-add input{flex:1;min-width:0;padding:6px 9px;border-radius:7px;background:var(--surface2);
  border:1px solid var(--border);color:var(--ink);outline:none;font-size:12.5px}
.check-item{display:flex;gap:9px;padding:6px 0;font-size:13px;align-items:baseline}
.check-item .mark{font-weight:800;flex-shrink:0}
.check-item.done .mark{color:var(--ok)} .check-item.done{color:var(--ink3);text-decoration:line-through}
.check-item.open .mark{color:var(--warn)}
.ready-banner{margin-top:10px;padding:10px 12px;border-radius:9px;font-weight:700;font-size:13px;text-align:center}
.ready-banner.yes{color:var(--ok);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3)}
.ready-banner.no{color:var(--warn);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25)}
.danger-zone{margin-top:14px;text-align:right}
.danger-zone button{color:var(--bad);font-size:12px;opacity:.75}
.danger-zone button:hover{opacity:1}

/* ── Modal & Toast ─────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(4,6,14,.7);display:none;
  align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;
  width:100%;max-width:420px;padding:20px}
.modal h2{font-size:16px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink3);margin-bottom:5px}
.field input,.field select{width:100%;padding:9px 11px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--border);color:var(--ink);outline:none}
.field input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-ghost{padding:9px 14px;border-radius:9px;color:var(--ink2);border:1px solid var(--border)}
.btn-primary{padding:9px 18px;border-radius:9px;font-weight:700;
  background:linear-gradient(135deg,#6366F1,#4F46E5);color:#fff}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface3);border:1px solid var(--border2);border-radius:10px;
  padding:10px 18px;font-weight:600;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:9px}
</style>
</head>
<body>

<header>
  <div class="logo">🚗</div>
  <div class="brand"><b>Fahrschul-Zentrale</b><span>Admin · Schüler-Verwaltung</span></div>
  <span class="live-pill off" id="livePill"><span class="live-dot"></span><span id="livePillText">Keine App verbunden</span></span>
  <div class="kpis">
    <div class="kpi"><b id="kpiCount">0</b><span>Schüler</span></div>
    <div class="kpi warn"><b id="kpiOpen">0 €</b><span>Offen</span></div>
    <div class="kpi ok"><b id="kpiReady">0</b><span>Prüfungsreif</span></div>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <span class="ic">🔍</span>
    <input id="searchInput" type="text" placeholder="Schüler suchen (Name, Klasse) …" oninput="render()">
  </div>
  <select id="sortSel" onchange="render()">
    <option value="prio">Sortierung: Priorität</option>
    <option value="name">Name A–Z</option>
    <option value="klasse">Klasse</option>
    <option value="theorie">Theorie-Fortschritt</option>
    <option value="praxis">Praxis-Fortschritt</option>
    <option value="offen">Offener Betrag</option>
  </select>
  <button class="chip active" data-f="all" onclick="setFilter('all')">Alle</button>
  <button class="chip" data-f="crit" onclick="setFilter('crit')">⛔ Kritisch</button>
  <button class="chip" data-f="docs" onclick="setFilter('docs')">📂 Nachweise fehlen</button>
  <button class="chip" data-f="ready" onclick="setFilter('ready')">🏁 Prüfungsreif</button>
  <button class="chip" data-f="live" onclick="setFilter('live')">🟢 Live-App</button>
  <button class="btn-add" onclick="openAdd()">＋ Neuer Schüler</button>
</div>

<div class="main" id="mainGrid">
  <div class="list-col">
    <div class="count-line" id="countLine"></div>
    <div id="studentList"></div>
  </div>
  <div class="detail-col" id="detailCol">
    <div class="d-empty"><span class="big">📂</span><b>Kein Schüler ausgewählt</b>
      <span>Wähle links einen Schüler, um Theorie, Praxis, Zahlungen und Nachweise zu sehen.</span></div>
  </div>
</div>

<div class="overlay" id="addOverlay">
  <div class="modal">
    <h2>Neuen Schüler anlegen</h2>
    <div class="field"><label>Name</label><input id="fName" type="text" placeholder="Vor- und Nachname"></div>
    <div class="field"><label>Geburtsdatum</label><input id="fGeb" type="date"></div>
    <div class="field"><label>Führerscheinklasse</label>
      <select id="fKlasse">
        <option value="B">B · Pkw</option><option value="B197">B197 · Pkw Automatik</option>
        <option value="BE">BE · Pkw + Anhänger</option><option value="A">A · Motorrad</option>
        <option value="A2">A2 · Motorrad 35 kW</option><option value="A1">A1 · Leichtkraftrad</option>
        <option value="AM">AM · Roller/Moped</option><option value="C">C · Lkw</option>
        <option value="CE">CE · Lastzug</option>
      </select></div>
    <div class="field"><label>Ausbildungsart</label>
      <select id="fBesitz"><option value="erst">Erst-Erwerb</option><option value="erweiterung">Erweiterung (Vorbesitz)</option></select></div>
    <div class="field"><label>Grundbetrag offen (€)</label><input id="fGrund" type="number" min="0" step="10" value="450"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAdd()">Abbrechen</button>
      <button class="btn-primary" onclick="saveAdd()">Anlegen</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   1 · Klassen-Regeln (gespiegelt aus der Schüler-App / FahrschAusbO)
════════════════════════════════════════════════════════════════════ */
const CLASS_RULES={
  B:   {zusatz:2, sonder:{ueberland:5,autobahn:4,nacht:3}, tp:true},
  B197:{zusatz:2, sonder:{ueberland:5,autobahn:4,nacht:3}, tp:true},
  BE:  {zusatz:0, sonder:{ueberland:3,autobahn:1,nacht:1}, tp:false, keinTheorie:true},
  A:   {zusatz:4, sonder:{ueberland:5,autobahn:4,nacht:3}, tp:true},
  A2:  {zusatz:4, sonder:{ueberland:5,autobahn:4,nacht:3}, tp:true},
  A1:  {zusatz:4, sonder:{ueberland:5,autobahn:4,nacht:3}, tp:true},
  AM:  {zusatz:2, sonder:{ueberland:0,autobahn:0,nacht:0}, tp:true},
  C:   {zusatz:10,sonder:{ueberland:5,autobahn:2,nacht:3}, tp:true},
  CE:  {zusatz:4, sonder:{ueberland:5,autobahn:2,nacht:3}, tp:true}
};
function theorieGesamt(klasse,besitz){
  const r=CLASS_RULES[klasse]||CLASS_RULES.B;
  if(r.keinTheorie) return 0;
  return (besitz==='erweiterung'?6:12)+r.zusatz;
}

/* ════════════════════════════════════════════════════════════════════
   2 · Daten: Verwaltungs-Kartei (localStorage) + Live-Schüler aus App
════════════════════════════════════════════════════════════════════ */
const ADMIN_KEY='fk_admin_students_v1';
const STATE_KEY='fk_state_v3';       /* geteilt mit app.html */
const PROFILE_KEY='fk_profile_v2';   /* geteilt mit app.html */
const LIVE_ID='LIVE-APP';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtEuro(n){try{return n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});}catch(e){return n.toFixed(2).replace('.',',')+' €';}}
function initials(name){const p=(name||'').trim().split(/\s+/).filter(Boolean);
  return p.length?((p[0][0]||'')+(p.length>1?p[p.length-1][0]:p[0][1]||'')).toUpperCase():'–';}

function seedStudents(){
  const mk=(id,name,geb,klasse,besitz,ov)=>Object.assign({
    id,name,geb,klasse,besitz,live:false,lastActivity:3,
    theorie:{besucht:0,gesamt:theorieGesamt(klasse,besitz)},
    theoriePruefung:{bestanden:false},
    uebungsstunden:0, simulator:{ist:0,soll:6},
    sonderfahrten:{
      ueberland:{ist:0,soll:CLASS_RULES[klasse].sonder.ueberland},
      autobahn:{ist:0,soll:CLASS_RULES[klasse].sonder.autobahn},
      nacht:{ist:0,soll:CLASS_RULES[klasse].sonder.nacht}},
    dokumente:{sehtest:'ausstehend',ersteHilfe:'ausstehend',passbild:'ausstehend'},
    finanzen:{bezahlt:0,posten:[]},
    praxisPruefung:'offen'
  },ov);
  return [
    mk('S-001','Tobias Maier','2005-05-12','B','erst',{lastActivity:14,
      theorie:{besucht:3,gesamt:14},uebungsstunden:4,simulator:{ist:1,soll:6},
      finanzen:{bezahlt:200,posten:[{label:'Grundbetrag (Rest)',betrag:250},{label:'Fahrstunden Juni (4 × 45 min)',betrag:160}]}}),
    mk('S-002','Lisa Baumann','2001-11-28','B197','erst',{lastActivity:2,
      theorie:{besucht:11,gesamt:14},uebungsstunden:16,simulator:{ist:4,soll:6},
      sonderfahrten:{ueberland:{ist:2,soll:5},autobahn:{ist:1,soll:4},nacht:{ist:0,soll:3}},
      dokumente:{sehtest:'verifiziert',ersteHilfe:'pruefung',passbild:'verifiziert'},
      finanzen:{bezahlt:1450,posten:[{label:'Fahrstunden Juni (2 × 90 min)',betrag:180}]}}),
    mk('S-003','Marco Schulze','1998-08-03','C','erweiterung',{lastActivity:1,
      theorie:{besucht:16,gesamt:16},theoriePruefung:{bestanden:true},
      uebungsstunden:24,simulator:{ist:6,soll:6},
      sonderfahrten:{ueberland:{ist:5,soll:5},autobahn:{ist:2,soll:2},nacht:{ist:3,soll:3}},
      dokumente:{sehtest:'verifiziert',ersteHilfe:'verifiziert',passbild:'verifiziert'},
      finanzen:{bezahlt:2890,posten:[]},praxisPruefung:'suchtTermin'}),
    mk('S-004','Ayşe Demir','2007-02-19','A1','erst',{lastActivity:5,
      theorie:{besucht:8,gesamt:16},uebungsstunden:10,simulator:{ist:2,soll:4},
      sonderfahrten:{ueberland:{ist:1,soll:5},autobahn:{ist:0,soll:4},nacht:{ist:0,soll:3}},
      dokumente:{sehtest:'verifiziert',ersteHilfe:'ausstehend',passbild:'pruefung'},
      finanzen:{bezahlt:780,posten:[{label:'Fahrstunden Mai (3 × 45 min)',betrag:135}]}}),
    mk('S-005','Jan Hoffmann','2004-09-30','BE','erweiterung',{lastActivity:8,
      theorie:{besucht:0,gesamt:0},theoriePruefung:{bestanden:true},
      uebungsstunden:6,simulator:{ist:0,soll:0},
      sonderfahrten:{ueberland:{ist:2,soll:3},autobahn:{ist:1,soll:1},nacht:{ist:0,soll:1}},
      dokumente:{sehtest:'verifiziert',ersteHilfe:'verifiziert',passbild:'ausstehend'},
      finanzen:{bezahlt:520,posten:[{label:'Sonderfahrt Überland',betrag:110}]}})
  ];
}
function loadAdmin(){
  try{const raw=localStorage.getItem(ADMIN_KEY);if(raw){const a=JSON.parse(raw);if(Array.isArray(a))return a;}}catch(e){}
  const s=seedStudents(); saveAdmin(s); return s;
}
function saveAdmin(list){try{localStorage.setItem(ADMIN_KEY,JSON.stringify(list||students.filter(s=>!s.live)));}catch(e){}}

/* Live-Schüler: Profil + Ausbildungsstand direkt aus der Schüler-App */
function readLiveStudent(){
  let profile=null,st=null;
  try{profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null');}catch(e){}
  try{st=JSON.parse(localStorage.getItem(STATE_KEY)||'null');}catch(e){}
  if(!profile||!profile.name||!st||st.version!==3) return null;
  return {
    id:LIVE_ID, live:true, name:profile.name, geb:profile.geburtstag||'', lastActivity:0,
    klasse:st.klasse, besitz:st.besitz,
    theorie:{besucht:st.theorie.besucht,gesamt:st.theorie.gesamt},
    theoriePruefung:{bestanden:!!(st.theoriePruefung&&st.theoriePruefung.bestanden)},
    uebungsstunden:st.uebungsstunden||0,
    simulator:{ist:st.simulator?st.simulator.ist:0,soll:st.simulator?st.simulator.soll:0},
    sonderfahrten:{
      ueberland:{ist:st.sonderfahrten.ueberland.ist,soll:st.sonderfahrten.ueberland.soll},
      autobahn:{ist:st.sonderfahrten.autobahn.ist,soll:st.sonderfahrten.autobahn.soll},
      nacht:{ist:st.sonderfahrten.nacht.ist,soll:st.sonderfahrten.nacht.soll}},
    dokumente:{
      sehtest:st.dokumente.sehtest.status,
      ersteHilfe:st.dokumente.ersteHilfe.status,
      passbild:st.dokumente.passbild.status},
    finanzen:{bezahlt:null,posten:(st.finanzen&&st.finanzen.posten||[]).map(p=>({label:p.label,betrag:p.betrag}))},
    praxisPruefung:'offen'
  };
}
/* Änderungen der Zentrale am Live-Schüler zurück in den App-State schreiben */
function writeLive(mut){
  let st=null; try{st=JSON.parse(localStorage.getItem(STATE_KEY)||'null');}catch(e){}
  if(!st||st.version!==3) return false;
  mut(st);
  try{localStorage.setItem(STATE_KEY,JSON.stringify(st));}catch(e){return false;}
  try{if(bc)bc.postMessage({src:'admin',key:STATE_KEY});}catch(e){}
  try{localStorage.setItem('fk_sync_ping',String(Date.now()));}catch(e){}
  return true;
}

/* ════════════════════════════════════════════════════════════════════
   3 · Abgeleitete Werte
════════════════════════════════════════════════════════════════════ */
function offen(s){return s.finanzen.posten.reduce((a,p)=>a+p.betrag,0);}
function theorieP(s){return s.theorie.gesamt?Math.min(1,s.theorie.besucht/s.theorie.gesamt):1;}
function praxisP(s){
  const sf=s.sonderfahrten;
  const ist=sf.ueberland.ist+sf.autobahn.ist+sf.nacht.ist+(s.simulator.ist||0);
  const soll=sf.ueberland.soll+sf.autobahn.soll+sf.nacht.soll+(s.simulator.soll||0);
  return soll?Math.min(1,ist/soll):1;
}
const DOC_LABELS={sehtest:'Sehtest',ersteHilfe:'Erste-Hilfe-Kurs',passbild:'Passbild'};
function missingDocs(s){return Object.keys(DOC_LABELS).filter(k=>s.dokumente[k]!=='verifiziert');}
function checklist(s){
  const items=[]; const push=(done,txt)=>items.push({done,txt});
  Object.keys(DOC_LABELS).forEach(k=>{
    const st=s.dokumente[k];
    push(st==='verifiziert',DOC_LABELS[k]+(st==='pruefung'?' (eingereicht, prüfen!)':''));
  });
  if(s.theorie.gesamt>0){
    push(s.theorie.besucht>=s.theorie.gesamt,`Theorie ${s.theorie.besucht}/${s.theorie.gesamt} Doppelstunden`);
    push(s.theoriePruefung.bestanden,'Theorieprüfung bestanden');
  }
  const sf=s.sonderfahrten;
  [['ueberland','Überlandfahrten'],['autobahn','Autobahnfahrten'],['nacht','Nachtfahrten']].forEach(([k,l])=>{
    if(sf[k].soll>0) push(sf[k].ist>=sf[k].soll,`${l} ${sf[k].ist}/${sf[k].soll}`);
  });
  if(s.simulator.soll>0) push(s.simulator.ist>=s.simulator.soll,`Simulator ${s.simulator.ist}/${s.simulator.soll}`);
  push(offen(s)<=0,offen(s)>0?`Offener Saldo ${fmtEuro(offen(s))} ausgleichen`:'Konto ausgeglichen');
  return items;
}
function isReady(s){return checklist(s).every(i=>i.done);}
function isCritical(s){return offen(s)>=100||missingDocs(s).length===3;}
function prioScore(s){
  let p=0;
  if(offen(s)>=100)p+=50; else if(offen(s)>0)p+=20;
  p+=missingDocs(s).length*12;
  p+=(s.lastActivity||0)*1.5;
  if(isReady(s))p-=30;
  return p;
}

/* ════════════════════════════════════════════════════════════════════
   4 · Rendering
════════════════════════════════════════════════════════════════════ */
let students=loadAdmin();
let selectedId=null, activeFilter='all';
let bc=null; try{bc=new BroadcastChannel('fk_sync_v1');}catch(e){}

function allStudents(){
  const live=readLiveStudent();
  return live?[live].concat(students):students.slice();
}
function byId(id){return allStudents().find(s=>s.id===id)||null;}

function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));
  render();
}

function filteredSorted(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  let list=allStudents().filter(s=>{
    if(q&&!(s.name.toLowerCase().includes(q)||s.klasse.toLowerCase().includes(q))) return false;
    if(activeFilter==='crit')  return isCritical(s);
    if(activeFilter==='docs')  return missingDocs(s).length>0;
    if(activeFilter==='ready') return isReady(s);
    if(activeFilter==='live')  return !!s.live;
    return true;
  });
  const sort=document.getElementById('sortSel').value;
  const cmp={
    prio:(a,b)=>prioScore(b)-prioScore(a),
    name:(a,b)=>a.name.localeCompare(b.name,'de'),
    klasse:(a,b)=>a.klasse.localeCompare(b.klasse)||a.name.localeCompare(b.name,'de'),
    theorie:(a,b)=>theorieP(b)-theorieP(a),
    praxis:(a,b)=>praxisP(b)-praxisP(a),
    offen:(a,b)=>offen(b)-offen(a)
  }[sort]||((a,b)=>0);
  list.sort((a,b)=>{ if(a.live!==b.live) return a.live?-1:1; return cmp(a,b); });
  return list;
}

function render(){
  const all=allStudents(), list=filteredSorted();
  /* KPIs + Live-Pille */
  document.getElementById('kpiCount').textContent=all.length;
  document.getElementById('kpiOpen').textContent=fmtEuro(all.reduce((a,s)=>a+offen(s),0));
  document.getElementById('kpiReady').textContent=all.filter(isReady).length;
  const live=all.find(s=>s.live);
  const pill=document.getElementById('livePill');
  pill.classList.toggle('off',!live);
  document.getElementById('livePillText').textContent=live?`Live: ${live.name} (App verbunden)`:'Keine App verbunden';
  /* Liste */
  document.getElementById('countLine').textContent=`${list.length} von ${all.length} Schülern`;
  const el=document.getElementById('studentList');
  if(!list.length){el.innerHTML='<div class="no-result">Keine Schüler in dieser Auswahl.</div>';}
  else el.innerHTML=list.map(s=>{
    const tp=theorieP(s),pp=praxisP(s),off=offen(s),docs=missingDocs(s);
    let badge='';
    if(s.live)badge='<span class="badge live">● LIVE</span>';
    else if(isReady(s))badge='<span class="badge ready">PRÜFUNGSREIF</span>';
    else if(isCritical(s))badge='<span class="badge crit">KRITISCH</span>';
    return `<div class="card${s.id===selectedId?' sel':''}" onclick="select('${s.id}')">
      <div class="card-top">
        <div class="avatar">${initials(s.name)}</div>
        <div><div class="card-name">${esc(s.name)}</div>
          <div class="card-meta">Klasse ${esc(s.klasse)} · ${s.besitz==='erweiterung'?'Erweiterung':'Erst-Erwerb'}</div></div>
        ${badge}
      </div>
      <div class="mini-rows">
        ${s.theorie.gesamt>0?`<div class="mini-row"><span class="lbl">Theorie</span>
          <div class="bar"><i class="${tp>=1?'full':''}" style="width:${Math.round(tp*100)}%"></i></div>
          <span class="val">${s.theorie.besucht}/${s.theorie.gesamt}</span></div>`:''}
        <div class="mini-row"><span class="lbl">Praxis</span>
          <div class="bar"><i class="${pp>=1?'full':''}" style="width:${Math.round(pp*100)}%"></i></div>
          <span class="val">${Math.round(pp*100)} %</span></div>
      </div>
      <div class="card-flags">
        ${off>0?`<span class="flag ${off>=100?'bad':'warn'}">💶 ${fmtEuro(off)} offen</span>`:'<span class="flag ok">✓ bezahlt</span>'}
        ${docs.length?`<span class="flag warn">📂 ${docs.length} Nachweis${docs.length>1?'e':''} offen</span>`:'<span class="flag ok">✓ Nachweise</span>'}
      </div>
    </div>`;}).join('');
  renderDetail();
}

function select(id){
  selectedId=id;
  document.getElementById('mainGrid').classList.add('show-detail');
  render();
}
function backToList(){document.getElementById('mainGrid').classList.remove('show-detail');}

function docChip(status){
  if(status==='verifiziert')return '<span class="status-chip ok">✓ Verifiziert</span>';
  if(status==='pruefung')   return '<span class="status-chip info">📥 Eingereicht</span>';
  return '<span class="status-chip bad">✕ Fehlt</span>';
}

function renderDetail(){
  const el=document.getElementById('detailCol');
  const s=selectedId?byId(selectedId):null;
  if(!s){
    el.innerHTML=`<div class="d-empty"><span class="big">📂</span><b>Kein Schüler ausgewählt</b>
      <span>Wähle links einen Schüler, um Theorie, Praxis, Zahlungen und Nachweise zu sehen.</span></div>`;
    return;
  }
  const sf=s.sonderfahrten, off=offen(s), items=checklist(s), openItems=items.filter(i=>!i.done);
  const stepper=(fn)=>`<span class="step-btns"><button onclick="event.stopPropagation();adjust('${s.id}','${fn}',-1)">−</button><button onclick="event.stopPropagation();adjust('${s.id}','${fn}',1)">＋</button></span>`;
  const prog=(label,ist,soll,fn)=>`<div class="prog-row">
    <div class="prog-top"><span class="l">${label}${fn?stepper(fn):''}</span><span class="v">${ist}/${soll}</span></div>
    <div class="bar big"><i class="${soll>0&&ist>=soll?'full':''}" style="width:${soll?Math.min(100,Math.round(ist/soll*100)):100}%"></i></div>
  </div>`;
  el.innerHTML=`
  <button class="back-btn" onclick="backToList()">← Zur Liste</button>
  <div class="d-head">
    <div class="d-avatar">${initials(s.name)}</div>
    <div>
      <div class="d-name">${esc(s.name)} ${s.live?'<span class="badge live">● LIVE aus Schüler-App</span>':''}</div>
      <div class="d-sub">Klasse ${esc(s.klasse)} · ${s.besitz==='erweiterung'?'Erweiterung':'Erst-Erwerb'}${s.geb?' · geb. '+esc(s.geb):''}${s.live?' · Änderungen erscheinen sofort in der App':''}</div>
    </div>
  </div>
  <div class="d-grid">

    <div class="panel"><h3>📖 Theorie</h3>
      ${s.theorie.gesamt>0
        ? prog('Doppelstunden besucht',s.theorie.besucht,s.theorie.gesamt,'theorie')
          +`<div style="margin-top:10px;display:flex;align-items:center;gap:10px">
             <span style="color:var(--ink2);font-weight:600;flex:1">Theorieprüfung</span>
             ${s.theoriePruefung.bestanden?'<span class="status-chip ok">🏆 Bestanden</span>':'<span class="status-chip warn">Offen</span>'}
             <button class="mini-btn ok" onclick="toggleTP('${s.id}')">${s.theoriePruefung.bestanden?'Zurücksetzen':'Als bestanden markieren'}</button>
           </div>`
        : '<div style="color:var(--ink3)">Klasse '+esc(s.klasse)+' – keine Theorieprüfung erforderlich (rein praktische Ausbildung).</div>'}
    </div>

    <div class="panel"><h3>🚗 Praxis</h3>
      ${prog('Übungsfahrstunden (à 45 min)',s.uebungsstunden,Math.max(s.uebungsstunden,20),'uebung')}
      ${s.simulator.soll>0?prog('Simulator-Einheiten',s.simulator.ist,s.simulator.soll,'sim'):''}
      ${sf.ueberland.soll>0?prog('Sonderfahrt Überland',sf.ueberland.ist,sf.ueberland.soll,'ueberland'):''}
      ${sf.autobahn.soll>0?prog('Sonderfahrt Autobahn',sf.autobahn.ist,sf.autobahn.soll,'autobahn'):''}
      ${sf.nacht.soll>0?prog('Sonderfahrt Nacht',sf.nacht.ist,sf.nacht.soll,'nacht'):''}
    </div>

    <div class="panel"><h3>💶 Zahlungen</h3>
      ${s.finanzen.bezahlt!=null?`<div class="fin-row"><span class="fin-label">Bereits bezahlt</span><span class="fin-amount" style="color:var(--ok)">${fmtEuro(s.finanzen.bezahlt)}</span></div>`:''}
      ${s.finanzen.posten.length
        ? s.finanzen.posten.map((p,i)=>`<div class="fin-row">
            <span class="fin-label">${esc(p.label)}</span>
            <span class="fin-amount" style="color:var(--warn)">${fmtEuro(p.betrag)}</span>
            <button class="mini-btn ok" onclick="payItem('${s.id}',${i})">✓ Bezahlt</button>
          </div>`).join('')
        : '<div class="fin-row"><span class="fin-label">Keine offenen Posten 🎉</span></div>'}
      <div class="fin-total"><span>Offen gesamt</span><span style="color:${off>0?'var(--warn)':'var(--ok)'}">${fmtEuro(off)}</span></div>
      <div class="fin-add">
        <input id="finLabel" type="text" placeholder="Neuer Posten (z. B. Fahrstunden Juli)">
        <input id="finBetrag" type="number" min="1" step="5" placeholder="€" style="max-width:80px">
        <button class="mini-btn" onclick="addItem('${s.id}')">＋</button>
      </div>
    </div>

    <div class="panel"><h3>📂 Nachweise</h3>
      ${Object.keys(DOC_LABELS).map(k=>`<div class="doc-row">
        <span class="doc-name">${DOC_LABELS[k]}</span>
        ${docChip(s.dokumente[k])}
        ${s.dokumente[k]!=='verifiziert'
          ?`<button class="mini-btn ok" onclick="setDoc('${s.id}','${k}','verifiziert')">Verifizieren</button>`
          :`<button class="mini-btn" onclick="setDoc('${s.id}','${k}','ausstehend')">Zurücksetzen</button>`}
      </div>`).join('')}
    </div>

    <div class="panel" style="grid-column:1/-1"><h3>🏁 Prüfungs-Check – was fehlt noch?</h3>
      ${items.map(i=>`<div class="check-item ${i.done?'done':'open'}"><span class="mark">${i.done?'✓':'○'}</span><span>${esc(i.txt)}</span></div>`).join('')}
      <div class="ready-banner ${openItems.length?'no':'yes'}">
        ${openItems.length?`⏳ Noch ${openItems.length} Punkt${openItems.length>1?'e':''} offen bis zur Prüfungsreife`:'✅ PRÜFUNGSREIF – alle Voraussetzungen erfüllt!'}
      </div>
      ${s.live?'':`<div class="danger-zone"><button onclick="removeStudent('${s.id}')">Schüler löschen …</button></div>`}
    </div>
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   5 · Aktionen (schreiben in Kartei bzw. live in den App-State)
════════════════════════════════════════════════════════════════════ */
function persist(s){
  if(s.live) return; /* Live-Schüler wird über writeLive() gespeichert */
  const i=students.findIndex(x=>x.id===s.id);
  if(i>=0){students[i]=s; saveAdmin(students);}
}
function adjust(id,what,delta){
  const s=byId(id); if(!s)return;
  const clamp=(v,max)=>Math.max(0,max!=null?Math.min(max,v):v);
  if(what==='theorie') s.theorie.besucht=clamp(s.theorie.besucht+delta,s.theorie.gesamt);
  else if(what==='uebung') s.uebungsstunden=clamp(s.uebungsstunden+delta);
  else if(what==='sim') s.simulator.ist=clamp(s.simulator.ist+delta,s.simulator.soll);
  else s.sonderfahrten[what].ist=clamp(s.sonderfahrten[what].ist+delta,s.sonderfahrten[what].soll);
  if(s.live){
    writeLive(st=>{
      if(what==='theorie') st.theorie.besucht=s.theorie.besucht;
      else if(what==='uebung') st.uebungsstunden=s.uebungsstunden;
      else if(what==='sim') st.simulator.ist=s.simulator.ist;
      else st.sonderfahrten[what].ist=s.sonderfahrten[what].ist;
    });
  } else persist(s);
  render();
}
function toggleTP(id){
  const s=byId(id); if(!s)return;
  const v=!s.theoriePruefung.bestanden;
  if(s.live) writeLive(st=>{if(st.theoriePruefung)st.theoriePruefung.bestanden=v;});
  else {s.theoriePruefung.bestanden=v; persist(s);}
  toast(v?'🏆 Theorieprüfung als bestanden markiert':'Theorieprüfung zurückgesetzt');
  render();
}
function setDoc(id,key,status){
  const s=byId(id); if(!s)return;
  if(s.live) writeLive(st=>{st.dokumente[key].status=status; if(status==='ausstehend')st.dokumente[key].thumb=null;});
  else {s.dokumente[key]=status; persist(s);}
  toast(status==='verifiziert'?`✓ ${DOC_LABELS[key]} verifiziert`:`${DOC_LABELS[key]} zurückgesetzt`);
  render();
}
function payItem(id,idx){
  const s=byId(id); if(!s)return;
  const p=s.finanzen.posten[idx]; if(!p)return;
  if(s.live) writeLive(st=>{st.finanzen.posten.splice(idx,1);});
  else {s.finanzen.posten.splice(idx,1); s.finanzen.bezahlt=(s.finanzen.bezahlt||0)+p.betrag; persist(s);}
  toast(`💶 ${fmtEuro(p.betrag)} als bezahlt verbucht`);
  render();
}
function addItem(id){
  const s=byId(id); if(!s)return;
  const label=(document.getElementById('finLabel').value||'').trim();
  const betrag=parseFloat(document.getElementById('finBetrag').value);
  if(!label||!(betrag>0)){toast('⚠️ Bezeichnung und Betrag angeben');return;}
  if(s.live) writeLive(st=>{st.finanzen.posten.push({label,betrag});});
  else {s.finanzen.posten.push({label,betrag}); persist(s);}
  toast('Posten hinzugefügt');
  render();
}
function removeStudent(id){
  const s=byId(id); if(!s||s.live)return;
  if(!confirm(`„${s.name}" wirklich aus der Kartei löschen?`))return;
  students=students.filter(x=>x.id!==id);
  saveAdmin(students);
  if(selectedId===id)selectedId=null;
  toast('Schüler gelöscht');
  render();
}

/* Neuer Schüler */
function openAdd(){document.getElementById('addOverlay').classList.add('open');document.getElementById('fName').focus();}
function closeAdd(){document.getElementById('addOverlay').classList.remove('open');}
function saveAdd(){
  const name=(document.getElementById('fName').value||'').trim();
  if(!name){toast('⚠️ Bitte einen Namen eingeben');return;}
  const klasse=document.getElementById('fKlasse').value;
  const besitz=document.getElementById('fBesitz').value;
  const grund=parseFloat(document.getElementById('fGrund').value)||0;
  const r=CLASS_RULES[klasse];
  const s={
    id:'S-'+Date.now().toString(36).toUpperCase(),
    name, geb:document.getElementById('fGeb').value||'', klasse, besitz, live:false, lastActivity:0,
    theorie:{besucht:0,gesamt:theorieGesamt(klasse,besitz)},
    theoriePruefung:{bestanden:false},
    uebungsstunden:0, simulator:{ist:0,soll:r.keinTheorie?0:6},
    sonderfahrten:{
      ueberland:{ist:0,soll:r.sonder.ueberland},
      autobahn:{ist:0,soll:r.sonder.autobahn},
      nacht:{ist:0,soll:r.sonder.nacht}},
    dokumente:{sehtest:'ausstehend',ersteHilfe:'ausstehend',passbild:'ausstehend'},
    finanzen:{bezahlt:0,posten:grund>0?[{label:'Grundbetrag',betrag:grund}]:[]},
    praxisPruefung:'offen'
  };
  students.unshift(s); saveAdmin(students);
  closeAdd();
  document.getElementById('fName').value=''; document.getElementById('fGeb').value='';
  selectedId=s.id;
  toast(`✓ ${name} angelegt (Klasse ${klasse})`);
  render();
}

/* ════════════════════════════════════════════════════════════════════
   6 · Live-Sync: auf Änderungen aus der Schüler-App reagieren
════════════════════════════════════════════════════════════════════ */
if(bc) bc.onmessage=e=>{if(e.data&&e.data.src==='app')render();};
window.addEventListener('storage',e=>{
  if(e.key===STATE_KEY||e.key===PROFILE_KEY)render();
});
/* Fallback-Poll: nur neu zeichnen, wenn sich App-Daten wirklich geändert
   haben und gerade kein Eingabefeld benutzt wird. */
let lastSnap='';
function liveSnap(){try{return (localStorage.getItem(STATE_KEY)||'')+(localStorage.getItem(PROFILE_KEY)||'');}catch(e){return '';}}
lastSnap=liveSnap();
setInterval(()=>{
  if(document.visibilityState!=='visible')return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'))return;
  const snap=liveSnap();
  if(snap!==lastSnap){lastSnap=snap;render();}
},3000);

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2400);
}
document.getElementById('addOverlay').addEventListener('click',e=>{if(e.target.id==='addOverlay')closeAdd();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAdd();});

render();
</script>
