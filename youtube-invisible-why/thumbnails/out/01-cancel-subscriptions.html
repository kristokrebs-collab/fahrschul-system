<!doctype html><html><head><meta charset="utf-8">
<style>
  @page { margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  body { width:1280px; height:720px; background:#F3EDE1; overflow:hidden;
         font-family: "Arial Black", Arial, Helvetica, sans-serif; position:relative;
         background-image:
           radial-gradient(circle at 1px 1px, rgba(20,20,20,0.055) 1px, transparent 0),
           radial-gradient(circle at 68% 30%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.10) 100%);
         background-size: 15px 15px, cover; }
  .band { position:absolute; left:0; bottom:0; width:100%; height:14px; background:#2E9E5B }
  .kicker { position:absolute; top:38px; left:52px; font-size:26px; letter-spacing:3px;
            color:#141414; opacity:.55; font-family:Arial,sans-serif; font-weight:700 }
  .txt { position:absolute; font-weight:900; color:#141414; line-height:.92;
         letter-spacing:-1.5px; text-transform:uppercase }
  .hl { color:#2E9E5B }
  svg { position:absolute }
  .ink { fill:none; stroke:#141414; stroke-width:9; stroke-linecap:round; stroke-linejoin:round }
  .inkf { fill:#F3EDE1; stroke:#141414; stroke-width:9; stroke-linejoin:round }
  .acc { fill:none; stroke:#2E9E5B; stroke-width:11; stroke-linecap:round; stroke-linejoin:round }
  .accf { fill:#2E9E5B; stroke:#141414; stroke-width:8; stroke-linejoin:round }
</style></head><body><div class="kicker">THE INVISIBLE WHY</div>

     <ellipse class="ink" cx="38" cy="40" rx="13" ry="9" transform="rotate(38 38 40)"/>

               font-family:Arial,sans-serif; color:#141414; opacity:.72; text-align:right; line-height:1.25">
     3 biases doing<br>the work for them</div><div class="band"></div></body></html>
