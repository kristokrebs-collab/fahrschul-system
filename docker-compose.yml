services:
  postgres:
    image: postgres:16-alpine
    container_name: fahrschul_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fahrschul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fahrschul_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fahrschul_dev}
    ports:
      - "5432:5432"
    volumes:
      - fahrschul_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fahrschul}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fahrschul_pg_data:
