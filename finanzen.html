<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fahrschule Krebs – Finanz- &amp; Flotten-Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    /* ═══ „Digitaler Tacho" · ruhiges Nacht-Cockpit ═══════════════════════
       Warmes Anthrazit (Asphalt) · ein kühler Azur-Akzent, sparsam ·
       keine Glows, keine Verläufe · Mono-Ziffern wie ein Instrument. */
    :root {
      --font-sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;

      --bg:            #101113;
      --surface:       #17191C;
      --surface-2:     #1C1F23;
      --surface-hover: #212429;
      --line:          rgba(255,255,255,0.075);
      --line-2:        rgba(255,255,255,0.13);

      --text:   #E8E9EB;
      --text-2: #9CA0A8;
      --text-3: #62666E;

      --accent:      #4C86F0;                 /* einziger UI-Akzent */
      --accent-soft: rgba(76,134,240,0.14);
      --accent-line: rgba(76,134,240,0.4);

      /* Finanz-Semantik (getrennt vom Akzent) */
      --pos:  #5FAF89;     /* Einnahmen / positiv – Salbei-Grün */
      --neg:  #CE8560;     /* Ausgaben / negativ – Ton/Terrakotta */
      --warn: #D0A24F;     /* Warnung – gedämpftes Bernstein */

      /* Diagramm-Palette (entsättigt, gleichgewichtig) */
      --c-revenue:  #5FAF89;
      --c-expense:  #CE8560;
      --c-profit:   #6E9BE6;
      --c-personal: #6E8BD8;
      --c-flotte:   #CBA45B;
      --c-standort: #5CA6AD;
      --c-sonder:   #7BC0A0;
      --c-material: #A98BCB;
      --c-blue:     #6E9BE6;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 10px 30px rgba(0,0,0,0.45);
      --shadow-lg: 0 24px 60px rgba(0,0,0,0.6);
      --r: 12px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh; display: flex; overflow: hidden;
      font-size: 14px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 20px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    /* ── Sidebar ──────────────────────────────────────────────────────── */
    .sidebar {
      width: 236px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 60;
    }
    .sb-brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px 16px; }
    .sb-mark { width: 36px; height: 36px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
    .sb-brand-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.2px; }
    .sb-brand-sub { font-size: 10.5px; color: var(--text-3); font-weight: 500; margin-top: 1px; letter-spacing: 0.2px; }
    .sb-nav { flex: 1; overflow-y: auto; padding: 6px 12px; }
    .sb-label { font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; padding: 15px 10px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px;
      color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none;
      transition: background 0.14s, color 0.14s; margin-bottom: 1px; position: relative;
    }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: #C6D8FA; }
    .nav-item.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 2.5px; border-radius: 3px; background: var(--accent); }
    .nav-badge { margin-left: auto; font-size: 10px; font-weight: 600; font-family: var(--font-mono); padding: 1px 7px; border-radius: 20px; background: rgba(206,133,96,0.16); color: #E3AF8C; }
    .sb-foot { padding: 14px 18px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--text-3); line-height: 1.6; }
    .sb-foot b { color: var(--text-2); font-weight: 600; }

    .scrim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 55; }

    /* ── Main ─────────────────────────────────────────────────────────── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar { flex-shrink: 0; height: 60px; border-bottom: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; gap: 14px; }
    .tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .hamburger { display: none; background: none; border: 1px solid var(--line-2); border-radius: 8px; width: 38px; height: 38px; color: var(--text); cursor: pointer; align-items: center; justify-content: center; flex-shrink: 0; }
    .hamburger svg { width: 20px; height: 20px; }
    .tb-title { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-sub { font-size: 11px; color: var(--text-3); font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .month-select { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; color: var(--text); font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; padding: 7px 10px; outline: none; cursor: pointer; }
    .tb-user { width: 34px; height: 34px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--text); font-family: var(--font-mono); }

    .content { flex: 1; overflow-y: auto; padding: 22px 24px 64px; }
    .view { display: none; }
    .view.active { display: block; animation: fade 0.24s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    /* ── Bausteine ────────────────────────────────────────────────────── */
    .eyebrow { font-size: 11px; font-weight: 600; color: var(--text-2); margin: 2px 0 14px; letter-spacing: 0.2px; }
    .eyebrow .sub { color: var(--text-3); font-weight: 500; }
    .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 26px 0 13px; }
    .row-head h2 { font-size: 13.5px; font-weight: 700; letter-spacing: -0.1px; }
    .row-head span { font-size: 11px; color: var(--text-3); font-weight: 500; text-align: right; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 17px; }
    .kpi-grid { display: grid; gap: 13px; grid-template-columns: repeat(4, 1fr); }
    .two-col   { display: grid; grid-template-columns: 1.65fr 1fr; gap: 15px; align-items: start; }
    .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .card-grid2{ display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }

    /* KPI */
    .kpi { position: relative; }
    .kpi-label { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-value { font-family: var(--font-mono); font-size: 27px; font-weight: 600; margin-top: 11px; letter-spacing: -1px; line-height: 1; }
    .kpi-value.hero { font-size: 33px; }
    .kpi-delta { font-size: 11.5px; font-weight: 600; margin-top: 9px; display: inline-flex; align-items: center; gap: 5px; }
    .kpi-delta.up { color: var(--pos); }
    .kpi-delta.down { color: var(--neg); }
    .kpi-delta .muted { color: var(--text-3); font-weight: 500; }
    .kpi-spark { margin-top: 13px; opacity: 0.95; }

    /* Tabellen */
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
    table.tbl thead th { text-align: left; font-size: 10px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.7px; padding: 11px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.tbl th.num, table.tbl td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    table.tbl tbody td { padding: 11px 14px; border-bottom: 1px solid var(--line); }
    table.tbl tbody tr.clickable { cursor: pointer; }
    table.tbl tbody tr:hover { background: var(--surface-2); }
    table.tbl tbody tr:last-child td { border-bottom: none; }
    table.tbl tfoot td { padding: 12px 14px; font-weight: 700; border-top: 1px solid var(--line-2); background: var(--surface-2); }
    table.tbl tfoot td.num { text-align: right; font-family: var(--font-mono); }
    .t-strong { font-weight: 600; color: var(--text); }
    .t-pos { color: var(--pos); font-weight: 600; }
    .t-neg { color: var(--neg); font-weight: 600; }

    /* Status-Chips: Punkt + Text, ruhig */
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 9px 3px 8px; border-radius: 6px; white-space: nowrap; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--dot, var(--text-3)); flex-shrink: 0; }
    .pill.green  { --dot: var(--pos);  color: #A9D6C1; }
    .pill.red    { --dot: var(--neg);  color: #E0AF97; }
    .pill.orange { --dot: var(--warn); color: #DFC194; }
    .pill.yellow { --dot: var(--warn); color: #DFC194; }
    .pill.blue   { --dot: var(--accent); color: #B9CDF0; }
    .pill.purple { --dot: var(--c-material); color: #CBB6E0; }
    .pill.gray   { --dot: var(--text-3); color: var(--text-2); }
    .pill.plain::before { display: none; }
    .pill.plain { padding: 2px 8px; }

    /* Meter */
    .meter { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; min-width: 66px; }
    .meter-fill { height: 100%; border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
    .util-cell { display: flex; align-items: center; gap: 10px; }
    .util-val { font-family: var(--font-mono); font-size: 12px; font-weight: 600; min-width: 42px; text-align: right; }

    /* Hinweise */
    .alert { display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: var(--r); font-size: 12.5px; line-height: 1.55; margin-bottom: 10px; border: 1px solid var(--line); background: var(--surface); }
    .alert .stripe { width: 3px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
    .alert.red .stripe    { background: var(--neg); }
    .alert.orange .stripe { background: var(--warn); }
    .alert.blue .stripe   { background: var(--accent); }
    .alert-title { font-weight: 700; color: var(--text); }
    .alert .body { flex: 1; color: var(--text-2); }
    .alert-act { flex-shrink: 0; }

    .btn { background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 13px; color: var(--text); font-family: var(--font-sans); font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.14s, border-color 0.14s; white-space: nowrap; }
    .btn:hover { background: var(--surface-hover); border-color: var(--text-3); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #3d78e6; }
    .btn.block { width: 100%; }

    /* Diagramme */
    .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
    .chart-title { font-size: 13px; font-weight: 700; }
    .chart-note { font-size: 11px; color: var(--text-3); font-weight: 500; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 11px 0 4px; }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 500; color: var(--text-2); }
    .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }
    .legend-line { width: 15px; height: 3px; border-radius: 3px; }
    svg text { font-family: var(--font-sans); }
    .grid-line { stroke: var(--line); stroke-width: 1; }
    .axis-txt { fill: var(--text-3); font-size: 10.5px; font-weight: 500; font-family: var(--font-mono); }
    .hover-rect { fill: transparent; cursor: crosshair; }

    #viz-tip { position: fixed; z-index: 4000; pointer-events: none; opacity: 0; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; font-size: 12px; box-shadow: var(--shadow-md); transition: opacity 0.12s; min-width: 118px; }
    #viz-tip .tip-title { font-weight: 700; font-size: 11.5px; margin-bottom: 7px; }
    #viz-tip .tip-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-top: 3px; }
    #viz-tip .tip-key { display: flex; align-items: center; gap: 6px; color: var(--text-2); }
    #viz-tip .tip-dot { width: 8px; height: 8px; border-radius: 2px; }
    #viz-tip .tip-val { font-weight: 600; font-family: var(--font-mono); }

    .hbar-row { display: grid; grid-template-columns: 150px 1fr 84px; align-items: center; gap: 12px; padding: 6px 0; }
    .hbar-label { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar-track { height: 20px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
    .hbar-fill { height: 100%; border-radius: 5px; }
    .hbar-val { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; text-align: right; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; padding: 24px; width: 560px; max-width: 100%; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .modal-title { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    .modal-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .modal-close { background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
    .modal-close:hover { background: var(--surface-hover); color: var(--text); }
    .modal-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 8px; }
    .stat-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px; }
    .stat-box .sb-l { font-size: 10.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-box .sb-v { font-family: var(--font-mono); font-size: 19px; font-weight: 600; margin-top: 6px; letter-spacing: -0.5px; }
    .kv-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
    .kv-row:last-child { border-bottom: none; }
    .kv-row .k { color: var(--text-2); }
    .kv-row .v { font-weight: 600; font-family: var(--font-mono); }
    .maengel-item { display: flex; gap: 12px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); margin-bottom: 8px; }
    .maengel-photo { width: 58px; height: 58px; border-radius: 9px; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); color: var(--text-3); }
    .input { width: 100%; background: var(--bg); border: 1px solid var(--line-2); border-radius: 9px; padding: 10px 12px; color: var(--text); font-size: 13px; outline: none; font-family: var(--font-sans); transition: border-color 0.14s; }
    .input:focus { border-color: var(--accent); }
    .field-label { font-size: 11px; font-weight: 600; color: var(--text-2); margin: 12px 0 6px; display: block; }
    .heat-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .heat-bar-wrap { height: 60px; display: flex; align-items: flex-end; width: 100%; }
    .heat-bar { width: 100%; border-radius: 5px 5px 3px 3px; }

    /* CRM-Pipeline */
    .pipeline { display: grid; grid-template-columns: repeat(5, minmax(170px, 1fr)); gap: 12px; }
    .pipe-col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; }
    .pipe-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2); padding: 4px 6px 10px; display: flex; align-items: center; gap: 7px; }
    .pipe-dot { width: 7px; height: 7px; border-radius: 50%; }
    .pipe-count { margin-left: auto; background: var(--surface-hover); border-radius: 20px; padding: 1px 8px; font-size: 10px; font-family: var(--font-mono); color: var(--text-2); }
    .lead-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.14s, transform 0.14s; }
    .lead-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
    .lead-name { font-size: 13px; font-weight: 600; }
    .lead-meta { font-size: 11px; color: var(--text-3); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lead-follow { font-size: 10.5px; font-weight: 600; margin-top: 8px; padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); }
    .lead-follow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .lead-follow.due  { color: #E0AF97; } .lead-follow.due::before  { background: var(--neg); }
    .lead-follow.soon { color: #DFC194; } .lead-follow.soon::before { background: var(--warn); }
    .lead-follow.ok   { color: var(--text-2); } .lead-follow.ok::before { background: var(--text-3); }

    .tag-src { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); color: var(--text-3); border: 1px solid var(--line); }
    .muted-note { font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
    code { font-family: var(--font-mono); color: #B9CDF0; font-size: 0.92em; }

    #toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(18px); background: var(--surface-2); border: 1px solid var(--accent-line); color: var(--text); padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 9999; box-shadow: var(--shadow-lg); pointer-events: none; opacity: 0; transition: all 0.28s cubic-bezier(0.4,0,0.2,1); max-width: 92vw; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Responsiv ────────────────────────────────────────────────────── */
    @media (max-width: 960px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform 0.24s cubic-bezier(0.4,0,0.2,1); box-shadow: var(--shadow-lg); }
      body.nav-open .sidebar { transform: translateX(0); }
      body.nav-open .scrim { display: block; }
      .hamburger { display: flex; }
      .two-col, .three-col { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .card-grid2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .content { padding: 16px 14px 60px; }
      .topbar { padding: 0 14px; }
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .kpi-value { font-size: 23px; } .kpi-value.hero { font-size: 27px; }
      .card { padding: 14px; }
      .month-select { max-width: 130px; }
    }
  </style>
</head>
<body>

<div class="scrim" onclick="closeNav()"></div>

<!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-mark">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3.2V9.8M4.8 16.5l5.4-3.9M19.2 16.5l-5.4-3.9"/></svg>
    </div>
    <div>
      <div class="sb-brand-title">Fahrschule Krebs</div>
      <div class="sb-brand-sub">Finanz- &amp; Flotten-Cockpit</div>

/* ═══ BERECHNUNGEN (eine Quelle der Wahrheit) ══════════════════════════ */
const sum = (arr, f) => arr.reduce((a,b) => a + (f ? f(b) : b), 0);
function lehrerUmsatz(l) { return l.normal * PREIS_FAHRSTUNDE + l.sonder * PREIS_SONDERFAHRT; }
function lehrerAuslastung(l) { return (l.normal + l.sonder) / l.kapazitaet; }
function lehrerGefahren(l) { return l.normal + l.sonder; }
function lehrerStundenlohn(l) { return l.lohn / l.kapazitaet; }
function lehrerLeerlauf(l) { return Math.max(0, l.kapazitaet - lehrerGefahren(l)); }
function lehrerLeerlaufkosten(l) { return Math.round(lehrerLeerlauf(l) * lehrerStundenlohn(l)); }
function lehrerWoche(l) {
  const base = lehrerAuslastung(l), seed = parseInt(l.id.slice(1));
  return [0,1,2,3,4,5].map(d => Math.max(0.15, Math.min(1.08, base + Math.sin(seed*1.7 + d*1.3)*0.22 + (d===5?-0.25:0))));
}
function fahrzeugKosten(f) { return f.leasing + f.sprit + f.reparatur + f.versicherung; }
function fahrzeugUmsatz(f) { if (!f.lehrerId) return 0; const l = fahrlehrer.find(x => x.id === f.lehrerId); return l ? lehrerUmsatz(l) : 0; }
function fahrzeugGewinn(f) { return fahrzeugUmsatz(f) - fahrzeugKosten(f); }
function fahrzeugKostenProStunde(f) { const l = fahrlehrer.find(x => x.id === f.lehrerId); const std = l ? lehrerGefahren(l) : 0; return std ? fahrzeugKosten(f)/std : 0; }

/* Bankabgleich · Zuordnungs-Engine */
function nachnameTreffer(schueler, absender) { const nach = schueler.split(' ').slice(-1)[0].toLowerCase(); return absender.toLowerCase().includes(nach); }
function findeRechnung(tx) {
  if (tx.betrag <= 0) return null;
  const m = tx.zweck.match(/RE-\d{4}-\d{4}/);
  if (m) { const r = offeneRechnungen.find(x => x.nr === m[0]); if (r) return { r, art:'Rechnungsnummer', konfidenz:'hoch' }; }
  const r2 = offeneRechnungen.find(x => !x.bezahlt && Math.abs(x.betrag - tx.betrag) < 0.005 && nachnameTreffer(x.schueler, tx.absender));
  if (r2) return { r:r2, art:'Name + Betrag', konfidenz:'mittel' };
  return null;
}
function initBankAbgleich() {
  bankTx.forEach(tx => { if (tx.status === 'auto') { const t = findeRechnung(tx); if (t) { t.r.bezahlt = true; tx.rechnung = t.r.nr; tx.konfidenz = t.konfidenz; tx.matchArt = t.art; } } });
}

function berechne() {
  const fahrstunden   = sum(fahrlehrer, l => l.normal) * PREIS_FAHRSTUNDE;
  const sonderfahrten = sum(fahrlehrer, l => l.sonder) * PREIS_SONDERFAHRT;
  const grundbetrag   = schuelerStat.neuAnmeldungen * schuelerStat.grundbetragDurchschnitt;
  const pruefungen    = schuelerStat.pruefungenPraktisch * schuelerStat.pruefungPreis + Math.round(schuelerStat.pruefungenTheorie * schuelerStat.theoriePruefPreis);
  const lehrmaterial  = schuelerStat.lehrmaterial;
  const einnahmen = { fahrstunden, sonderfahrten, grundbetrag, pruefungen, lehrmaterial, total: fahrstunden+sonderfahrten+grundbetrag+pruefungen+lehrmaterial };

  const lehrerLohn = sum(fahrlehrer, l => l.lohn), bueroLohn = sum(personalBuero, p => p.kosten);
  const personal = { lehrer: lehrerLohn, buero: bueroLohn, total: lehrerLohn + bueroLohn };

  const flotte = { leasing:sum(fahrzeuge,f=>f.leasing), sprit:sum(fahrzeuge,f=>f.sprit), reparatur:sum(fahrzeuge,f=>f.reparatur), versicherung:sum(fahrzeuge,f=>f.versicherung) };
  flotte.total = flotte.leasing + flotte.sprit + flotte.reparatur + flotte.versicherung;

  const miete=sum(standorte,s=>s.miete), strom=sum(standorte,s=>s.strom), wasser=sum(standorte,s=>s.wasser), internet=sum(standorte,s=>s.internet), firma=sum(fixkostenFirma,f=>f.value);
  const fix = { miete, strom, wasser, internet, firma, total: miete+strom+wasser+internet+firma };

  const ausgaben = { personal:personal.total, flotte:flotte.total, fix:fix.total, total: personal.total+flotte.total+fix.total };
  const gewinn = einnahmen.total - ausgaben.total;
  return { einnahmen, personal, flotte, fix, ausgaben, gewinn, marge: gewinn/einnahmen.total, aktiveSchueler: sum(fahrlehrer, l => l.schueler) };
}
const K = berechne();

const eurK = (n) => (n/1000).toLocaleString('de-DE', { maximumFractionDigits:1 }) + 'k €';

function tageBis(d) { return Math.round((new Date(d) - HEUTE) / 86400000); }

let CHART_SEQ = 0; const LINE_REG = {};
function niceMax(v) { if (v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))), n=v/p, s=n<=1?1:n<=2?2:n<=5?5:10; return s*p; }

function lineChart(series, labels, opts={}) {
  const W=860,H=320,padL=52,padR=22,padT=14,padB=38, plotW=W-padL-padR, plotH=H-padT-padB, n=labels.length;
  const yMax=niceMax(Math.max(...series.flatMap(s=>s.data))*1.08);
  const x=i=>padL+(n===1?plotW/2:i*plotW/(n-1)), y=v=>padT+plotH*(1-v/yMax), id='lc'+(++CHART_SEQ);
  let grid='';
  for (let t=0;t<=4;t++){ const val=yMax*t/4, yy=y(val);
    grid+=`<line class="grid-line" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/>`;
    grid+=`<text class="axis-txt" x="${padL-8}" y="${yy+3.5}" text-anchor="end">${opts.kEuro?Math.round(val)+'k':num(Math.round(val))}</text>`; }
  let xlabels=''; labels.forEach((lb,i)=>{ xlabels+=`<text class="axis-txt" x="${x(i)}" y="${H-14}" text-anchor="middle">${lb}</text>`; });
  let lines='';
  series.forEach(s=>{ const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' '); const li=n-1;
    lines+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    lines+=`<circle cx="${x(li)}" cy="${y(s.data[li])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
    lines+=`<text x="${x(li)}" y="${y(s.data[li])-10}" text-anchor="end" fill="${s.color}" font-size="11.5" font-weight="700" style="font-family:var(--font-mono)">${opts.kEuro?s.data[li]+'k':num(s.data[li])}</text>`; });
  let cross=`<line id="${id}-cx" x1="0" y1="${padT}" x2="0" y2="${padT+plotH}" stroke="var(--line-2)" stroke-width="1" style="opacity:0"/>`;
  series.forEach((s,si)=>{ cross+=`<circle id="${id}-d${si}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" style="opacity:0"/>`; });
  cross+=`<rect class="hover-rect" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" onmousemove="lineHover(event,'${id}')" onmouseleave="lineOut('${id}')"/>`;
  LINE_REG[id]={ series, labels, x:[...Array(n)].map((_,i)=>x(i)), ys:series.map(s=>s.data.map(v=>y(v))), n, kEuro:!!opts.kEuro };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${grid}${xlabels}${lines}${cross}</svg>`;
}
function lineHover(e,id){ const cfg=LINE_REG[id]; if(!cfg)return;
  const svg=e.currentTarget.ownerSVGElement, pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const loc=pt.matrixTransform(svg.getScreenCTM().inverse()); let idx=0,best=1e9;
  cfg.x.forEach((xx,i)=>{ const d=Math.abs(xx-loc.x); if(d<best){best=d;idx=i;} });
  const cx=document.getElementById(id+'-cx'); cx.setAttribute('x1',cfg.x[idx]); cx.setAttribute('x2',cfg.x[idx]); cx.style.opacity=1;
  cfg.series.forEach((s,si)=>{ const d=document.getElementById(id+'-d'+si); d.setAttribute('cx',cfg.x[idx]); d.setAttribute('cy',cfg.ys[si][idx]); d.style.opacity=1; });
  const rows=cfg.series.map(s=>`<div class="tip-row"><span class="tip-key"><span class="tip-dot" style="background:${s.color}"></span>${s.name}</span><span class="tip-val">${cfg.kEuro?s.data[idx]+'k €':num(s.data[idx])}</span></div>`).join('');
  showTip(e, `<div class="tip-title">${cfg.labels[idx]} 2026</div>${rows}`);
}
function lineOut(id){ const cfg=LINE_REG[id]; if(!cfg)return; document.getElementById(id+'-cx').style.opacity=0; cfg.series.forEach((s,si)=>document.getElementById(id+'-d'+si).style.opacity=0); hideTip(); }

function donut(items, opts={}) {
  const size=opts.size||220, thick=opts.thickness||28, r=(size-thick)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const total=sum(items,i=>i.value)||1; let off=0, segs='';
  items.forEach(it=>{ const len=it.value/total*C, dash=Math.max(0.5,len-3);
    segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${thick}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" style="cursor:pointer" onmousemove="showTip(event,'<div class=&quot;tip-row&quot;><span class=&quot;tip-key&quot;><span class=&quot;tip-dot&quot; style=&quot;background:${it.color}&quot;></span>${it.label}</span><span class=&quot;tip-val&quot;>${eur(it.value)}</span></div><div style=&quot;color:var(--text-3);font-size:11px;margin-top:5px&quot;>${pct(it.value/total)} der Summe</div>')" onmouseleave="hideTip()"/>`;
    off+=len; });
  const center = opts.centerValue ? `<text x="${cx}" y="${cy-3}" text-anchor="middle" fill="var(--text)" font-size="22" font-weight="600" style="font-family:var(--font-mono)">${opts.centerValue}</text><text x="${cx}" y="${cy+16}" text-anchor="middle" fill="var(--text-3)" font-size="11" font-weight="600">${opts.centerLabel||''}</text>` : '';
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%">${segs}${center}</svg>`;
}
function donutLegend(items) {
  const total=sum(items,i=>i.value)||1;
  return `<div style="display:flex;flex-direction:column;gap:9px">`+items.map(it=>`
    <div style="display:flex;align-items:center;gap:9px;font-size:12.5px">
      <span class="legend-swatch" style="background:${it.color}"></span>
      <span style="flex:1;font-weight:500">${it.label}</span>
      <span style="font-weight:600;font-family:var(--font-mono)">${eur(it.value)}</span>
      <span style="color:var(--text-3);width:44px;text-align:right;font-family:var(--font-mono)">${pct(it.value/total)}</span>
    </div>`).join('')+`</div>`;
}
function columnChart(data, labels, opts={}) {
  const W=860,H=300,padL=44,padR=18,padT=20,padB=34, plotW=W-padL-padR, plotH=H-padT-padB, n=data.length;
  const yMax=niceMax(Math.max(...data)*1.12), y=v=>padT+plotH*(1-v/yMax), band=plotW/n, bw=Math.min(24,band*0.55), color=opts.color||'var(--c-personal)';
  let grid=''; for(let t=0;t<=4;t++){ const val=yMax*t/4, yy=y(val);
    grid+=`<line class="grid-line" x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}"/>`;
    grid+=`<text class="axis-txt" x="${padL-8}" y="${yy+3.5}" text-anchor="end">${num(Math.round(val))}</text>`; }
  const maxV=Math.max(...data); let bars='';
  data.forEach((v,i)=>{ const bx=padL+band*i+(band-bw)/2, by=y(v), bh=padT+plotH-by;
    const tip=`onmousemove="showTip(event,'<div class=&quot;tip-title&quot;>${labels[i]} 2026</div><div class=&quot;tip-row&quot;><span class=&quot;tip-key&quot;>${opts.serieName||'Wert'}</span><span class=&quot;tip-val&quot;>${num(v)}</span></div>')" onmouseleave="hideTip()"`;
    bars+=`<rect x="${bx}" y="${by}" width="${bw}" height="${Math.max(0,bh)}" rx="4" fill="${color}" style="cursor:pointer" ${tip}/>`;
    bars+=`<rect x="${bx-4}" y="${padT}" width="${bw+8}" height="${plotH}" fill="transparent" ${tip}/>`;
    if(v===maxV) bars+=`<text x="${bx+bw/2}" y="${by-7}" text-anchor="middle" fill="var(--text)" font-size="11" font-weight="700" style="font-family:var(--font-mono)">${num(v)}</text>`;
    bars+=`<text class="axis-txt" x="${bx+bw/2}" y="${H-12}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block">${grid}${bars}</svg>`;
}
function hbarList(rows) {
  const maxV=Math.max(...rows.map(r=>Math.abs(r.value)),1);
  return rows.map(r=>`<div class="hbar-row"><div class="hbar-label" title="${r.label}">${r.label}</div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.abs(r.value)/maxV*100}%;background:${r.color}"></div></div><div class="hbar-val" style="color:${r.valColor||'var(--text)'}">${r.display}</div></div>`).join('');
}
function sparkline(data, color) {
  const W=160,H=36,min=Math.min(...data),max=Math.max(...data),rng=(max-min)||1, x=i=>i*(W/(data.length-1)), y=v=>4+(H-8)*(1-(v-min)/rng);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="36" preserveAspectRatio="none" style="display:block"><polyline points="${data.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(data.length-1)}" cy="${y(data[data.length-1])}" r="2.6" fill="${color}"/></svg>`;
}
const tip = document.getElementById('viz-tip');
function showTip(e, html) { tip.innerHTML=html; tip.style.opacity=1;
  let x=e.clientX+16, yy=e.clientY-10;
  if (x+tip.offsetWidth>window.innerWidth-10) x=e.clientX-tip.offsetWidth-16;
  if (yy+tip.offsetHeight>window.innerHeight-10) yy=window.innerHeight-tip.offsetHeight-10;
  tip.style.left=x+'px'; tip.style.top=yy+'px'; }
function hideTip() { tip.style.opacity=0; }

function terminStatus(d) { const t=tageBis(d);
  if (t<0)   return { pill:'red',    txt:'Überfällig', kritisch:true,  warn:true,  tage:t };
  if (t<=30) return { pill:'orange', txt:t+' Tage',    kritisch:false, warn:true,  tage:t };
  if (t<=60) return { pill:'yellow', txt:t+' Tage',    kritisch:false, warn:false, tage:t };
  return             { pill:'green',  txt:'OK',          kritisch:false, warn:false, tage:t };
}
function flotteWarnungen() {
  return fahrzeuge.map(f => ({ f, s: terminStatus(f.insp) })).filter(w => w.s.warn).sort((a,b) => a.s.tage - b.s.tage);
}

function ausgabenSplit() { return [

}

    ${wartungHistorie[f.id]?`<div class="stat-box" style="margin-bottom:12px"><div class="sb-l" style="margin-bottom:6px">Wartungshistorie</div>${wartungHistorie[f.id].map(w=>`<div class="kv-row"><span class="k">${fmtDatum(w.datum)} · ${w.text}</span><span class="v" style="white-space:nowrap">${eur(w.kosten)}</span></div>`).join('')}</div>`:''}

}
function mangelForm(fid) {

function saveMangel(fid) {
  const f=fahrzeuge.find(x=>x.id===fid), text=(document.getElementById('m-text').value||'').trim()||'Neuer Mangel gemeldet', schwere=document.getElementById('m-schwere').value;
  maengel.unshift({ fahrzeugId:fid, datum:'2026-07-19', melder:'M. Krebs', text, schwere, status:'Gemeldet', foto:true });

}

/* ═══ PRO · FAHRLEHRER ═════════════════════════════════════════════════ */
function renderFahrlehrer() {
  const gesGef=sum(fahrlehrer,lehrerGefahren), gesKap=sum(fahrlehrer,l=>l.kapazitaet), avg=gesGef/gesKap;
  const dp=(PREIS_FAHRSTUNDE+PREIS_SONDERFAHRT)/2;
  const potenzial=sum(fahrlehrer.filter(l=>lehrerAuslastung(l)<0.85), l=>Math.round((l.kapazitaet*0.85-lehrerGefahren(l))*dp));
  const leerlauf=sum(fahrlehrer,lehrerLeerlaufkosten), ausf=sum(fahrlehrer,l=>l.ausgefallen);
  const rows=[...fahrlehrer].sort((a,b)=>(lehrerUmsatz(b)-b.lohn)-(lehrerUmsatz(a)-a.lohn)).map(l=>{
    const umsatz=lehrerUmsatz(l), u=lehrerAuslastung(l), deckung=umsatz-l.lohn, veh=fahrzeuge.find(f=>f.lehrerId===l.id), c=u>=0.9?'var(--pos)':u>=0.75?'var(--warn)':'var(--neg)';
    return `<tr class="clickable" onclick="openLehrer('${l.id}')">
      <td><div class="t-strong">${l.name}</div><div style="font-size:11px;color:var(--text-3)">${l.vertrag} · ${l.klassen.join(', ')}</div></td>
      <td>${veh?`<span style="font-size:12px;font-family:var(--font-mono)">${veh.kennz}</span>`:'<span style="color:var(--text-3)">—</span>'}</td>
      <td class="num">${l.schueler}</td>
      <td class="num">${lehrerGefahren(l)} / ${l.kapazitaet}</td>
      <td class="num" style="color:${l.ausgefallen>=12?'var(--warn)':'var(--text-2)'}">${l.ausgefallen}</td>
      <td><div class="util-cell"><div class="meter"><div class="meter-fill" style="width:${Math.min(100,u*100)}%;background:${c}"></div></div><span class="util-val" style="color:${c}">${pct(u)}</span></div></td>
      <td class="num t-pos">${eur(umsatz)}</td>
      <td class="num ${deckung>=0?'t-pos':'t-neg'}">${deckung>=0?'+':''}${eur(deckung)}</td>
    </tr>`; }).join('');
  document.getElementById('view-fahrlehrer').innerHTML = `
    <div class="kpi-grid">
      <div class="card kpi"><div class="kpi-label">Ø Auslastung</div><div class="kpi-value" style="color:${avg>=0.85?'var(--pos)':'var(--warn)'}">${pct(avg)}</div><div class="kpi-delta"><span class="muted">${gesGef} von ${gesKap} Std.</span></div></div>
      <div class="card kpi"><div class="kpi-label">Ausgefallene Termine</div><div class="kpi-value" style="color:var(--warn)">${ausf}</div><div class="kpi-delta"><span class="muted">Std. diesen Monat</span></div></div>
      <div class="card kpi" style="border-color:rgba(206,133,96,0.4)"><div class="kpi-label">Leerlaufkosten</div><div class="kpi-value" style="color:var(--neg)">${eur(leerlauf)}</div><div class="kpi-delta"><span class="muted">bezahlt, aber nicht gefahren</span></div></div>

function openLehrer(id) {

    <div class="modal-header"><div><div class="modal-title">${l.name}</div><div class="modal-sub">${l.vertrag} · Klassen ${l.klassen.join(', ')}${veh?' · '+veh.modell+' ('+veh.kennz+')':''}</div></div><button class="modal-close" onclick="closeModal()">✕</button></div>

    </div>

      <div class="kv-row" style="border-top:1px solid var(--line-2);margin-top:2px;padding-top:9px"><span class="k" style="font-weight:700;color:var(--text)">Leerlaufkosten</span><span class="v" style="color:var(--neg)">${eur(lehrerLeerlaufkosten(l))}</span></div></div>
    <div class="chart-title" style="margin-bottom:12px">Auslastung diese Woche</div>
    <div style="display:flex;gap:8px;align-items:flex-end">${heat}</div>
    <div class="muted-note" style="margin-top:14px">Wochenwerte kommen im Live-Betrieb automatisch aus dem Stundenplan (Modul „Anbindungen").</div>
    <button class="btn primary block" style="margin-top:16px;padding:11px" onclick="toast('${l.name}: Vorschlag zur Terminverdichtung an die Disposition gesendet.')">Freie Slots auffüllen lassen</button>`;
  openModal();
}

/* ═══ PRO · LEADS / CRM ════════════════════════════════════════════════ */
function leadFollowClass(l) { if (!l.folge) return null; const t=tageBis(l.folge);
  if (t<0) return { c:'due', txt:'Überfällig ('+Math.abs(t)+'d)' };
  if (t===0) return { c:'due', txt:'Heute fällig' };
  if (t<=2) return { c:'soon', txt:'in '+t+' Tagen' };
  return { c:'ok', txt:fmtDatum(l.folge) };
}
function renderLeads() {
  const aktiv=leads.filter(l=>l.status!=='Verloren'), angemeldet=leads.filter(l=>l.status==='Angemeldet').length, quote=angemeldet/(leads.length||1);
  const faellig=leads.filter(l=>{const f=leadFollowClass(l);return f&&f.c==='due'&&l.status!=='Angemeldet'&&l.status!=='Verloren';});
  const dotCol={'Neu':'var(--c-blue)','Kontaktiert':'var(--warn)','Probestunde':'var(--c-material)','Angemeldet':'var(--pos)','Verloren':'var(--text-3)'};
  const cols=LEAD_STATES.map(st=>{ const list=leads.filter(l=>l.status===st);
    return `<div class="pipe-col"><div class="pipe-head"><span class="pipe-dot" style="background:${dotCol[st]}"></span>${st}<span class="pipe-count">${list.length}</span></div>
      ${list.map(l=>{const fc=leadFollowClass(l);return `<div class="lead-card" onclick="openLead('${l.id}')"><div class="lead-name">${l.name}</div><div class="lead-meta"><span class="pill gray plain">${l.klasse}</span><span class="tag-src">${l.quelle}</span></div><div class="lead-meta">Anfrage ${fmtDatum(l.eingang)}</div>${fc?`<div class="lead-follow ${fc.c}">${fc.txt}</div>`:(l.status==='Angemeldet'?'<div class="lead-follow ok">Konvertiert</div>':'')}</div>`;}).join('')||'<div class="muted-note" style="padding:8px">—</div>'}</div>`; }).join('');
  document.getElementById('view-leads').innerHTML = `
    <div class="kpi-grid">
      <div class="card kpi"><div class="kpi-label">Offene Leads</div><div class="kpi-value">${aktiv.filter(l=>l.status!=='Angemeldet').length}</div><div class="kpi-delta"><span class="muted">im Trichter</span></div></div>
      <div class="card kpi" style="${faellig.length?'border-color:var(--neg)':''}"><div class="kpi-label">Nachfassen fällig</div><div class="kpi-value" style="color:var(--neg)">${faellig.length}</div><div class="kpi-delta"><span class="muted">jeder Tag senkt die Quote</span></div></div>
      <div class="card kpi"><div class="kpi-label">Anmeldequote</div><div class="kpi-value">${pct(quote)}</div></div>
      <div class="card kpi"><div class="kpi-label">Neu diese Woche</div><div class="kpi-value" style="color:var(--c-blue)">${leads.filter(l=>tageBis(l.eingang)>=-7).length}</div></div>
    </div>
    <div class="alert blue" style="margin-top:18px"><div class="stripe"></div><div class="body"><div class="alert-title">Automatisches Nachfassen</div>
      Jede Website-Anfrage landet sofort hier. Wird ein Lead nicht binnen 48 h kontaktiert, verschickt das System automatisch eine freundliche Erinnerung („Hallo, du hast dich für den B-Führerschein interessiert – sollen wir telefonieren?") und meldet den Fall dem Büro.
      <div style="margin-top:10px"><button class="btn primary" onclick="autoFollowUp()">${faellig.length} fällige jetzt automatisch anschreiben</button></div></div></div>
    <div class="row-head"><h2>Lead-Pipeline</h2><span>Klick auf eine Karte, um den Status zu ändern</span></div>
    <div style="overflow-x:auto"><div class="pipeline">${cols}</div></div>`;
}
function autoFollowUp() {
  const faellig=leads.filter(l=>{const f=leadFollowClass(l);return f&&f.c==='due'&&l.status==='Neu';});
  faellig.forEach(l=>{ l.status='Kontaktiert'; l.folge='2026-07-22'; });
  toast(`${faellig.length} Interessenten automatisch angeschrieben & auf „Kontaktiert" gesetzt.`);
  renderLeads(); updateBadges();
}
function openLead(id) {
  const l=leads.find(x=>x.id===id);
  document.getElementById('modalBox').innerHTML = `
    <div class="modal-header"><div><div class="modal-title">${l.name}</div><div class="modal-sub">Klasse ${l.klasse} · Quelle: ${l.quelle} · ${l.tel}</div></div><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-grid2"><div class="stat-box"><div class="sb-l">Anfrage am</div><div class="sb-v" style="font-size:15px">${fmtDatum(l.eingang)}</div></div><div class="stat-box"><div class="sb-l">Nächster Kontakt</div><div class="sb-v" style="font-size:15px">${l.folge?fmtDatum(l.folge):'—'}</div></div></div>
    <label class="field-label">Status im Trichter</label><select class="input" id="lead-status">${LEAD_STATES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('')}</select>
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn" style="flex:1;padding:11px" onclick="toast('Anruf bei ${l.name} vermerkt.')">Anrufen</button><button class="btn" style="flex:1;padding:11px" onclick="toast('E-Mail an ${l.name} gesendet.')">E-Mail</button><button class="btn primary" style="flex:1;padding:11px" onclick="saveLead('${l.id}')">Speichern</button></div>`;
  openModal();
}
function saveLead(id) {
  const l=leads.find(x=>x.id===id); l.status=document.getElementById('lead-status').value;
  if (l.status==='Angemeldet'||l.status==='Verloren') l.folge=null;
  toast(`${l.name} → Status „${l.status}" gespeichert.`);
  closeModal(); renderLeads(); updateBadges();
}

/* ═══ PRO · BANKABGLEICH ═══════════════════════════════════════════════ */
function bankStatusPill(tx) {
  if (tx.status==='ruecklauf') return { c:'red', t:'Rücklastschrift' };
  if (tx.status==='manuell') return { c:'blue', t:'manuell zugeordnet' };
  if (tx.status==='auto') return { c:'green', t:'auto zugeordnet' };
  if (tx.status==='pruefen') return { c:'yellow', t:'prüfen' };
  return { c:'orange', t:'offen' };
}
function renderBank() {
  const zug=bankTx.filter(t=>t.status==='auto'||t.status==='manuell'), eingang=sum(bankTx.filter(t=>t.betrag>0),t=>t.betrag);
  const quote=bankTx.filter(t=>t.status==='auto').length/bankTx.filter(t=>t.betrag>0).length;
  const offen=offeneRechnungen.filter(r=>!r.bezahlt), offenSum=sum(offen,r=>r.betrag);
  const opts=offen.map(r=>`<option value="${r.nr}">${r.nr} · ${r.schueler} · ${eur(r.betrag,2)}</option>`).join('');
  const rows=bankTx.map(t=>{ const p=bankStatusPill(t), r=t.rechnung?offeneRechnungen.find(x=>x.nr===t.rechnung):null;
    let match=''; if (t.rechnung) match=`<div style="font-size:10.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-mono)">→ ${t.rechnung}${r?' · '+r.schueler:''}${t.matchArt&&t.matchArt!=='manuell'?' <span class="pill '+(t.konfidenz==='hoch'?'green':'yellow')+' plain" style="font-family:var(--font-sans)">'+t.matchArt+'</span>':''}</div>`;
    let act='<span style="color:var(--text-3)">—</span>';
    if (t.status==='ruecklauf') act=`<button class="btn" onclick="mahneRuecklauf('${t.id}')">Mahnung</button>`;
    else if (t.status==='offen'||t.status==='pruefen') act=`<select class="input" style="padding:6px 8px;font-size:11.5px;min-width:150px" onchange="zuordneTx('${t.id}',this.value)"><option value="">Rechnung wählen…</option>${opts}</select>`;
    return `<tr><td style="color:var(--text-3);white-space:nowrap">${fmtDatum(t.datum)}</td><td class="t-strong">${t.absender}</td><td style="color:var(--text-2)">${t.zweck}</td><td class="num ${t.betrag<0?'t-neg':''}">${t.betrag<0?'−':''}${eur(Math.abs(t.betrag),2)}</td><td><span class="pill ${p.c}">${p.t}</span>${match}</td><td>${act}</td></tr>`; }).join('');
  document.getElementById('view-bank').innerHTML = `
    <div class="kpi-grid">
      <div class="card kpi"><div class="kpi-label">Zahlungseingang</div><div class="kpi-value" style="color:var(--c-revenue)">${eur(eingang)}</div><div class="kpi-delta"><span class="muted">${bankTx.filter(t=>t.betrag>0).length} Gutschriften</span></div></div>
      <div class="card kpi"><div class="kpi-label">Auto-Zuordnung</div><div class="kpi-value" style="color:var(--pos)">${pct(quote)}</div><div class="kpi-delta"><span class="muted">${zug.length} von ${bankTx.filter(t=>t.betrag>0).length} zugeordnet</span></div></div>
      <div class="card kpi"><div class="kpi-label">Offene Forderungen</div><div class="kpi-value" style="color:var(--warn)">${eur(offenSum)}</div><div class="kpi-delta"><span class="muted">${offen.length} Rechnungen unbezahlt</span></div></div>
      <div class="card kpi" style="border-color:rgba(206,133,96,0.4)"><div class="kpi-label">Rücklastschriften</div><div class="kpi-value" style="color:var(--neg)">${bankTx.filter(t=>t.status==='ruecklauf').length}</div><div class="kpi-delta"><span class="muted">geplatzte Zahlung → nachfassen</span></div></div>
    </div>
    <div class="alert blue" style="margin-top:18px"><div class="stripe"></div><div class="body"><div class="alert-title">So funktioniert der automatische Bankabgleich</div>
      Das System liest den Kontoumsatz (per FinTS/HBCI) und sucht im <b>Verwendungszweck</b> nach der Rechnungsnummer (z. B. „RE-2026-0412"). Fehlt sie, wird über <b>Name + Betrag</b> abgeglichen. Bei Treffer wird die Rechnung auf „bezahlt" gesetzt – die Finanz-Sperre im Schüler-Cockpit fällt sofort weg.
      <div style="margin-top:10px"><button class="btn primary" onclick="autoMatchAll()">Offene Posten automatisch zuordnen</button></div></div></div>
    <div class="two-col" style="margin-top:8px">
      <div><div class="row-head" style="margin-top:12px"><h2>Kontoumsätze</h2><span>Juli 2026</span></div>
        <div class="tbl-wrap"><table class="tbl" style="min-width:680px"><thead><tr><th>Datum</th><th>Absender</th><th>Verwendungszweck</th><th class="num">Betrag</th><th>Status</th><th>Aktion</th></tr></thead><tbody>${rows}</tbody></table></div></div>
      <div><div class="row-head" style="margin-top:12px"><h2>Offene Rechnungen</h2><span>${eur(offenSum)}</span></div>
        <div class="card">${offen.length?offen.map(r=>{const ue=tageBis(r.faellig)<0;return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><div><div class="t-strong" style="font-size:12.5px;font-family:var(--font-mono)">${r.nr}</div><div style="font-size:11px;color:var(--text-3)">${r.schueler} · fällig ${fmtDatum(r.faellig)}</div></div><div style="text-align:right"><div style="font-weight:600;font-family:var(--font-mono)">${eur(r.betrag,2)}</div>${ue?'<span class="pill red plain" style="margin-top:3px">überfällig</span>':''}</div></div>`;}).join(''):'<div class="muted-note">Alle Rechnungen bezahlt.</div>'}</div></div>
    </div>`;
}
function zuordneTx(txId, nr) {
  if (!nr) return; const tx=bankTx.find(x=>x.id===txId), r=offeneRechnungen.find(x=>x.nr===nr); if (!tx||!r) return;
  r.bezahlt=true; tx.status='manuell'; tx.rechnung=r.nr; tx.matchArt='manuell';
  toast(`${tx.absender} → ${r.nr} (${r.schueler}) zugeordnet. Finanz-Sperre aufgehoben.`);
  renderBank(); updateBadges();
}
function mahneRuecklauf(id) { const tx=bankTx.find(x=>x.id===id); toast(`Zahlungserinnerung zu „${tx.absender}" (${eur(Math.abs(tx.betrag),2)}) erstellt & Schüler auf Finanz-Sperre gesetzt.`); }
function autoMatchAll() {
  let n=0; bankTx.forEach(tx=>{ if (tx.status==='offen'||tx.status==='pruefen'){ const t=findeRechnung(tx); if (t){ t.r.bezahlt=true; tx.status='manuell'; tx.rechnung=t.r.nr; tx.konfidenz=t.konfidenz; tx.matchArt=t.art; n++; } } });
  toast(n?`${n} weitere Zahlung(en) automatisch zugeordnet.`:'Keine eindeutige Auto-Zuordnung möglich – bitte manuell prüfen (fehlende Rechnungsnummer).');
  renderBank(); updateBadges();
}

/* ═══ SYSTEM · ANBINDUNGEN ═════════════════════════════════════════════ */

  document.getElementById('view-anbindungen').innerHTML = `
    <div class="alert orange"><div class="stripe"></div><div class="body"><div class="alert-title">Aktuell im Demo-Modus – bereit für die Live-Anbindung</div>

    <div class="row-head"><h2>Schnittstellen</h2><span>je Modul einzeln aktivierbar</span></div>
    <div class="card-grid2">${cards}</div>
    <div class="card" style="margin-top:18px"><div class="chart-title" style="margin-bottom:10px">Was beim Live-Gang passiert</div>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.8">
        1. Datenquelle je Modul auf die echte Schnittstelle umstellen (im Code als <code>// ANBINDUNG:</code> markiert).<br>
        2. <code>CONFIG.modus</code> von <code>'demo'</code> auf <code>'live'</code> setzen.<br>
        3. Alle Kennzahlen rechnen sich automatisch aus den echten Daten – nichts muss doppelt gepflegt werden.</div></div>`;
}

  finanzen:   { title:'Finanzen',         sub:'Einnahmen & Ausgaben im Detail',       render:renderFinanzen },
  flotte:     { title:'Flottenmanagement',sub:'Fahrzeuge, Kosten, Inspektion & Mängel',render:renderFlotte },
  analytics:  { title:'Analytics',        sub:'Diagramme & Trends',                   render:renderAnalytics },
  fahrlehrer: { title:'Fahrlehrer',       sub:'Rentabilität & Auslastung',            render:renderFahrlehrer },
  leads:      { title:'Leads / CRM',      sub:'Interessenten & automatisches Nachfassen', render:renderLeads },
  bank:       { title:'Bankabgleich',     sub:'Automatische Zahlungszuordnung',       render:renderBank },
  anbindungen:{ title:'Anbindungen',      sub:'Schnittstellen für den Live-Betrieb',  render:renderAnbindungen },
};
function showView(name) {
  const v=VIEWS[name]; if (!v) return;
  v.render();
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-item[data-view]').forEach(n=>n.classList.toggle('active', n.dataset.view===name));
  document.getElementById('tb-title').textContent=v.title;
  document.getElementById('tb-sub').textContent=v.sub;
  document.querySelector('.content').scrollTop=0;
  closeNav();
}
document.getElementById('nav').addEventListener('click', e=>{ const item=e.target.closest('.nav-item[data-view]'); if (item) showView(item.dataset.view); });

function toggleNav() { document.body.classList.toggle('nav-open'); }
function closeNav()  { document.body.classList.remove('nav-open'); }
function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.addEventListener('keydown', e=>{ if (e.key==='Escape'){ closeModal(); closeNav(); } });

let toastTimer=null;
function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); if (toastTimer) clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3600); }
function onMonthChange(sel) { if (sel.value!=='2026-07'){ toast('Referenz-Datensatz ist Juli 2026 – andere Zeiträume folgen mit der Live-Anbindung.'); sel.value='2026-07'; } }

function updateBadges() {
  setBadge('nav-flotte-badge', flotteWarnungen().length);
  setBadge('nav-leads-badge', leads.filter(l=>{const f=leadFollowClass(l);return f&&f.c==='due'&&l.status!=='Angemeldet'&&l.status!=='Verloren';}).length);
  setBadge('nav-bank-badge', bankTx.filter(t=>t.status!=='auto'&&t.status!=='manuell').length);
  document.getElementById('foot-students').textContent=num(K.aktiveSchueler);
}
function setBadge(id, n) { const b=document.getElementById(id); if (!n){ b.style.display='none'; return; } b.style.display=''; b.textContent=n; }

initBankAbgleich();
updateBadges();
showView('dashboard');
</script>
