# Fetches the approved Higgsfield archive into the repository.
#
# Why this exists: the development sandbox's egress policy blocks the
# Higgsfield CDN, so the assets cannot be downloaded where the site is built.
# GitHub-hosted runners have unrestricted internet, so this workflow pulls the
# archive there — and, because the sandbox also has no ffmpeg, transcodes the
# videos to web weight on the runner — then commits everything to a dedicated
# assets branch, which the sandbox fetches through its authenticated git access.
#
# The asset list lives in scripts/higgsfield-manifest.json (semantic names,
# CDN URLs, which clips deserve a 1080p tier).
#
# Trigger: workflow_dispatch only works for workflows registered on the
# default branch, which belongs to a different session. A push trigger runs
# from the pushed ref itself, so it works from this branch — path-filtered so
# it only fires when this file or the manifest changes, not on every commit.
# Never touches the site branches.
name: fetch-assets

on:
  workflow_dispatch:
  push:
    branches: ['claude/fahrschule-krebs-website-hge31m']
    paths:
      - '.github/workflows/fetch-assets.yml'
      - 'scripts/higgsfield-manifest.json'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -version | head -1

      - name: Download and transcode
        run: |
          set -euo pipefail
          mkdir -p assets/video assets/poster assets/still raw

          count=$(jq length scripts/higgsfield-manifest.json)
          for i in $(seq 0 $((count - 1))); do
            kind=$(jq -r ".[$i].kind" scripts/higgsfield-manifest.json)
            name=$(jq -r ".[$i].name" scripts/higgsfield-manifest.json)
            url=$(jq -r ".[$i].url" scripts/higgsfield-manifest.json)

            if [ "$kind" = "video" ]; then
              hd=$(jq -r ".[$i].hd" scripts/higgsfield-manifest.json)
              curl -fsS --retry 3 -o "raw/$name.mp4" "$url"
              # 720p tier for every clip: background use behind overlays.
              ffmpeg -y -v error -i "raw/$name.mp4" -an -movflags +faststart \
                -vf "scale=-2:720" -c:v libx264 -preset medium -crf 26 \
                -pix_fmt yuv420p "assets/video/$name-720.mp4"
              # 1080p tier only where the clip is the subject, not the backdrop.
              if [ "$hd" = "true" ]; then
                ffmpeg -y -v error -i "raw/$name.mp4" -an -movflags +faststart \
                  -vf "scale=-2:1080" -c:v libx264 -preset medium -crf 25 \
                  -pix_fmt yuv420p "assets/video/$name-1080.mp4"
              fi
              # VP9 fallback: Chromium builds without proprietary codecs
              # (and our Playwright QA browser) cannot decode H.264 at all.
              ffmpeg -y -v error -i "raw/$name.mp4" -an \
                -vf "scale=-2:720" -c:v libvpx-vp9 -crf 34 -b:v 0 \
                -row-mt 1 -cpu-used 4 -pix_fmt yuv420p "assets/video/$name-720.webm"
              # Poster: first frame, ready for the <video poster> attribute.
              ffmpeg -y -v error -i "raw/$name.mp4" -frames:v 1 \
                -vf "scale=-2:720" -q:v 3 "assets/poster/$name.jpg"
              rm "raw/$name.mp4"
            else
              # Stills come down as 2k PNGs; JPEG q92 keeps the transfer sane.
              # The sandbox re-encodes to AVIF with sharp anyway.
              curl -fsS --retry 3 -o "raw/$name.png" "$url"
              ffmpeg -y -v error -i "raw/$name.png" -q:v 2 "assets/still/$name.jpg"
              rm "raw/$name.png"
            fi
            echo "done: $kind $name"
          done
          du -sh assets/*

      - name: Commit to assets branch
        run: |
          git config user.name "asset-fetch"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan higgsfield-assets
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f assets
          git commit -m "Higgsfield archive snapshot (videos transcoded)"
          git push -f origin higgsfield-assets
