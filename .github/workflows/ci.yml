# CI of the trading journal (trading-journal/): every push and pull request runs the checks of the local gate;
# pull requests additionally run the Playwright suite (mobile + desktop) against the production preview.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: trading-journal

jobs:
  check:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-journal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # personal edition (dist/), its first-load budget, then the share edition (dist/teilen/)
      - run: npm run build
      - run: npm run budget
      - run: npm run build:share

  e2e:
    name: E2E (Playwright, mobile + desktop)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # the whole suite takes close to an hour on one runner: two shards (split by test) run side by side
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-journal/package-lock.json
      - run: npm ci
      # Playwright's own Chromium (PW_CHROMIUM stays unset here; it only points at the pinned browser of the dev container)
      - run: npx playwright install --with-deps chromium
      # the config's webServer builds both editions and serves them with `vite preview` (CI=true: retries 1, no reuse)
      - run: npx playwright test --project=mobile --project=desktop --shard=${{ matrix.shard }}/2
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            trading-journal/playwright-report
            trading-journal/test-results
          retention-days: 7
